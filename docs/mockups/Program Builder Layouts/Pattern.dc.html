<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progression Pattern</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0B0D0C}
a{color:#C6FF3D}a:hover{color:#EDEEEA}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #C6FF3D;outline-offset:2px}
</style>
</helmet>
<div style="width: 720px; height: 760px; box-sizing: border-box; padding: 24px; background: #0B0D0C; color: #EDEEEA; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif; font-size: 14px; font-variant-numeric: tabular-nums">
  <section aria-label="Progression pattern" style="height: 100%; box-sizing: border-box; padding: 20px; border: 1px solid #2A2F2B; border-radius: 12px; background: #161917; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 20px">Repeat across weeks</h1>
      <span style="color: #8C948C">Back Squat, 4 × 5, Workout 1</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <div role="group" aria-label="Load type" style="display: flex; border: 1px solid #2A2F2B; border-radius: 8px; overflow: hidden">
        <sc-for list="{{seg}}" as="s" hint-placeholder-count="3">
          <button onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 44px; min-width: 72px; padding: 0 12px; border: none; background: {{s.bg}}; color: {{s.fg}}; font-weight: 600">{{s.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="color: #8C948C">Start</span>
        <button aria-label="Lower the starting load" onClick="{{lessStart}}" style="width: 44px; height: 44px; background: #0B0D0C; border: 1px solid #2A2F2B; border-radius: 8px; color: #EDEEEA; font-size: 18px">−</button>
        <span style="min-width: 76px; text-align: center; font-size: 16px; font-weight: 600">{{startText}}</span>
        <button aria-label="Raise the starting load" onClick="{{moreStart}}" style="width: 44px; height: 44px; background: #0B0D0C; border: 1px solid #2A2F2B; border-radius: 8px; color: #EDEEEA; font-size: 18px">+</button>
      </div>
    </div>

    <div role="group" aria-label="Pattern" style="display: flex; flex-direction: column; border: 1px solid #2A2F2B; border-radius: 8px; overflow: hidden">
      <sc-for list="{{patterns}}" as="p" hint-placeholder-count="5">
        <button onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0 14px; border: none; border-bottom: 1px solid #2A2F2B; background: {{p.bg}}; color: #EDEEEA; text-align: left; font-weight: {{p.weight}}">
          <span>{{p.label}}</span>
          <span style="color: #C6FF3D; font-weight: 600">{{p.mark}}</span>
        </button>
      </sc-for>
    </div>

    <sc-if value="{{showCustom}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="color: #8C948C">Change per week</span>
        <button aria-label="Decrease the weekly change" onClick="{{lessCustom}}" style="width: 44px; height: 44px; background: #0B0D0C; border: 1px solid #2A2F2B; border-radius: 8px; color: #EDEEEA; font-size: 18px">−</button>
        <span style="min-width: 76px; text-align: center; font-size: 16px; font-weight: 600">{{customText}}</span>
        <button aria-label="Increase the weekly change" onClick="{{moreCustom}}" style="width: 44px; height: 44px; background: #0B0D0C; border: 1px solid #2A2F2B; border-radius: 8px; color: #EDEEEA; font-size: 18px">+</button>
      </div>
    </sc-if>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{preview}}" as="w" hint-placeholder-count="4">
        <div style="padding: 10px; border: 1px solid #2A2F2B; border-radius: 8px; background: #0B0D0C; display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="color: #8C948C; font-size: 12px">{{w.label}}</span>
          <sc-if value="{{w.manual}}" hint-placeholder-val="{{ false }}">
            <input aria-label="{{w.aria}}" value="{{w.value}}" onChange="{{w.edit}}" style="width: 100%; box-sizing: border-box; padding: 6px; background: #161917; border: 1px solid #2A2F2B; border-radius: 6px; color: #EDEEEA; font: inherit; font-weight: 600">
          </sc-if>
          <sc-if value="{{w.auto}}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 16px; font-weight: 600; color: {{color}}">{{w.value}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px">
      <a href="Combined.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border: 1px solid #2A2F2B; border-radius: 8px; color: #EDEEEA; text-decoration: none">Cancel</a>
      <a href="Combined.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 8px; background: #C6FF3D; color: #0B0D0C; font-weight: 600; text-decoration: none">Apply</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      type: 'pct', pattern: 'small',
      start: { kg: 100, pct: 75, rpe: 7 },
      custom: { kg: 3.75, pct: 1, rpe: 0.25 },
      manual: { kg: ['100', '105', '110', '90'], pct: ['75', '77.5', '80', '70'], rpe: ['7', '7.5', '8', '6.5'] }
    };
  }
  fmt(t, v) {
    const n = String(Number(v.toFixed(2)));
    return t === 'kg' ? n + ' kg' : t === 'pct' ? n + '%' : 'RPE ' + n;
  }
  renderVals() {
    const { type, pattern, start, custom, manual } = this.state;
    const unit = { kg: 'kg', pct: '% of 1RM', rpe: 'RPE' }[type];
    const small = { kg: 2.5, pct: 2.5, rpe: 0.5 }[type];
    const large = { kg: 5, pct: 5, rpe: 1 }[type];
    const nudge = { kg: 1.25, pct: 0.5, rpe: 0.25 }[type];
    const startStep = { kg: 2.5, pct: 2.5, rpe: 0.5 }[type];
    const list = [
      ['same', 'Same every week'],
      ['small', '+' + small + ' ' + unit + ' per week'],
      ['large', '+' + large + ' ' + unit + ' per week']
    ];
    if (type === 'kg') list.push(['percent', '+5% per week, rounded to 2.5 kg']);
    list.push(['custom', 'Custom change per week']);
    list.push(['manual', 'Set each week manually']);
    const current = list.some(([id]) => id === pattern) ? pattern : 'same';
    const values = [];
    let v = start[type];
    for (let w = 0; w < 4; w++) {
      if (w > 0) {
        if (current === 'small') v += small;
        if (current === 'large') v += large;
        if (current === 'custom') v += custom[type];
        if (current === 'percent') v = Math.round((v * 1.05) / 2.5) * 2.5;
      }
      values.push(v);
    }
    const isManual = current === 'manual';
    const preview = values.map((val, w) => ({
      label: 'Week ' + (w + 1),
      aria: 'Week ' + (w + 1) + ' load',
      manual: isManual,
      auto: !isManual,
      value: isManual ? manual[type][w] : this.fmt(type, val),
      edit: (ev) => {
        const next = manual[type].slice();
        next[w] = ev.target.value;
        this.setState({ manual: { ...manual, [type]: next } });
      }
    }));
    const change = (key, obj, amount, min) => () =>
      this.setState({ [key]: { ...obj, [type]: Math.max(min, Number((obj[type] + amount).toFixed(2))) } });
    return {
      preview,
      color: type === 'kg' ? '#EDEEEA' : type === 'pct' ? '#C6FF3D' : '#8FC7FF',
      startText: this.fmt(type, start[type]),
      customText: '+' + String(custom[type]) + ' ' + (type === 'pct' ? '%' : unit),
      showCustom: current === 'custom',
      lessStart: change('start', start, -startStep, 0),
      moreStart: change('start', start, startStep, 0),
      lessCustom: change('custom', custom, -nudge, 0),
      moreCustom: change('custom', custom, nudge, 0),
      seg: [['kg', 'kg'], ['pct', '% 1RM'], ['rpe', 'RPE']].map(([k, label]) => ({
        label,
        pressed: k === type ? 'true' : 'false',
        bg: k === type ? '#C6FF3D' : 'transparent',
        fg: k === type ? '#0B0D0C' : '#EDEEEA',
        pick: () => this.setState({ type: k })
      })),
      patterns: list.map(([id, label]) => ({
        label,
        pressed: id === current ? 'true' : 'false',
        bg: id === current ? '#232A1A' : 'transparent',
        weight: id === current ? 600 : 400,
        mark: id === current ? 'Selected' : '',
        pick: () => this.setState({ pattern: id })
      }))
    };
  }
}
</script>
</body>
</html>

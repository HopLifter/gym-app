<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option C: Compact Counter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C6FF3D}a:hover{color:#EDEEEA}
</style>
</helmet>
<div style="width: 1240px; height: 844px; box-sizing: border-box; display: flex; background: #0B0D0C; color: #EDEEEA; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif">
  <div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px; overflow: hidden; flex-shrink: 0; border-right: 1px solid #2A2F2B">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #C6FF3D; font-weight: 700">Today's Workout</span>
      <button aria-label="Workout menu" style="background: none; border: none; color: #8C948C; font-size: 22px; padding: 2px 8px">⋮</button>
    </div>
    <h1 style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 8px">Push Day</h1>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px">
      <span style="background: #1F2320; border: 1px solid #2A2F2B; border-radius: 8px; font-size: 13px; font-weight: 600; padding: 6px 10px">03/11/2026</span>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-size: 15px; font-weight: 700">24:18</span>
        <button style="background: #1F2320; border: 1px solid #7A9A2E; border-radius: 8px; color: #C6FF3D; font-size: 13px; font-weight: 700; padding: 6px 12px">Pause</button>
      </div>
    </div>
    <div style="background: #161917; border: 1px solid #C6FF3D; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px">
      <div style="font-size: 17px; font-weight: 600; margin-bottom: 10px">Bench</div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 10px; color: #8C948C; text-transform: uppercase">{{s.label}}</span>
            <span style="background: #1F2320; border: 1px solid #2A2F2B; border-radius: 6px; font-size: 14px; padding: 6px 4px; text-align: center">{{s.value}}</span>
          </div>
        </sc-for>
      </div>
      <div style="font-size: 13px; color: #A8C860; font-weight: 600">Volume: 2500</div>
    </div>
    <div style="background: #161917; border: 1px solid #2A2F2B; border-radius: 14px; padding: 14px 16px">
      <div style="font-size: 17px; font-weight: 600">Overhead Press</div>
    </div>
    <sc-for list="{{phoneBars}}" as="b" hint-placeholder-count="1">
      <div style="position: absolute; left: 16px; bottom: 82px; box-sizing: border-box; width: 358px; background: #1F2320; border: 1px solid {{b.border}}; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.4)">
        <div style="width: 62px; height: 62px; box-sizing: border-box; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #161917; border: 1px solid #2A2F2B; border-radius: 10px">
          <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: #8C948C">SET</span>
          <span style="font-weight: 800; color: #EDEEEA"><span style="font-size: 26px; color: #C6FF3D">{{b.current}}</span><span style="font-size: 15px">/{{b.total}}</span></span>
        </div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 11px; color: #8C948C; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.label}}</div>
          <div style="font-size: {{b.timeSize}}; font-weight: 800; color: {{b.timeColor}}">{{b.time}}</div>
          <div style="height: 4px; background: #161917; border-radius: 2px; overflow: hidden; margin-top: 6px"><div style="height: 100%; width: {{b.fill}}; background: #C6FF3D"></div></div>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0">
          <sc-if value="{{b.showPause}}" hint-placeholder-val="{{ true }}"><button style="background: #161917; border: 1px solid #7A9A2E; border-radius: 8px; color: #C6FF3D; font-size: 13px; font-weight: 700; padding: 8px 8px">Pause</button></sc-if>
          <sc-if value="{{b.showReset}}" hint-placeholder-val="{{ true }}"><button style="background: #161917; border: 1px solid #2A2F2B; border-radius: 8px; color: #EDEEEA; font-size: 13px; font-weight: 700; padding: 8px 8px">Reset</button></sc-if>
          <button aria-label="Close timer" style="background: none; border: none; color: #8C948C; font-size: 18px; padding: 2px 3px">✕</button>
        </div>
      </div>
    </sc-for>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 0; display: flex">
      <button style="flex: 1; height: 66px; box-sizing: border-box; background: #161917; border: 1px solid #2A2F2B; border-bottom: none; border-radius: 14px 14px 0 0; color: #8C948C; font-size: 12px; font-weight: 700">History</button>
      <button style="flex: 1; height: 66px; box-sizing: border-box; background: #161917; border: 1px solid #C6FF3D; border-bottom: none; border-radius: 14px 14px 0 0; color: #C6FF3D; font-size: 12px; font-weight: 700">Today</button>
      <button style="flex: 1; height: 66px; box-sizing: border-box; background: #161917; border: 1px solid #2A2F2B; border-bottom: none; border-radius: 14px 14px 0 0; color: #8C948C; font-size: 12px; font-weight: 700">Queue</button>
      <button style="flex: 1; height: 66px; box-sizing: border-box; background: #161917; border: 1px solid #2A2F2B; border-bottom: none; border-radius: 14px 14px 0 0; color: #8C948C; font-size: 12px; font-weight: 700">Settings</button>
    </div>
  </div>
  <div style="flex: 1; box-sizing: border-box; padding: 32px 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; row-gap: 24px; align-content: start">
    <sc-for list="{{states}}" as="b" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 700; color: #EDEEEA">{{b.caption}}</span>
        <div style="box-sizing: border-box; width: 358px; background: #1F2320; border: 1px solid {{b.border}}; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
          <div style="width: 62px; height: 62px; box-sizing: border-box; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #161917; border: 1px solid #2A2F2B; border-radius: 10px">
            <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: #8C948C">SET</span>
            <span style="font-weight: 800; color: #EDEEEA"><span style="font-size: 26px; color: #C6FF3D">{{b.current}}</span><span style="font-size: 15px">/{{b.total}}</span></span>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 11px; color: #8C948C; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.label}}</div>
            <div style="font-size: {{b.timeSize}}; font-weight: 800; color: {{b.timeColor}}">{{b.time}}</div>
            <div style="height: 4px; background: #161917; border-radius: 2px; overflow: hidden; margin-top: 6px"><div style="height: 100%; width: {{b.fill}}; background: #C6FF3D"></div></div>
          </div>
          <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0">
            <sc-if value="{{b.showPause}}" hint-placeholder-val="{{ true }}"><button style="background: #161917; border: 1px solid #7A9A2E; border-radius: 8px; color: #C6FF3D; font-size: 13px; font-weight: 700; padding: 8px 8px">Pause</button></sc-if>
            <sc-if value="{{b.showReset}}" hint-placeholder-val="{{ true }}"><button style="background: #161917; border: 1px solid #2A2F2B; border-radius: 8px; color: #EDEEEA; font-size: 13px; font-weight: 700; padding: 8px 8px">Reset</button></sc-if>
            <button aria-label="Close timer" style="background: none; border: none; color: #8C948C; font-size: 18px; padding: 2px 3px">✕</button>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1240,"height":844}}'>
class Component extends DCLogic {
  bar(o) {
    return Object.assign({
      border: '#7A9A2E', timeSize: '22px', timeColor: '#C6FF3D', fill: '60%', showPause: false, showReset: true
    }, o);
  }
  renderVals() {
    const finished = { border: '#C6FF3D', timeSize: '15px', timeColor: '#EDEEEA', fill: '0%' };
    const overtime = { border: '#E05C4E', timeColor: '#E05C4E', fill: '0%' };
    return {
      stats: [
        { label: 'Sets', value: '5' }, { label: 'Reps', value: '5' }, { label: 'Weight', value: '100' },
        { label: 'RPE', value: '8' }, { label: 'Rest', value: '3' }
      ],
      phoneBars: [this.bar({ total: 5, current: 2, label: 'Bench', time: '1:47', showPause: true })],
      states: [
        this.bar({ caption: 'Rest Complete', total: 5, current: 2, label: 'Bench', time: 'Rest Complete', ...finished }),
        this.bar({ caption: 'Overtime', total: 5, current: 2, label: 'Bench', time: '+01:12', ...overtime }),
        this.bar({ caption: 'Next set after Reset', total: 5, current: 3, label: 'Bench', time: '3:00', fill: '100%', showPause: true }),
        this.bar({ caption: 'Final set', total: 5, current: 5, label: 'Bench', time: '0:58', fill: '32%', showPause: true }),
        this.bar({ caption: 'Superset', total: 4, current: 2, label: 'DB Bench + Seated Rows', time: '1:12', fill: '80%', showPause: true }),
        this.bar({ caption: 'All sets complete', total: 5, current: 5, label: 'Bench', time: 'All sets complete', timeSize: '16px', timeColor: '#EDEEEA', border: '#C6FF3D', fill: '0%', showReset: false })
      ]
    };
  }
}
</script>
</body>
</html>

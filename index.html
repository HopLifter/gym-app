<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Today's Lift</title>
<style>
  :root {
    --bg: #0B0D0C;
    --surface: #161917;
    --surface-2: #1F2320;
    --line: #2A2F2B;
    --text: #EDEEEA;
    --text-dim: #8C948C;
    --accent: #C6FF3D;
    --accent-dim: #7A9A2E;
    --done: #3A4A2E;
    --danger: #E05C4E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
    padding: 20px 16px 100px;
    max-width: 480px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }
  .date { font-size: 12px; color: var(--text-dim); }
  h1 {
    font-size: 28px;
    margin: 6px 0 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .exercise {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .ex-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    position: relative;
  }
  .name-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--line);
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
    padding: 4px 2px;
    min-width: 0;
  }
  .name-input:focus { outline: none; border-bottom-color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; position: relative; }
  .menu-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 20px; cursor: pointer; padding: 2px 8px;
    line-height: 1;
  }
  .menu-dropdown {
    display: none;
    position: absolute;
    top: 30px; right: 0;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    z-index: 10;
    min-width: 150px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .menu-dropdown.open { display: block; }
  .menu-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    font-size: 14px;
    padding: 10px 14px;
    cursor: pointer;
  }
  .menu-dropdown button:not(:last-child) { border-bottom: 1px solid var(--line); }
  .menu-dropdown button[data-action="delete"] { color: var(--danger); }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .stat-field { display: flex; flex-direction: column; gap: 2px; }
  .stat-field label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-field input {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    padding: 6px 4px;
    width: 100%;
    text-align: center;
  }
  .stat-field input:focus { outline: none; border-color: var(--accent); }
  /* Hide the tiny up/down arrows on number inputs */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }

  .superset-group {
    border: 1px solid var(--accent-dim);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .superset-label {
    background: var(--surface-2);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 6px 14px;
  }
  .superset-group .exercise {
    border: none;
    border-radius: 0;
    margin-bottom: 0;
  }
  .superset-group .exercise + .exercise {
    border-top: 1px dashed var(--line);
  }
  .select-banner {
    position: fixed;
    top: 16px; left: 16px; right: 16px;
    max-width: 448px; margin: 0 auto;
    background: var(--surface-2);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px 16px;
    display: none;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    z-index: 20;
  }
  .select-banner.visible { display: flex; }
  .select-banner button {
    background: none; border: none; color: var(--danger);
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .exercise.selectable { outline: 2px dashed var(--accent); outline-offset: 2px; cursor: pointer; }
  .volume {
    font-size: 13px;
    color: var(--accent-dim);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .volume span { color: var(--accent); }
  textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 8px 10px;
    font-family: inherit;
    resize: vertical;
    min-height: 40px;
  }
  textarea::placeholder { color: var(--text-dim); }
  .add-btn {
    width: 100%;
    background: var(--surface);
    border: 1px dashed var(--accent-dim);
    border-radius: 14px;
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
    padding: 14px;
    cursor: pointer;
    margin-top: 6px;
  }
  .status { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 24px; letter-spacing: 0.04em; }
  .status.saved { color: var(--accent-dim); }
  .undo-banner {
    position: fixed;
    bottom: 16px; left: 16px; right: 16px;
    max-width: 448px; margin: 0 auto;
    background: var(--surface-2);
    border: 1px solid var(--accent-dim);
    border-radius: 12px;
    padding: 12px 16px;
    display: none;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
  }
  .undo-banner.visible { display: flex; }
  .undo-banner button {
    background: none; border: none; color: var(--accent);
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <span class="eyebrow">Today's Lift</span>
  <span class="date" id="date"></span>
</header>
<h1 id="dayTitle">Push Day</h1>

<div id="workout"></div>
<button class="add-btn" id="addBtn">+ Add Exercise</button>

<div class="status" id="status">Changes save automatically on this phone</div>

<div class="undo-banner" id="undoBanner">
  <span id="undoText">Exercise deleted</span>
  <button id="undoBtn">Undo</button>
</div>

<div class="select-banner" id="selectBanner">
  <span id="selectText">Tap an exercise to pair it with</span>
  <button id="cancelSelectBtn">Cancel</button>
</div>

<script>
  const STORAGE_KEY = "gymapp_state_v3";

  const defaultExercises = [
    { id: "ex1", name: "Barbell Bench Press", sets: 4, reps: 6, weight: 135, rpe: 8, rest: 90, notes: "", supersetId: null },
    { id: "ex2", name: "Overhead Press",       sets: 3, reps: 8, weight: 65,  rpe: 7, rest: 90, notes: "", supersetId: null },
    { id: "ex3", name: "Incline DB Press",     sets: 3, reps: 10, weight: 40, rpe: 7, rest: 75, notes: "", supersetId: null },
    { id: "ex4", name: "Tricep Pushdown",      sets: 3, reps: 12, weight: 40, rpe: 8, rest: 60, notes: "", supersetId: null },
    { id: "ex5", name: "Lateral Raise",        sets: 3, reps: 15, weight: 15, rpe: 8, rest: 45, notes: "", supersetId: null }
  ];

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.exercises)) return saved;
    } catch (e) {}
    return { exercises: defaultExercises };
  }

  let state = loadState();
  let lastDeleted = null;   // { exercise, index }
  let undoTimer = null;
  let openMenuId = null;    // which exercise's ⋮ menu is currently open
  let supersettingId = null; // if set, we're waiting for a second tap to pair this exercise

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const status = document.getElementById("status");
    status.textContent = "Saved just now";
    status.classList.add("saved");
    clearTimeout(saveState._t);
    saveState._t = setTimeout(() => {
      status.textContent = "Changes save automatically on this phone";
      status.classList.remove("saved");
    }, 1200);
  }

  function calcVolume(ex) {
    const s = Number(ex.sets) || 0;
    const r = Number(ex.reps) || 0;
    const w = Number(ex.weight) || 0;
    return s * r * w;
  }

  function newId() {
    return "ex" + Date.now() + Math.floor(Math.random() * 1000);
  }

  function cardHTML(ex) {
    const selectable = supersettingId && supersettingId !== ex.id;
    return `
      <div class="exercise${selectable ? " selectable" : ""}" data-id="${ex.id}">
        <div class="ex-header">
          <input class="name-input" data-field="name" value="${escapeAttr(ex.name)}" placeholder="Exercise name">
          <div class="header-right">
            <button class="menu-btn" data-action="menu">⋮</button>
            <div class="menu-dropdown${openMenuId === ex.id ? " open" : ""}">
              <button data-action="delete">Delete</button>
              <button data-action="move-up">Move Up</button>
              <button data-action="move-down">Move Down</button>
              <button data-action="superset">${ex.supersetId ? "Remove Superset" : "Superset"}</button>
            </div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-field"><label>Sets</label><input type="number" inputmode="numeric" data-field="sets" value="${ex.sets}"></div>
          <div class="stat-field"><label>Reps</label><input type="number" inputmode="numeric" data-field="reps" value="${ex.reps}"></div>
          <div class="stat-field"><label>Weight</label><input type="number" inputmode="decimal" data-field="weight" value="${ex.weight}"></div>
          <div class="stat-field"><label>RPE</label><input type="number" inputmode="decimal" data-field="rpe" value="${ex.rpe}"></div>
          <div class="stat-field"><label>Rest(s)</label><input type="number" inputmode="numeric" data-field="rest" value="${ex.rest}"></div>
        </div>
        <div class="volume">Volume: <span class="volume-value">${calcVolume(ex)}</span></div>
        <textarea placeholder="Notes — how it felt, adjustments, etc." data-field="notes">${escapeHtml(ex.notes)}</textarea>
      </div>
    `;
  }

  // Groups consecutive exercises that share a supersetId into one
  // bordered wrapper, so they render side by side with a visual link.
  function render() {
    const container = document.getElementById("workout");
    container.innerHTML = "";
    const exs = state.exercises;
    let i = 0;
    while (i < exs.length) {
      const ex = exs[i];
      const next = exs[i + 1];
      if (ex.supersetId && next && next.supersetId === ex.supersetId) {
        const wrap = document.createElement("div");
        wrap.className = "superset-group";
        wrap.innerHTML = `<div class="superset-label">⚡ Superset</div>${cardHTML(ex)}${cardHTML(next)}`;
        container.appendChild(wrap);
        i += 2;
      } else {
        const temp = document.createElement("div");
        temp.innerHTML = cardHTML(ex);
        container.appendChild(temp.firstElementChild);
        i += 1;
      }
    }
  }

  function escapeHtml(str) {
    return (str || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }
  function escapeAttr(str) {
    return (str || "").replace(/"/g, "&quot;");
  }

  function findExercise(id) {
    return state.exercises.find(e => e.id === id);
  }

  // Event delegation: one set of listeners on the container handles all cards,
  // including cards added later.
  const container = document.getElementById("workout");

  container.addEventListener("click", (e) => {
    const card = e.target.closest(".exercise");
    if (!card) return;
    const id = card.dataset.id;
    const ex = findExercise(id);
    if (!ex) return;
    const action = e.target.dataset.action;

    // If we're in "pick a partner" mode, any tap on a different card pairs them.
    if (supersettingId && supersettingId !== id && !action) {
      pairSuperset(supersettingId, id);
      return;
    }

    if (action === "menu") {
      e.stopPropagation();
      openMenuId = openMenuId === id ? null : id;
      render();
      return;
    }

    if (action === "delete") {
      openMenuId = null;
      const index = state.exercises.findIndex(x => x.id === id);
      lastDeleted = { exercise: ex, index };
      state.exercises.splice(index, 1);
      saveState();
      render();
      showUndo(ex.name);
      return;
    }

    if (action === "move-up" || action === "move-down") {
      openMenuId = null;
      const index = state.exercises.findIndex(x => x.id === id);
      const target = action === "move-up" ? index - 1 : index + 1;
      if (target >= 0 && target < state.exercises.length) {
        const [moved] = state.exercises.splice(index, 1);
        state.exercises.splice(target, 0, moved);
        saveState();
      }
      render();
      return;
    }

    if (action === "superset") {
      openMenuId = null;
      if (ex.supersetId) {
        // Already paired: unlink it
        ex.supersetId = null;
        saveState();
        render();
      } else {
        // Enter "pick a partner" mode
        supersettingId = id;
        document.getElementById("selectText").textContent = `Tap an exercise to pair with "${ex.name}"`;
        document.getElementById("selectBanner").classList.add("visible");
        render();
      }
      return;
    }
  });

  function pairSuperset(idA, idB) {
    const exA = findExercise(idA);
    const exB = findExercise(idB);
    if (!exA || !exB) return;
    const groupId = exA.supersetId || newId();
    exA.supersetId = groupId;
    exB.supersetId = groupId;
    // Move exB to sit immediately after exA so they render side by side
    const indexB = state.exercises.findIndex(x => x.id === idB);
    const [moved] = state.exercises.splice(indexB, 1);
    const indexA = state.exercises.findIndex(x => x.id === idA);
    state.exercises.splice(indexA + 1, 0, moved);
    supersettingId = null;
    document.getElementById("selectBanner").classList.remove("visible");
    saveState();
    render();
  }

  document.getElementById("cancelSelectBtn").addEventListener("click", () => {
    supersettingId = null;
    document.getElementById("selectBanner").classList.remove("visible");
    render();
  });

  // Close the ⋮ menu when tapping anywhere outside it
  document.addEventListener("click", (e) => {
    if (openMenuId && !e.target.closest(".menu-btn") && !e.target.closest(".menu-dropdown")) {
      openMenuId = null;
      render();
    }
  });

  container.addEventListener("input", (e) => {
    const card = e.target.closest(".exercise");
    if (!card) return;
    const id = card.dataset.id;
    const ex = findExercise(id);
    if (!ex) return;
    const field = e.target.dataset.field;
    if (!field) return;

    if (["sets", "reps", "weight", "rpe", "rest"].includes(field)) {
      ex[field] = e.target.value === "" ? "" : Number(e.target.value);
      // Update just the volume number, not the whole card, so focus isn't lost
      card.querySelector(".volume-value").textContent = calcVolume(ex);
    } else {
      ex[field] = e.target.value;
    }
    saveState();
  });

  function showUndo(name) {
    const banner = document.getElementById("undoBanner");
    document.getElementById("undoText").textContent = `"${name}" deleted`;
    banner.classList.add("visible");
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => {
      banner.classList.remove("visible");
      lastDeleted = null;
    }, 6000);
  }

  document.getElementById("undoBtn").addEventListener("click", () => {
    if (!lastDeleted) return;
    state.exercises.splice(lastDeleted.index, 0, lastDeleted.exercise);
    saveState();
    render();
    document.getElementById("undoBanner").classList.remove("visible");
    clearTimeout(undoTimer);
    lastDeleted = null;
  });

  document.getElementById("addBtn").addEventListener("click", () => {
    const ex = { id: newId(), name: "New Exercise", sets: 3, reps: 10, weight: 0, rpe: "", rest: 60, notes: "", supersetId: null };
    state.exercises.push(ex);
    saveState();
    render();
    // Scroll to and focus the new exercise's name field
    setTimeout(() => {
      const cards = document.querySelectorAll(".exercise");
      const last = cards[cards.length - 1];
      if (last) {
        last.scrollIntoView({ behavior: "smooth", block: "center" });
        last.querySelector(".name-input").focus();
      }
    }, 50);
  });

  document.getElementById("date").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "short", month: "short", day: "numeric"
  });

  render();

  // Register service worker for offline use
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js");
    });
  }
</script>

</body>
</html>

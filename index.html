<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymLog Program Builder</title>
<style>
  :root {
    --bg: #0B0D0C;
    --surface: #161917;
    --line: #2A2F2B;
    --text: #EDEEEA;
    --text-dim: #8C948C;
    --accent: #C6FF3D;
    --danger: #E05C4E;
    --rpe: #8FC7FF;
    --selected-bg: #232A1A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    min-width: 1024px;
  }
  button, input {
    font: inherit;
    color: var(--text);
  }
  button {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--text-dim); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  /* ---- Header ---- */
  .header {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .field { display: flex; align-items: center; gap: 8px; }
  .field label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  #name-input { width: 260px; font-size: 16px; font-weight: 600; }
  #block-input { width: 56px; text-align: center; }
  .stepper { display: flex; align-items: center; }
  .stepper button { width: 32px; padding: 7px 0; font-size: 16px; line-height: 1; }
  .stepper .value { min-width: 36px; text-align: center; font-weight: 600; }
  .header-buttons { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

  /* ---- Grid ---- */
  .main { padding: 20px; }
  .grid-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }
  table.grid th, table.grid td {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    vertical-align: top;
    text-align: left;
  }
  table.grid tr:last-child td { border-bottom: none; }
  table.grid th:last-child, table.grid td:last-child { border-right: none; }
  table.grid th {
    padding: 10px 12px;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  table.grid .week-col { min-width: 220px; }
  table.grid .workout-col {
    position: sticky; left: 0; z-index: 2;
    min-width: 200px; max-width: 200px;
    background: var(--surface);
    box-shadow: 1px 0 0 var(--line);
  }
  table.grid td.workout-col { padding: 12px; }
  .workout-title { font-weight: 700; margin-bottom: 6px; }
  .workout-desc { width: 100%; }
  td.cell { padding: 8px; }
  .ex {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    background: var(--bg);
  }
  .ex-top { display: flex; gap: 6px; align-items: baseline; }
  .ex-label { color: var(--accent); font-weight: 700; min-width: 22px; }
  .ex-name { font-weight: 600; word-break: break-word; }
  .ex-scheme { color: var(--text-dim); margin-top: 2px; }
  .ex-load { margin-top: 2px; font-weight: 600; }
  /* All load types use the accent colour; the text itself names the type (kg, %, RPE). */
  .load-kg, .load-pct, .load-rpe { color: var(--accent); }
  .load-blank { color: var(--text-dim); font-style: italic; font-weight: 400; }
  .ex-more { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .ex-edited { color: var(--text-dim); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .add-ex { width: 100%; border-style: dashed; color: var(--text-dim); }

  .ex.selected { border-color: var(--accent); background: var(--selected-bg); }
  .ex-group { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; margin-top: 2px; }
  .ex-group .ex-scheme, .ex-group .ex-load { margin-top: 0; }
  .ex-group + .ex-group { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 6px; }

  /* ---- Exercise table ---- */
  .detail {
    position: sticky; bottom: 0; z-index: 10;
    max-height: 380px; display: flex; flex-direction: column;
    background: var(--surface); border-top: 2px solid var(--accent);
  }
  .detail[hidden] { display: none; }
  .detail-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 20px; border-bottom: 1px solid var(--line);
  }
  .detail-body { overflow: auto; }
  table.detail-table { border-collapse: separate; border-spacing: 0; width: 100%; }
  .detail-table th, .detail-table td {
    padding: 8px 10px; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
  }
  .detail-table th {
    position: sticky; top: 0; z-index: 3; background: var(--surface);
    color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .detail-table .ex-col {
    position: sticky; left: 0; z-index: 2; min-width: 190px; background: var(--surface); cursor: pointer;
  }
  .detail-table th.ex-col { z-index: 4; cursor: default; }
  .detail-table .wk { min-width: 116px; }
  .detail-table td.wk.clickable { cursor: pointer; }
  .detail-table td.wk.clickable:hover { background: var(--bg); }
  .detail-table tr.selected td { background: var(--selected-bg); }
  .detail-table tr.selected td.ex-col { box-shadow: inset 3px 0 0 var(--accent); }
  .detail-table .wk-none { color: var(--text-dim); margin-bottom: 6px; }
  .detail-table .actions-col { min-width: 150px; }
  .detail-table .actions-col button { margin: 0 4px 4px 0; padding: 4px 8px; font-size: 12px; }
  .danger-text { color: var(--danger); }
  .segmented { display: inline-flex; }
  .segmented button { border-radius: 0; margin-left: -1px; padding: 5px 12px; }
  .segmented button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .segmented button:last-child { border-radius: 0 8px 8px 0; }
  .segmented button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; position: relative; }
  .pattern-btn { max-width: 170px; white-space: normal; text-align: left; }
  .rest-line { margin-top: 4px; color: var(--text-dim); font-size: 12px; }
  .rest-input { width: 48px; padding: 3px 6px; text-align: center; }
  .ex.clickable { cursor: pointer; }
  .ex.clickable:hover { border-color: var(--text-dim); }
  .ex.clickable:focus-visible { outline: 2px solid var(--accent); }

  /* ---- Forms inside modals ---- */
  .modal.wide { width: 560px; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .form-row label, .group-row label { color: var(--text-dim); font-size: 12px; }
  .form-cols { display: flex; gap: 12px; }
  .form-cols .form-row { flex: 1; }
  .modal input[type="text"], .modal select, .modal textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit;
  }
  .modal textarea { resize: vertical; min-height: 56px; }
  .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
  .form-warning { color: var(--rpe); font-size: 12px; margin-top: -6px; margin-bottom: 12px; }
  .form-error { color: var(--danger); margin-bottom: 12px; }
  .modal .sub { margin: -4px 0 14px; color: var(--text-dim); }
  .group-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
  .group-row > div { flex: 1; min-width: 0; }
  .group-row .del { flex: 0 0 auto; }
  .modal .actions .left { margin-right: auto; display: flex; gap: 8px; }

  /* ---- Modal and notice ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; width: 420px; max-width: 90vw;
  }
  .modal h2 { margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0 0 18px; color: var(--text-dim); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .notice {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--accent); color: var(--text);
    padding: 10px 18px; border-radius: 8px; z-index: 200;
  }
  #save-warning { color: var(--danger); padding: 8px 20px 0; }
</style>
</head>
<body>
  <div class="header" id="header"></div>
  <div id="save-warning" hidden>The draft could not be saved in this browser. Changes will be lost when the page closes.</div>
  <div class="main"><div class="grid-wrap" id="grid"></div></div>
  <div class="detail" id="detail" hidden></div>

<script>
'use strict';

/* ==========================================================================
   DATA MODEL (spec section 6)
   Pure functions: no drawing code here, so they are easy to test and reuse.
   ========================================================================== */

var DRAFT_KEY = 'builder_draft_v1';
var EXERCISE_LIST_KEY = 'builder_exercise_list_v1';
var FORMAT_NAME = 'gym-program-builder';
var FORMAT_VERSION = 1;
var MAX_WEEKS = 12;
var MAX_WORKOUTS = 7;

var nextIdNumber = 1; // used by makeId(); reset from the program after loading

function makeId(prefix) {
  return prefix + '_' + (nextIdNumber++);
}

// Look through a program and make sure new ids never repeat existing ones.
function syncIdCounter(program) {
  var highest = 0;
  function check(id) {
    var n = parseInt(String(id).split('_')[1], 10);
    if (n > highest) highest = n;
  }
  program.workouts.forEach(function (w) {
    check(w.id);
    w.exercises.forEach(function (e) {
      check(e.id);
      if (e.supersetId) check(e.supersetId);
    });
  });
  nextIdNumber = highest + 1;
}

function newGroup() {
  return { sets: 3, reps: 10, loadType: 'kg', load: null, rpe: null, kg: null };
}

function newWeekEntry() {
  return { included: true, edited: false, groups: [newGroup()] };
}

// A new exercise has one weeks[] entry per program week (spec section 6).
function newExercise(name, weekCount) {
  var weeks = [];
  for (var i = 0; i < weekCount; i++) weeks.push(newWeekEntry());
  return {
    id: makeId('ex'),
    name: name,
    rest: 90,
    notes: '',
    supersetId: null,
    pattern: { kind: 'same', type: 'kg', amount: 0 },
    weeks: weeks
  };
}

function newWorkout() {
  return { id: makeId('wk'), description: '', exercises: [] };
}

// Spec 5.1: first visit opens "New Program", Block 1, 4 weeks, 3 workouts per week.
function createDefaultProgram() {
  nextIdNumber = 1;
  var workouts = [];
  for (var i = 0; i < 3; i++) workouts.push(newWorkout());
  return {
    format: FORMAT_NAME,
    version: FORMAT_VERSION,
    name: 'New Program',
    block: 1,
    weeks: 4,
    workoutsPerWeek: 3,
    workouts: workouts
  };
}

/* --------------------------------------------------------------------------
   Validation. Anything that comes from outside (localStorage now, opened
   files later) is untrusted, so we check every field before using it.
   Returns true only if the object has the full, correct shape.
   -------------------------------------------------------------------------- */

function isNum(v) { return typeof v === 'number' && isFinite(v); }
function isNumOrNull(v) { return v === null || isNum(v); }
function isWholeBetween(v, lo, hi) { return isNum(v) && Math.floor(v) === v && v >= lo && v <= hi; }

function isValidGroup(g) {
  return !!g && typeof g === 'object'
    && isWholeBetween(g.sets, 1, 99)
    && isWholeBetween(g.reps, 1, 999)
    && (g.loadType === 'kg' || g.loadType === 'pct' || g.loadType === 'rpe')
    && isNumOrNull(g.load)
    && isNumOrNull(g.rpe)
    && (g.loadType !== 'rpe' || g.rpe === null)
    && isNumOrNull(g.kg);
}

function isValidWeekEntry(w) {
  return !!w && typeof w === 'object'
    && typeof w.included === 'boolean'
    && typeof w.edited === 'boolean'
    && Array.isArray(w.groups)
    && w.groups.length >= 1 && w.groups.length <= 20
    && w.groups.every(isValidGroup);
}

function isValidPattern(p) {
  return !!p && typeof p === 'object'
    && (p.kind === 'same' || p.kind === 'add' || p.kind === 'percent' || p.kind === 'manual')
    && (p.type === 'kg' || p.type === 'pct' || p.type === 'rpe')
    && isNum(p.amount);
}

function isValidExercise(e, weekCount) {
  return !!e && typeof e === 'object'
    && typeof e.id === 'string' && /^ex_\d+$/.test(e.id)
    && typeof e.name === 'string' && e.name.length <= 200
    && isNum(e.rest) && e.rest >= 0
    && typeof e.notes === 'string'
    && (e.supersetId === null || typeof e.supersetId === 'string')
    && isValidPattern(e.pattern)
    && Array.isArray(e.weeks) && e.weeks.length === weekCount
    && e.weeks.every(isValidWeekEntry);
}

function isValidProgram(p) {
  if (!p || typeof p !== 'object') return false;
  if (p.format !== FORMAT_NAME) return false;
  if (!isWholeBetween(p.version, 1, FORMAT_VERSION)) return false; // higher version = reject (spec 5.13)
  if (typeof p.name !== 'string' || p.name.length > 200) return false;
  if (!isWholeBetween(p.block, 1, 9999)) return false;
  if (!isWholeBetween(p.weeks, 1, MAX_WEEKS)) return false;
  if (!isWholeBetween(p.workoutsPerWeek, 1, MAX_WORKOUTS)) return false;
  if (!Array.isArray(p.workouts) || p.workouts.length !== p.workoutsPerWeek) return false;
  for (var i = 0; i < p.workouts.length; i++) {
    var w = p.workouts[i];
    if (!w || typeof w !== 'object') return false;
    if (typeof w.id !== 'string' || !/^wk_\d+$/.test(w.id)) return false;
    if (typeof w.description !== 'string' || w.description.length > 500) return false;
    if (!Array.isArray(w.exercises)) return false;
    for (var j = 0; j < w.exercises.length; j++) {
      if (!isValidExercise(w.exercises[j], p.weeks)) return false;
    }
  }
  return true;
}

/* --------------------------------------------------------------------------
   Draft storage (spec 5.13). localStorage can fail (private mode, full disk),
   so every call is wrapped in try/catch.
   -------------------------------------------------------------------------- */

function saveDraft(program) {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify(program));
    return true;
  } catch (err) {
    return false;
  }
}

// Returns a valid program, or null if there is no draft or it is damaged.
function loadDraft() {
  try {
    var text = localStorage.getItem(DRAFT_KEY);
    if (text === null) return null;
    var data = JSON.parse(text);
    return isValidProgram(data) ? data : null;
  } catch (err) {
    return null;
  }
}

/* ==========================================================================
   CALCULATIONS (spec 5.9, 5.10). Pure functions: no drawing, no storage.
   ========================================================================== */

// Removes tiny floating-point errors, e.g. 0.1 + 0.2 = 0.30000000000000004.
function cleanNum(v) { return Math.round(v * 10000) / 10000; }

function cloneGroup(g) {
  return { sets: g.sets, reps: g.reps, loadType: g.loadType, load: g.load, rpe: g.rpe, kg: g.kg };
}

// The load one week later, following the pattern. `load` is never null here.
function nextLoad(load, pattern) {
  if (pattern.kind === 'add') return cleanNum(load + pattern.amount);
  if (pattern.kind === 'percent') {
    // +5% rounded to the nearest 2.5 kg: round(previous x 1.05 / 2.5) x 2.5
    return cleanNum(Math.round(load * (1 + pattern.amount / 100) / 2.5) * 2.5);
  }
  return load; // 'same' and 'manual' copy the previous week
}

// Builds the full weeks[] array for an exercise from Week 1 and its pattern.
// - Week 1 is the source and is returned unchanged.
// - Edited weeks are kept exactly as they are.
// - Other weeks are regenerated. Each one starts from the previous week's
//   GENERATED value (not from a hand-edited value).
// - A blank Week 1 load stays blank. A group's kg value is kept only if its
//   load type and load did not change.
// Returns a new array of length weekCount; the exercise itself is not changed.
function generateWeeks(exercise, weekCount) {
  var week1 = exercise.weeks[0];
  var result = [week1];
  var previous = week1.groups.map(cloneGroup); // generated groups of the previous week
  for (var i = 1; i < weekCount; i++) {
    var generated = previous.map(function (prev) {
      var g = cloneGroup(prev);
      g.kg = null;
      g.rpe = prev.rpe;
      if (g.loadType === exercise.pattern.type && g.load !== null) {
        g.load = nextLoad(g.load, exercise.pattern);
      }
      return g;
    });
    var existing = exercise.weeks[i];
    if (existing && existing.edited) {
      result.push(existing);
    } else {
      // Keep kg values for set groups whose prescription did not change.
      if (existing) {
        generated.forEach(function (g, k) {
          var old = existing.groups[k];
          if (old && old.loadType === g.loadType && old.load === g.load) g.kg = old.kg;
        });
      }
      result.push({
        included: existing ? existing.included : week1.included,
        edited: false,
        groups: generated
      });
    }
    previous = generated;
  }
  return result;
}

// Superset labels for one workout in one week (spec 5.4, 5.10, 38a).
// Returns { exerciseId: 'A1' | 'A2' | 'B1' ... }. Letters restart in each
// workout. A pair is labelled only if BOTH exercises are included that week.
function supersetLabels(workout, weekIndex) {
  var labels = {};
  var letterCode = 65; // 'A'
  var seen = {};
  workout.exercises.forEach(function (ex) {
    if (!ex.supersetId || seen[ex.supersetId]) return;
    seen[ex.supersetId] = true;
    var pair = workout.exercises.filter(function (o) {
      return o.supersetId === ex.supersetId && o.weeks[weekIndex].included;
    });
    if (pair.length === 2) {
      var letter = String.fromCharCode(letterCode++);
      labels[pair[0].id] = letter + '1';
      labels[pair[1].id] = letter + '2';
    }
  });
  return labels;
}

function formatNum(v) { return String(Math.round(v * 100) / 100); }

// How a set group's load is shown (spec 5.4, 5.11). Returns { text, cls }.
function describeLoad(g) {
  if (g.load === null) return { text: 'Set load', cls: 'load-blank' };
  var kgPart = g.kg === null ? '' : ' · ' + formatNum(g.kg) + ' kg';
  if (g.loadType === 'kg') {
    var shown = formatNum(g.load) + ' kg';
    if (g.kg !== null && g.kg !== g.load) shown += kgPart;
    return { text: shown, cls: 'load-kg' };
  }
  if (g.loadType === 'pct') return { text: formatNum(g.load) + '%' + kgPart, cls: 'load-pct' };
  return { text: 'RPE ' + formatNum(g.load) + kgPart, cls: 'load-rpe' };
}

// Does removing the last week lose edits or kg values? (spec 5.3)
function lastWeekHasWork(prog) {
  var last = prog.weeks - 1;
  return prog.workouts.some(function (w) {
    return w.exercises.some(function (ex) {
      var entry = ex.weeks[last];
      return entry.edited || entry.groups.some(function (g) { return g.kg !== null; });
    });
  });
}

function programHasExercises(prog) {
  return prog.workouts.some(function (w) { return w.exercises.length > 0; });
}

/* ==========================================================================
   APP STATE
   One `program` object; render() redraws everything from it.
   ========================================================================== */

var program = null;
var dirty = false;       // true when there are changes not yet saved to a file (spec 5.13)
var draftSaved = true;   // false if the last localStorage write failed

// Call this after EVERY change that needs a redraw.
function changed() {
  dirty = true;
  draftSaved = saveDraft(program);
  render();
}

// For typing in text boxes: save, but do not redraw (a redraw would drop the cursor).
function changedQuietly() {
  dirty = true;
  draftSaved = saveDraft(program);
  document.getElementById('save-warning').hidden = draftSaved;
}

function startUp() {
  var draft = loadDraft();
  if (draft) {
    program = draft;
    syncIdCounter(program);
    // We cannot know if a reloaded draft was saved to a file, so treat it as
    // unsaved as soon as it holds any work.
    dirty = programHasExercises(program) || program.name !== 'New Program';
  } else {
    program = createDefaultProgram();
    draftSaved = saveDraft(program);
    dirty = false;
  }
  render();
}

/* ==========================================================================
   CHANGING THE SIZE OF THE PROGRAM (spec 5.3)
   ========================================================================== */

function setWeekCount(n) {
  if (n < 1 || n > MAX_WEEKS || n === program.weeks) return;
  if (n > program.weeks) {
    program.weeks = n;
    program.workouts.forEach(function (w) {
      w.exercises.forEach(function (ex) { ex.weeks = generateWeeks(ex, n); });
    });
    changed();
    return;
  }
  // Only ever removes the last week (steppers move one at a time).
  function remove() {
    program.weeks = n;
    program.workouts.forEach(function (w) {
      w.exercises.forEach(function (ex) { ex.weeks.length = n; });
    });
    changed();
  }
  if (lastWeekHasWork(program)) {
    showConfirm({
      title: 'Remove Week ' + program.weeks + '?',
      text: 'This week has edited cells or kg values. They will be lost.',
      confirmLabel: 'Remove',
      onConfirm: remove
    });
  } else {
    remove();
  }
}

function setWorkoutCount(n) {
  if (n < 1 || n > MAX_WORKOUTS || n === program.workoutsPerWeek) return;
  if (n > program.workoutsPerWeek) {
    program.workouts.push(newWorkout());
    program.workoutsPerWeek = n;
    changed();
    return;
  }
  var last = program.workouts[program.workouts.length - 1];
  function remove() {
    program.workouts.pop();
    program.workoutsPerWeek = n;
    changed();
  }
  if (last.exercises.length > 0) {
    showConfirm({
      title: 'Remove Workout ' + program.workoutsPerWeek + '?',
      text: 'This workout has exercises. They will be deleted.',
      confirmLabel: 'Remove',
      onConfirm: remove
    });
  } else {
    remove();
  }
}

function startNewProgram() {
  function go() {
    program = createDefaultProgram();
    selected = null;
    draftSaved = saveDraft(program);
    dirty = false;
    render();
  }
  if (dirty) {
    showConfirm({
      title: 'Replace current program?',
      text: "Changes that haven't been saved to a file will be lost.",
      confirmLabel: 'Replace',
      onConfirm: go
    });
  } else {
    go();
  }
}

/* ==========================================================================
   SMALL DRAWING HELPERS
   `el` builds elements with textContent only, so user text can never run as HTML.
   ========================================================================== */

function el(tag, props, children) {
  var node = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach(function (key) {
      if (props[key] === null) return; // null means "leave this attribute off"
      if (key === 'text') node.textContent = props[key];
      else if (key === 'className') node.className = props[key];
      else if (key === 'onclick') node.addEventListener('click', props[key]);
      else node.setAttribute(key, props[key]);
    });
  }
  (children || []).forEach(function (child) { node.appendChild(child); });
  return node;
}

var openModalCleanup = null;

function closeModal() {
  var overlay = document.getElementById('modal-overlay');
  if (overlay) overlay.remove();
  if (openModalCleanup) { openModalCleanup(); openModalCleanup = null; }
}

// Custom confirm dialog (native confirm() is not allowed in this project).
function showConfirm(opts) {
  closeModal();
  var cancelBtn = el('button', { text: 'Cancel', onclick: closeModal });
  var okBtn = el('button', {
    className: 'danger',
    text: opts.confirmLabel,
    onclick: function () { closeModal(); opts.onConfirm(); }
  });
  var overlay = el('div', { className: 'overlay', id: 'modal-overlay' }, [
    el('div', { className: 'modal', role: 'dialog', 'aria-modal': 'true' }, [
      el('h2', { text: opts.title }),
      el('p', { text: opts.text }),
      el('div', { className: 'actions' }, [cancelBtn, okBtn])
    ])
  ]);
  document.body.appendChild(overlay);
  function onKey(e) { if (e.key === 'Escape') closeModal(); }
  document.addEventListener('keydown', onKey);
  openModalCleanup = function () { document.removeEventListener('keydown', onKey); };
  cancelBtn.focus();
}

var noticeTimer = null;
function showNotice(message) {
  var old = document.getElementById('notice');
  if (old) old.remove();
  document.body.appendChild(el('div', { className: 'notice', id: 'notice', text: message }));

/* ==========================================================================
   DRAWING (spec 5.2 header, 5.4 grid)
   ========================================================================== */

function stepper(label, value, min, max, onChange) {
  return el('div', { className: 'field' }, [
    el('label', { text: label }),
    el('div', { className: 'stepper' }, [
      el('button', {
        text: '−', 'aria-label': 'Decrease ' + label,
        onclick: function () { onChange(value - 1); },

      }),
      el('span', { className: 'value', text: String(value) }),
      el('button', {
        text: '+', 'aria-label': 'Increase ' + label,
        onclick: function () { onChange(value + 1); },

      })

}

// Placeholder for features that arrive in later build steps.
function laterButton(label, step, extraClass) {

}

// One block per set group, so every group is visible in the grid (see PROJECT_SUMMARY: this
// replaces the spec's "+N more").
function renderGroupLines(g) {
  var scheme = g.sets + ' × ' + g.reps;
  if (g.rpe !== null) scheme += ' @ RPE ' + formatNum(g.rpe);
  var load = describeLoad(g);
  return el('div', { className: 'ex-group' }, [
    el('span', { className: 'ex-scheme', text: scheme }),
    el('span', { className: 'ex-load ' + load.cls, text: load.text })
  ]);
}

function renderExercise(ex, wi, weekIndex, labels) {
  var entry = ex.weeks[weekIndex];
  var top = el('div', { className: 'ex-top' });
  if (labels[ex.id]) top.appendChild(el('span', { className: 'ex-label', text: labels[ex.id] }));
  top.appendChild(el('span', { className: 'ex-name', text: ex.name }));
  if (entry.edited) top.appendChild(el('span', { className: 'ex-edited', text: '(edited)' }));

  var isSelected = selected !== null && selected.exId === ex.id;
  var choose = function () { selectExercise(wi, ex.id); };
  var box = el('div', {
    className: 'ex clickable' + (isSelected ? ' selected' : ''),
    role: 'button', tabindex: '0', onclick: choose
  }, [top]);
  entry.groups.forEach(function (g) { box.appendChild(renderGroupLines(g)); });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); }
  });

}

/* ==========================================================================
   SELECTION AND EXERCISE TABLE (spec 5.5)
   `selected` is only screen state (not saved): which exercise is highlighted.
   ========================================================================== */

var selected = null; // null, or { wi: workout index, exId: exercise id }

function selectExercise(wi, exId) {
  selected = { wi: wi, exId: exId };
  render();
}

function closeDetail() {
  selected = null;
  render();
}

// Finds the selected exercise, or null if it no longer exists.
function findSelected() {
  if (!selected) return null;
  var workout = program.workouts[selected.wi];
  if (!workout) return null;
  for (var i = 0; i < workout.exercises.length; i++) {
    if (workout.exercises[i].id === selected.exId) return { workout: workout, ex: workout.exercises[i] };
  }
  return null;
}

/* ---- Changes made from the table ---- */

// The load type shared by every set group of Week 1, or null if they differ.
function exerciseLoadType(ex) {
  var groups = ex.weeks[0].groups;
  var type = groups[0].loadType;
  return groups.every(function (g) { return g.loadType === type; }) ? type : null;
}

function exerciseHasLoadValues(ex) {
  return ex.weeks.some(function (w) {
    return w.groups.some(function (g) { return g.load !== null || g.rpe !== null || g.kg !== null; });
  });
}

// Spec 5.8: every set group in every week gets the new type with a blank load,
// edits are cleared and the pattern resets to "Same every week".
function applyLoadType(ex, type) {
  ex.weeks.forEach(function (w) {
    w.edited = false;
    w.groups.forEach(function (g) {
      g.loadType = type;
      g.load = null;
      g.rpe = null;
      g.kg = null;
    });
  });
  ex.pattern = { kind: 'same', type: type, amount: 0 };
  changed();
}

function setLoadType(ex, type) {
  if (exerciseLoadType(ex) === type) return;
  if (exerciseHasLoadValues(ex)) {
    showConfirm({
      title: 'Change load type?',
      text: 'All loads for this exercise will be cleared.',
      confirmLabel: 'Change',
      onConfirm: function () { applyLoadType(ex, type); }
    });
  } else {
    applyLoadType(ex, type);
  }
}

// A superset pair shares one rest time (spec 5.10), so changing one changes both.
function setRest(workout, ex, seconds) {
  ex.rest = seconds;
  if (ex.supersetId) {
    workout.exercises.forEach(function (o) {
      if (o.supersetId === ex.supersetId) o.rest = seconds;
    });
  }
  changed();
}

function confirmDeleteExercise(workout, ex) {
  showConfirm({
    title: 'Delete ' + ex.name + '?',
    text: 'It will be removed from every week.',
    confirmLabel: 'Delete',
    onConfirm: function () { deleteExercise(workout, ex); }
  });
}

/* ---- Drawing the table ---- */

function patternText(ex) {
  var p = ex.pattern;
  var unit = p.type === 'kg' ? ' kg' : (p.type === 'pct' ? '%' : ' RPE');
  if (p.kind === 'add') return '+' + formatNum(p.amount) + unit + ' per week';
  if (p.kind === 'percent') return '+' + formatNum(p.amount) + '% per week';
  if (p.kind === 'manual') return 'Set each week manually';
  return 'Same every week';
}

function renderWeekCell(wi, ex, weekIndex) {
  var entry = ex.weeks[weekIndex];

    cell.appendChild(el('button', {
      text: 'Add to this week',
      onclick: function () { addToWeek(ex, weekIndex); }
    }));
    return cell;
  }
  entry.groups.forEach(function (g) { cell.appendChild(renderGroupLines(g)); });
  if (entry.edited) cell.appendChild(el('div', { className: 'ex-edited', text: '(edited)' }));

  function open() { openWeekEditor(wi, ex, weekIndex); }
  cell.addEventListener('click', open);
  cell.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });

  restInput.className = 'rest-input';

  LOAD_TYPE_OPTIONS.forEach(function (o) {

  ]));

  document.getElementById('save-warning').hidden = draftSaved;
}

/* ==========================================================================
   EXERCISE LIST (spec 5.12). Loading it from a backup file arrives in step 7;
   for now we only read whatever is stored.
   ========================================================================== */

function loadExerciseList() {
  try {
    var data = JSON.parse(localStorage.getItem(EXERCISE_LIST_KEY));
    if (Array.isArray(data)) {
      return data.filter(function (n) { return typeof n === 'string' && n.trim() !== ''; });
    }
  } catch (err) { /* no list stored, or storage unavailable */ }
  return [];
}

/* ==========================================================================
   NUMBER PARSING (spec 9: accept "." and "," as the decimal mark)
   ========================================================================== */

// "" -> null, "97,5" -> 97.5, anything that is not a plain non-negative number -> NaN.
function parseNumber(text) {
  var t = String(text).trim().replace(',', '.');
  if (t === '') return null;
  if (!/^\d+(\.\d+)?$/.test(t)) return NaN;
  return Number(t);
}

function parseWhole(text, lo, hi) {
  var n = parseNumber(text);
  if (n === null || isNaN(n) || Math.floor(n) !== n || n < lo || n > hi) return NaN;
  return n;
}

var LOAD_LIMITS = { kg: 2000, pct: 500, rpe: 10 };
var LOAD_LABELS = { kg: 'kg', pct: '% of 1RM', rpe: 'RPE' };

// Returns { value } (a number or null) or { error }.
function readLoad(text, loadType) {
  var n = parseNumber(text);
  if (n !== null && (isNaN(n) || n > LOAD_LIMITS[loadType])) {
    return { error: 'Load must be a number from 0 to ' + LOAD_LIMITS[loadType] + ' (' + LOAD_LABELS[loadType] + '), or left blank.' };
  }
  return { value: n };
}

function readTargetRpe(text) {
  var n = parseNumber(text);
  if (n !== null && (isNaN(n) || n > 10)) return { error: 'Target RPE must be a number from 0 to 10, or left blank.' };
  return { value: n };
}

/* ==========================================================================
   CHANGES TO EXERCISES (no drawing here)
   ========================================================================== */

function includedWeekCount(ex) {
  return ex.weeks.filter(function (w) { return w.included; }).length;
}

// Spec 5.10: deleting one exercise clears the pair; the partner stays.
function deleteExercise(workout, ex) {
  workout.exercises = workout.exercises.filter(function (o) { return o !== ex; });
  if (ex.supersetId) {
    workout.exercises.forEach(function (o) {
      if (o.supersetId === ex.supersetId) o.supersetId = null;
    });
  }
  changed();
}

// Spec 5.7: removing from a week hides it there. If that was the last week, confirm and delete.
function removeFromWeek(workout, ex, weekIndex) {
  if (includedWeekCount(ex) <= 1) {
    showConfirm({
      title: 'Delete ' + ex.name + '?',
      text: 'This is the only week that includes this exercise, so it will be deleted.',
      confirmLabel: 'Delete',
      onConfirm: function () { deleteExercise(workout, ex); }
    });
    return;
  }
  ex.weeks[weekIndex].included = false;
  changed();
}

// Spec 5.7: adding back uses the pattern's value for that week.
function addToWeek(ex, weekIndex) {
  ex.weeks[weekIndex].included = true;
  ex.weeks[weekIndex].edited = false;
  ex.weeks = generateWeeks(ex, program.weeks);
  changed();
}

// Creates an exercise at the end of a workout (spec 5.6).
// `fields`: name, group, restSeconds, notes. `weekIndex` is null for "All weeks".
function createExercise(workout, fields, weekIndex) {
  var ex = newExercise(fields.name, program.weeks);
  ex.rest = fields.restSeconds;
  ex.notes = fields.notes;
  ex.pattern = { kind: 'same', type: fields.group.loadType, amount: 0 };
  ex.weeks[0].groups = [fields.group];
  // Every week (even hidden ones) keeps a copy of the entered values.
  ex.weeks = generateWeeks(ex, program.weeks);
  if (weekIndex !== null) {
    ex.weeks.forEach(function (w, i) {
      w.included = (i === weekIndex);
      // Week 1 is the source, so it is never marked as edited.
      w.edited = (i === weekIndex && i > 0);
    });
  }
  workout.exercises.push(ex);
  changed();
}

/* ==========================================================================
   MODALS FOR FORMS
   ========================================================================== */

// A general dialog. `opts`: title, body (node), actions (array of buttons), wide.
function openModal(opts) {
  closeModal();
  var overlay = el('div', { className: 'overlay', id: 'modal-overlay' }, [
    el('div', { className: 'modal' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' }, [
      el('h2', { text: opts.title }),
      opts.body,
      el('div', { className: 'actions' }, opts.actions)
    ])
  ]);
  document.body.appendChild(overlay);
  function onKey(e) { if (e.key === 'Escape') closeModal(); }
  document.addEventListener('keydown', onKey);
  openModalCleanup = function () { document.removeEventListener('keydown', onKey); };
}

function formRow(labelText, control) {
  return el('div', { className: 'form-row' }, [el('label', { text: labelText }), control]);
}

function textInput(value, attrs) {
  var input = el('input', Object.assign({ type: 'text' }, attrs || {}));
  input.value = value;
  return input;
}

function selectBox(options, value) {
  var select = el('select');
  options.forEach(function (o) {
    select.appendChild(el('option', { value: o[0], text: o[1] }));
  });
  select.value = value;
  return select;
}

var LOAD_TYPE_OPTIONS = [['kg', 'kg'], ['pct', '% of 1RM'], ['rpe', 'RPE']];

/* ---- Add exercise (spec 5.6) ---- */

function openAddExerciseModal(wi, weekIndex) {
  var workout = program.workouts[wi];
  var list = loadExerciseList();
  var NEW = '__new__';

  var nameSelect = null;
  if (list.length > 0) {
    nameSelect = selectBox([[NEW, 'New Exercise']].concat(list.map(function (n) { return [n, n]; })), NEW);
  }
  var nameText = textInput('', { maxlength: '200', placeholder: 'Exercise name' });
  var nameWarning = el('div', { className: 'form-warning', text: 'Not in your Exercise List', hidden: 'hidden' });

  function updateNameUi() {
    var custom = !nameSelect || nameSelect.value === NEW;
    nameText.hidden = !custom;
    var typed = nameText.value.trim();
    nameWarning.hidden = !(custom && list.length > 0 && typed !== '' && list.indexOf(typed) === -1);
  }
  if (nameSelect) nameSelect.addEventListener('change', updateNameUi);
  nameText.addEventListener('input', updateNameUi);

  var setsInput = textInput('3', { inputmode: 'numeric' });
  var repsInput = textInput('10', { inputmode: 'numeric' });
  var typeSelect = selectBox(LOAD_TYPE_OPTIONS, 'kg');
  var loadInput = textInput('', { inputmode: 'decimal', placeholder: 'Blank = set later' });
  var loadLabel = el('label', { text: 'Load (kg)' });
  typeSelect.addEventListener('change', function () {
    loadLabel.textContent = 'Load (' + LOAD_LABELS[typeSelect.value] + ')';
  });
  var restInput = textInput('1,5', { inputmode: 'decimal' });
  var notesInput = el('textarea', { maxlength: '500' });
  var addToSelect = selectBox(
    [['all', 'All weeks'], ['one', 'This week only (Week ' + (weekIndex + 1) + ')']], 'all');
  var errorBox = el('div', { className: 'form-error', hidden: 'hidden' });

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function submit() {
    var name = (!nameSelect || nameSelect.value === NEW) ? nameText.value.trim() : nameSelect.value;
    if (name === '') return showError('Enter an exercise name.');
    var sets = parseWhole(setsInput.value, 1, 99);
    if (isNaN(sets)) return showError('Sets must be a whole number from 1 to 99.');
    var reps = parseWhole(repsInput.value, 1, 999);
    if (isNaN(reps)) return showError('Reps must be a whole number from 1 to 999.');
    var load = readLoad(loadInput.value, typeSelect.value);
    if (load.error) return showError(load.error);
    var restMin = parseNumber(restInput.value);
    if (restMin === null || isNaN(restMin) || restMin > 60) return showError('Rest must be a number of minutes from 0 to 60.');

    closeModal();
    createExercise(workout, {
      name: name,
      group: { sets: sets, reps: reps, loadType: typeSelect.value, load: load.value, rpe: null, kg: null },
      restSeconds: Math.round(restMin * 60),
      notes: notesInput.value.trim()
    }, addToSelect.value === 'one' ? weekIndex : null);
  }

  var body = el('div', null, [
    el('div', { className: 'sub', text: 'Workout ' + (wi + 1) + ', Week ' + (weekIndex + 1) }),
    formRow('Name', nameSelect || nameText)
  ]);
  if (nameSelect) body.appendChild(el('div', { className: 'form-row' }, [nameText]));
  body.appendChild(nameWarning);
  body.appendChild(el('div', { className: 'form-cols' }, [formRow('Sets', setsInput), formRow('Reps', repsInput)]));
  body.appendChild(el('div', { className: 'form-cols' }, [formRow('Load type', typeSelect),
    el('div', { className: 'form-row' }, [loadLabel, loadInput])]));
  body.appendChild(formRow('Rest (minutes)', restInput));
  body.appendChild(formRow('Notes (optional)', notesInput));
  body.appendChild(formRow('Add to', addToSelect));
  body.appendChild(errorBox);

  openModal({
    title: 'Add exercise',
    body: body,
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Add', onclick: submit })
    ]
  });
  updateNameUi();
  (nameSelect || nameText).focus();
}

/* ---- Week cell editor (spec 5.7) ---- */

function openWeekEditor(wi, ex, weekIndex) {
  var workout = program.workouts[wi];
  var entry = ex.weeks[weekIndex];
  var title = ex.name + ' · Week ' + (weekIndex + 1);

  if (!entry.included) {
    openModal({
      title: title,
      body: el('p', { text: 'Not in this week' }),
      actions: [
        el('button', { text: 'Close', onclick: closeModal }),
        el('button', {
          className: 'primary', text: 'Add to this week',
          onclick: function () { closeModal(); addToWeek(ex, weekIndex); }
        })
      ]
    });
    return;
  }

  // Working copies hold the text exactly as typed; they are parsed on Save.
  var drafts = entry.groups.map(function (g) {
    return {
      sets: String(g.sets), reps: String(g.reps), loadType: g.loadType,
      load: g.load === null ? '' : formatNum(g.load),
      rpe: g.rpe === null ? '' : formatNum(g.rpe),
      orig: g
    };
  });

  var rowsBox = el('div');
  var errorBox = el('div', { className: 'form-error', hidden: 'hidden' });
  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function field(d, key, labelText, attrs) {
    var input = textInput(d[key], Object.assign({ inputmode: 'decimal' }, attrs || {}));
    input.addEventListener('input', function () { d[key] = input.value; });
    return el('div', null, [el('label', { text: labelText }), input]);
  }

  function drawRows() {
    rowsBox.textContent = '';
    drafts.forEach(function (d, i) {
      var cols = [
        field(d, 'sets', 'Sets'),
        field(d, 'reps', 'Reps'),
        field(d, 'load', 'Load (' + LOAD_LABELS[d.loadType] + ')')
      ];
      if (d.loadType !== 'rpe') cols.push(field(d, 'rpe', 'Target RPE'));
      if (drafts.length > 1) {
        cols.push(el('button', {
          className: 'del', text: 'Delete', 'aria-label': 'Delete set group ' + (i + 1),
          onclick: function () { drafts.splice(i, 1); drawRows(); }
        }));
      }
      rowsBox.appendChild(el('div', { className: 'group-row' }, cols));
    });
  }
  drawRows();

  var addGroupBtn = el('button', {
    text: 'Add set group',
    onclick: function () {
      var last = drafts[drafts.length - 1];
      drafts.push({ sets: last.sets, reps: last.reps, loadType: last.loadType, load: last.load, rpe: '', orig: null });
      drawRows();
    }
  });

  function save() {
    var groups = [];
    for (var i = 0; i < drafts.length; i++) {
      var d = drafts[i];
      var n = i + 1;
      var sets = parseWhole(d.sets, 1, 99);
      if (isNaN(sets)) return showError('Set group ' + n + ': sets must be a whole number from 1 to 99.');
      var reps = parseWhole(d.reps, 1, 999);
      if (isNaN(reps)) return showError('Set group ' + n + ': reps must be a whole number from 1 to 999.');
      var load = readLoad(d.load, d.loadType);
      if (load.error) return showError('Set group ' + n + ': ' + load.error);
      var rpe = { value: null };
      if (d.loadType !== 'rpe') {
        rpe = readTargetRpe(d.rpe);
        if (rpe.error) return showError('Set group ' + n + ': ' + rpe.error);
      }
      // A kg value is cleared when its load or load type changes (spec 5.11).
      var keepKg = d.orig && d.orig.loadType === d.loadType && d.orig.load === load.value;
      groups.push({
        sets: sets, reps: reps, loadType: d.loadType, load: load.value,
        rpe: rpe.value, kg: keepKg ? d.orig.kg : null
      });
    }
    closeModal();
    if (weekIndex === 0) {
      // Week 1 is the source: regenerate every week that is not edited.
      entry.groups = groups;
      ex.weeks = generateWeeks(ex, program.weeks);
      changed();
    } else if (JSON.stringify(groups) !== JSON.stringify(entry.groups)) {
      entry.groups = groups;
      entry.edited = true;
      changed();
    }
  }

  var left = [el('button', {
    className: 'danger', text: 'Remove from this week',
    onclick: function () { closeModal(); removeFromWeek(workout, ex, weekIndex); }
  })];
  if (entry.edited && weekIndex > 0) {
    left.push(el('button', {
      text: 'Use pattern value',
      onclick: function () {
        closeModal();
        entry.edited = false;
        ex.weeks = generateWeeks(ex, program.weeks);
        changed();
      }
    }));
  }

  var bodyChildren = [rowsBox];
  if (!ex.supersetId) bodyChildren.push(el('div', { className: 'form-row' }, [addGroupBtn]));
  bodyChildren.push(errorBox);

  openModal({
    title: title,
    wide: true,
    body: el('div', null, bodyChildren),
    actions: [
      el('div', { className: 'left' }, left),
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Save', onclick: save })
    ]
  });
}


// Warn before closing the tab if there are unsaved changes (spec 5.13).
window.addEventListener('beforeunload', function (e) {
  if (dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

startUp();
</script>

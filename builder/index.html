      panelRow('Round loads to', [roundInput, el('span', { className: 'unit', text: 'kg (the smallest step your plates allow)' })])
    ])
  ]);
  box.appendChild(el('div', { className: 'pf-body' }, [left, renderUnavailableColumn(p)]));
  left.scrollTop = leftScroll;
  var newList = box.querySelector('.pf-list');
  if (newList) newList.scrollTop = listScroll;
}

/* ==========================================================================
   EXERCISE LIST (spec 5.12). Loading it from a backup file arrives in step 7;
   for now we only read whatever is stored.
   ========================================================================== */

function loadExerciseList() {
  try {
    var data = JSON.parse(localStorage.getItem(EXERCISE_LIST_KEY));
    if (Array.isArray(data)) {
      return data.filter(function (n) { return typeof n === 'string' && n.trim() !== ''; });
    }
  } catch (err) { /* no list stored, or storage unavailable */ }
  return [];
}

// Adds a name typed in the Add exercise dialog to the global Exercise List, at the end, unless the
// list already has it (compared without regard to capital letters). Returns the name to use: the
// list's own spelling if it was already there.
function addToExerciseList(name) {
  var list = loadExerciseList();
  var lower = name.toLowerCase();
  for (var i = 0; i < list.length; i++) {
    if (list[i].toLowerCase() === lower) return list[i];
  }
  list.push(name);
  try { localStorage.setItem(EXERCISE_LIST_KEY, JSON.stringify(list)); } catch (err) { /* the exercise is still added to the program */ }
  return name;
}

/* ==========================================================================
   NUMBER PARSING (spec 9: accept "." and "," as the decimal mark)
   ========================================================================== */

// "" -> null, "97,5" -> 97.5, anything that is not a plain non-negative number -> NaN.
function parseNumber(text) {
  var t = String(text).trim().replace(',', '.');
  if (t === '') return null;
  if (!/^\d+(\.\d+)?$/.test(t)) return NaN;
  return Number(t);
}

function parseWhole(text, lo, hi) {
  var n = parseNumber(text);
  if (n === null || isNaN(n) || Math.floor(n) !== n || n < lo || n > hi) return NaN;
  return n;
}

var LOAD_LIMITS = { kg: 2000, pct: 500, rpe: 10, rir: 10 };
var LOAD_LABELS = { kg: 'kg', pct: '% of 1RM', rpe: 'RPE', rir: 'RIR' };

// Only a kg load has a separate effort target (RPE or RIR). A % load, and a load that is itself an
// RPE or RIR, do not. An older % load that already has a target keeps showing it (`hasValue`), so
// it can still be changed or cleared.
function hasEffortTarget(loadType, hasValue) { return loadType === 'kg' || !!hasValue; }

// Returns { value } (a number or null) or { error }.
function readLoad(text, loadType) {
  var n = parseNumber(text);
  if (n !== null && (isNaN(n) || n > LOAD_LIMITS[loadType])) {
    return { error: 'Load must be a number from 0 to ' + LOAD_LIMITS[loadType] + ' (' + LOAD_LABELS[loadType] + '), or left blank.' };
  }
  return { value: n };
}

// Rest typed in minutes ("1,5" = 1.5 min). Returns seconds, or null if it is not valid.
function readRestMinutes(text) {
  var n = parseNumber(text);
  return (n === null || isNaN(n) || n > 60) ? null : Math.round(n * 60);
}

// An effort target: a number from 0 to 10 (half steps allowed), or blank. `name` is "RPE" or "RIR".
function readEffortTarget(text, name) {
  var n = parseNumber(text);
  if (n !== null && (isNaN(n) || n > 10)) return { error: 'Target ' + name + ' must be a number from 0 to 10, or left blank.' };
  return { value: n };
}

/* ==========================================================================
   CHANGES TO EXERCISES (no drawing here)
   ========================================================================== */

function includedWeekCount(ex) {
  return ex.weeks.filter(function (w) { return w.included; }).length;
}

// Spec 5.10: deleting an exercise unpairs its set groups; their partners stay.
function deleteExercise(workout, ex) {
  workout.exercises = workout.exercises.filter(function (o) { return o !== ex; });
  purgeBrokenPairs(workout);
  changed();
}

// Spec 5.7: removing from a week hides it there. If that was the last week, confirm and delete.
function removeFromWeek(workout, ex, weekIndex) {
  if (includedWeekCount(ex) <= 1) {
    showConfirm({
      title: 'Delete ' + ex.name + '?',
      text: 'This is the only week that includes this exercise, so it will be deleted.',
      confirmLabel: 'Delete',
      onConfirm: function () { deleteExercise(workout, ex); }
    });
    return;
  }
  ex.weeks[weekIndex].included = false;
  changed();
}

// Removes a whole workout from one week. Exercises that appear in no other week would be left
// with nowhere to live, so those are deleted (the dialog names them first).
function confirmRemoveWorkoutFromWeek(workout, wi, weekIndex) {
  var here = workout.exercises.filter(function (ex) { return ex.weeks[weekIndex].included; });
  var onlyHere = here.filter(function (ex) { return includedWeekCount(ex) <= 1; });
  var text = 'Its exercises stay in the other weeks.';
  if (onlyHere.length > 0) {
    text = 'These exercises appear only in this week and will be deleted: ' +
      onlyHere.map(function (ex) { return ex.name; }).join(', ') + '. The others stay in the other weeks.';
  }
  showConfirm({
    title: 'Remove Workout ' + (wi + 1) + ' from Week ' + (weekIndex + 1) + '?',
    text: text,
    confirmLabel: 'Remove',
    onConfirm: function () {
      here.forEach(function (ex) {
        if (onlyHere.indexOf(ex) >= 0) workout.exercises = workout.exercises.filter(function (o) { return o !== ex; });
        else ex.weeks[weekIndex].included = false;
      });
      purgeBrokenPairs(workout);
      changed();
    }
  });
}

// Puts every exercise of the workout back into that week. A week that was edited by hand keeps its
// edits; the others already hold the pattern's values.
function restoreWorkoutInWeek(workout, weekIndex) {
  workout.exercises.forEach(function (ex) { ex.weeks[weekIndex].included = true; });
  changed();
}

// Spec 5.7: adding back uses the pattern's value for that week.
function addToWeek(ex, weekIndex) {
  ex.weeks[weekIndex].included = true;
  ex.weeks[weekIndex].edited = false;
  ex.weeks = generateWeeks(ex, program.weeks);
  changed();
}

// Creates an exercise at the end of a workout (spec 5.6).
// `fields`: name, groups (one or more set groups, each with its own load type and rest), notes.
// `weekIndex` is null for "All weeks".
function createExercise(workout, fields, weekIndex) {
  var ex = newExercise(fields.name, program.weeks);
  ex.notes = fields.notes;
  ex.weeks[0].groups = fields.groups;
  ex.patterns = fields.groups.map(function (g) { return samePattern(g.loadType); });
  ex.supersets = fields.groups.map(function () { return null; });
  // Every week (even hidden ones) keeps a copy of the entered values.
  ex.weeks = generateWeeks(ex, program.weeks);
  if (weekIndex !== null) {
    ex.weeks.forEach(function (w, i) {
      w.included = (i === weekIndex);
      // Week 1 is the source, so it is never marked as edited.
      w.edited = (i === weekIndex && i > 0);
    });
  }
  workout.exercises.push(ex);
  changed();
}

/* ==========================================================================
   MODALS FOR FORMS
   ========================================================================== */

// A general dialog. `opts`: title, body (node), actions (array of buttons), wide.
function openModal(opts) {
  closeModal();
  var overlay = el('div', { className: 'overlay', id: 'modal-overlay' }, [
    el('div', { className: 'modal' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' }, [
      el('h2', { text: opts.title }),
      opts.body,
      el('div', { className: 'actions' }, opts.actions)
    ])
  ]);
  document.body.appendChild(overlay);
  function onKey(e) { if (e.key === 'Escape') closeModal(); }
  document.addEventListener('keydown', onKey);
  openModalCleanup = function () { document.removeEventListener('keydown', onKey); };
}

function formRow(labelText, control) {
  return el('div', { className: 'form-row' }, [el('label', { text: labelText }), control]);
}

function textInput(value, attrs) {
  var input = el('input', Object.assign({ type: 'text' }, attrs || {}));
  input.value = value;
  return input;
}

function selectBox(options, value) {
  var select = el('select');
  options.forEach(function (o) {
    select.appendChild(el('option', { value: o[0], text: o[1] }));
  });
  select.value = value;
  return select;
}

var LOAD_TYPE_OPTIONS = [['kg', 'kg'], ['pct', '% of 1RM'], ['rpe', 'RPE'], ['rir', 'RIR']];

/* ---- Add exercise (spec 5.6) ---- */

function openAddExerciseModal(wi, weekIndex) {
  var workout = program.workouts[wi];
  var list = loadExerciseList();
  var NEW = '__new__';

  var nameSelect = null;
  if (list.length > 0) {
    nameSelect = selectBox([[NEW, 'New Exercise']].concat(list.map(function (n) { return [n, n]; })), NEW);
  }
  var nameText = textInput('', { maxlength: '200', placeholder: 'New exercise name' });

  // Every exercise on the list can be picked. "New Exercise" shows a box to type a new name, which
  // is added to the list when the exercise is created.
  function updateNameUi() {
    nameText.hidden = !(!nameSelect || nameSelect.value === NEW);
  }
  if (nameSelect) nameSelect.addEventListener('change', updateNameUi);

  // Set groups: one row each, so a start value, sets and reps can be entered for every group now.
  // Each set group has its own load type and rest time.
  var drafts = [{ sets: '3', reps: '10', loadType: 'kg', load: '', rest: '1,5' }];
  var rowsBox = el('div');

  function draftField(d, key, labelText, attrs) {
    var input = textInput(d[key], Object.assign({ inputmode: 'decimal' }, attrs || {}));
    input.addEventListener('input', function () { d[key] = input.value; });
    return el('div', null, [el('label', { text: labelText }), input]);
  }

  function drawRows() {
    rowsBox.textContent = '';
    drafts.forEach(function (d, i) {
      var typeSelect = selectBox(LOAD_TYPE_OPTIONS, d.loadType);
      typeSelect.setAttribute('aria-label', 'Load type, set group ' + (i + 1));
      typeSelect.addEventListener('change', function () { d.loadType = typeSelect.value; drawRows(); });
      var cols = [
        draftField(d, 'sets', 'Sets', { inputmode: 'numeric' }),
        draftField(d, 'reps', 'Reps', { inputmode: 'numeric' }),
        el('div', null, [el('label', { text: 'Load type' }), typeSelect]),
        draftField(d, 'load', 'Load (' + LOAD_LABELS[d.loadType] + ')', { placeholder: 'Blank = later' }),
        draftField(d, 'rest', 'Rest (min)')
      ];
      if (drafts.length > 1) {
        cols.push(el('button', {
          className: 'del', text: 'Delete', 'aria-label': 'Delete set group ' + (i + 1),
          onclick: function () { drafts.splice(i, 1); drawRows(); }
        }));
      }
      rowsBox.appendChild(el('div', { className: 'group-row' }, cols));
    });
  }
  drawRows();
  var addGroupBtn = el('button', {
    text: 'Add set group',
    onclick: function () {
      var last = drafts[drafts.length - 1];
      drafts.push({ sets: last.sets, reps: last.reps, loadType: last.loadType, load: '', rest: last.rest });
      drawRows();
    }
  });
  var notesInput = el('textarea', { maxlength: '500' });
  var addToSelect = selectBox(
    [['all', 'All weeks'], ['one', 'This week only (Week ' + (weekIndex + 1) + ')']], 'all');
  var errorBox = el('div', { className: 'form-error', hidden: 'hidden' });

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function submit() {
    var typedNew = !nameSelect || nameSelect.value === NEW;
    var name = typedNew ? nameText.value.trim() : nameSelect.value;
    if (name === '') return showError('Enter an exercise name.');
    var groups = [];
    for (var i = 0; i < drafts.length; i++) {
      var d = drafts[i];
      var n = drafts.length > 1 ? 'Set group ' + (i + 1) + ': ' : '';
      var sets = parseWhole(d.sets, 1, 99);
      if (isNaN(sets)) return showError(n + 'sets must be a whole number from 1 to 99.');
      var reps = parseWhole(d.reps, 1, 999);
      if (isNaN(reps)) return showError(n + 'reps must be a whole number from 1 to 999.');
      var load = readLoad(d.load, d.loadType);
      if (load.error) return showError(n + load.error);
      var rest = readRestMinutes(d.rest);
      if (rest === null) return showError(n + 'rest must be a number of minutes from 0 to 60.');
      groups.push(Object.assign(newGroup(), { sets: sets, reps: reps, loadType: d.loadType, load: load.value, rest: rest }));
    }

    closeModal();
    if (typedNew) name = addToExerciseList(name);   // a new name joins the global list
    createExercise(workout, {
      name: name,
      groups: groups,
      notes: notesInput.value.trim()
    }, addToSelect.value === 'one' ? weekIndex : null);
  }

  var body = el('div', null, [
    el('div', { className: 'sub', text: 'Workout ' + (wi + 1) + ', Week ' + (weekIndex + 1) }),
    formRow('Name', nameSelect || nameText)
  ]);
  if (nameSelect) body.appendChild(el('div', { className: 'form-row' }, [nameText]));
  body.appendChild(rowsBox);
  body.appendChild(el('div', { className: 'form-row' }, [addGroupBtn]));
  body.appendChild(formRow('Notes (optional)', notesInput));
  body.appendChild(formRow('Add to', addToSelect));
  body.appendChild(errorBox);

  openModal({
    title: 'Add exercise',
    wide: true,
    body: body,
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Add', onclick: submit })
    ]
  });
  updateNameUi();
  (nameSelect || nameText).focus();
}

/* ---- Week cell editor (spec 5.7) ---- */

// `addGroup` (optional, true) opens with a new set group already added; used by the table's
// "Add set group" button, which always works on Week 1 (the source for the other weeks).
function openWeekEditor(wi, ex, weekIndex, addGroup) {
  var workout = program.workouts[wi];
  var entry = ex.weeks[weekIndex];
  var title = ex.name + ' · Week ' + (weekIndex + 1);

  if (!entry.included && !addGroup) {
    openModal({
      title: title,
      body: el('p', { text: 'Not in this week' }),
      actions: [
        el('button', { text: 'Close', onclick: closeModal }),
        el('button', {
          className: 'primary', text: 'Add to this week',
          onclick: function () { closeModal(); addToWeek(ex, weekIndex); }
        })
      ]
    });
    return;
  }

  // Working copies hold the text exactly as typed; they are parsed on Save.
  // `origIndex` remembers which set group a row came from, so its pattern follows it in Week 1.
  var drafts = entry.groups.map(function (g, i) {
    return {
      sets: String(g.sets), reps: String(g.reps), repsMax: g.repsMax === null ? '' : String(g.repsMax),
      loadType: g.loadType,
      load: g.load === null ? '' : formatNum(g.load),
      // One effort target per set group: RPE or RIR (`targetMode` says which; `target` is the number).
      targetMode: g.rir !== null ? 'rir' : 'rpe',
      target: g.rir !== null ? formatNum(g.rir) : (g.rpe === null ? '' : formatNum(g.rpe)),
      rest: formatNum(g.rest / 60),
      setType: g.setType || '', tempo: g.tempo || '', pause: g.pause === null ? '' : String(g.pause),
      // The second line (set type, tempo, pause) is shown when the group uses it, or after one click.
      more: !!(g.setType || g.tempo || g.pause !== null),
      orig: g, origIndex: i
    };
  });

  function newDraftLike(last) {
    return {
      sets: last.sets, reps: last.reps, repsMax: '', loadType: last.loadType, load: '',
      targetMode: last.targetMode, target: '', rest: last.rest,
      setType: '', tempo: '', pause: '', more: false, orig: null, origIndex: null
    };
  }
  if (addGroup) drafts.push(newDraftLike(drafts[drafts.length - 1]));

  var rowsBox = el('div');
  var errorBox = el('div', { className: 'form-error', hidden: 'hidden' });
  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function field(d, key, labelText, attrs, cls) {
    var input = textInput(d[key], Object.assign({ inputmode: 'decimal' }, attrs || {}));
    input.addEventListener('input', function () { d[key] = input.value; });
    return el('div', { className: cls || null }, [el('label', { text: labelText }), input]);
  }

  // The effort target: RPE or RIR (a small switch) and its number.
  function targetControl(d, i) {
    var seg = el('div', { className: 'segmented' }, ['rpe', 'rir'].map(function (mode) {
      return el('button', {
        className: d.targetMode === mode ? 'on' : null, text: mode.toUpperCase(),
        onclick: function () { d.targetMode = mode; drawRows(); }
      });
    }));
    var input = textInput(d.target, { inputmode: 'decimal', 'aria-label': 'Target ' + d.targetMode.toUpperCase() + ', set group ' + (i + 1) });
    input.addEventListener('input', function () { d.target = input.value; });
    return el('div', { className: 'w-target' }, [el('label', { text: 'Target' }), el('div', { className: 'tgt' }, [seg, input])]);
  }

  // The second line: set type, tempo and pause.
  function moreFields(d) {
    var typeSelect = selectBox([['', 'None']].concat(SET_TYPES.map(function (t) { return [t, SET_TYPE_LABELS[t]]; })), d.setType);
    typeSelect.addEventListener('change', function () { d.setType = typeSelect.value; });
    return el('div', { className: 'group-more' }, [
      el('div', { className: 'w-md' }, [el('label', { text: 'Set type' }), typeSelect]),
      field(d, 'tempo', 'Tempo', { inputmode: 'text', maxlength: '12', placeholder: '3-1-1-0' }, 'w-md'),
      field(d, 'pause', 'Pause (s)', { inputmode: 'numeric' }, 'w-sm')
    ]);
  }

  function drawRows() {
    rowsBox.textContent = '';
    drafts.forEach(function (d, i) {
      // The load type of an existing set group is changed with the table's control (it asks
      // before clearing loads); only a group added here can pick its type.
      var typeSelect = selectBox(LOAD_TYPE_OPTIONS, d.loadType);
      typeSelect.setAttribute('aria-label', 'Load type, set group ' + (i + 1));
      if (d.orig) typeSelect.disabled = true;
      typeSelect.addEventListener('change', function () { d.loadType = typeSelect.value; d.load = ''; d.target = ''; drawRows(); });
      var cols = [
        field(d, 'sets', 'Sets', null, 'w-xs'),
        field(d, 'reps', 'Reps', null, 'w-xs'),
        field(d, 'repsMax', 'to', { 'aria-label': 'Upper reps (a rep range), set group ' + (i + 1) }, 'w-xs'),
        el('div', null, [el('label', { text: 'Load type' }), typeSelect]),
        field(d, 'load', 'Load (' + LOAD_LABELS[d.loadType] + ')', null, 'w-sm')
      ];
      if (hasEffortTarget(d.loadType, d.target.trim() !== '')) cols.push(targetControl(d, i));
      cols.push(field(d, 'rest', 'Rest (min)', null, 'w-sm'));
      if (drafts.length > 1) {
        cols.push(el('button', {
          className: 'del', text: 'Delete', 'aria-label': 'Delete set group ' + (i + 1),
          onclick: function () { drafts.splice(i, 1); drawRows(); }
        }));
      }
      rowsBox.appendChild(el('div', { className: 'group-row' }, cols));
      if (d.more) {
        rowsBox.appendChild(moreFields(d));
      } else {
        rowsBox.appendChild(el('div', { className: 'group-more-link' }, [el('button', {
          className: 'link-btn acc', text: '▸ Set type, tempo, pause…',
          onclick: function () { d.more = true; drawRows(); }
        })]));
      }
    });
  }
  drawRows();

  var addGroupBtn = el('button', {
    text: 'Add set group',
    onclick: function () {
      drafts.push(newDraftLike(drafts[drafts.length - 1]));
      drawRows();
    }
  });

  function save() {
    var groups = [];
    for (var i = 0; i < drafts.length; i++) {
      var d = drafts[i];
      var n = i + 1;
      var sets = parseWhole(d.sets, 1, 99);
      if (isNaN(sets)) return showError('Set group ' + n + ': sets must be a whole number from 1 to 99.');
      var reps = parseWhole(d.reps, 1, 999);
      if (isNaN(reps)) return showError('Set group ' + n + ': reps must be a whole number from 1 to 999.');
      var load = readLoad(d.load, d.loadType);
      if (load.error) return showError('Set group ' + n + ': ' + load.error);
      // Rep range: the upper number must be a whole number above the lower one, or blank.
      var repsMax = null;
      if (d.repsMax.trim() !== '') {
        repsMax = parseWhole(d.repsMax, 2, 999);
        if (isNaN(repsMax) || repsMax <= reps) return showError('Set group ' + n + ': the upper reps must be a whole number above the lower reps, or left blank.');
      }
      // Effort target: RPE or RIR (only one is stored). A group whose load is an RPE has no target.
      var rpe = null;
      var rir = null;
      if (hasEffortTarget(d.loadType, d.target.trim() !== '')) {
        var target = readEffortTarget(d.target, d.targetMode.toUpperCase());
        if (target.error) return showError('Set group ' + n + ': ' + target.error);
        if (d.targetMode === 'rir') rir = target.value; else rpe = target.value;
      }
      var rest = readRestMinutes(d.rest);
      if (rest === null) return showError('Set group ' + n + ': rest must be a number of minutes from 0 to 60.');
      var tempo = d.tempo.trim();
      if (tempo.length > 12) return showError('Set group ' + n + ': tempo can have at most 12 characters.');
      var pause = null;
      if (d.pause.trim() !== '') {
        pause = parseWhole(d.pause, 0, 30);
        if (isNaN(pause)) return showError('Set group ' + n + ': pause must be a whole number of seconds from 0 to 30.');
      }
      // A kg value is cleared when its load or load type changes (spec 5.11).
      var keepKg = d.orig && d.orig.loadType === d.loadType && d.orig.load === load.value;
      groups.push({
        sets: sets, reps: reps, repsMax: repsMax, loadType: d.loadType, load: load.value,
        rpe: rpe, rir: rir, kg: keepKg ? d.orig.kg : null, rest: rest,
        setType: d.setType === '' ? null : d.setType, tempo: tempo === '' ? null : tempo, pause: pause
      });
    }
    closeModal();
    if (weekIndex === 0) {
      // Week 1 is the source: regenerate every week that is not edited.
      // Each set group keeps its own pattern; a new group starts as "Same every week".
      var oldPatterns = ex.patterns;
      var oldSupersets = ex.supersets;
      ex.patterns = groups.map(function (g, i) {
        var from = drafts[i].origIndex;
        return from !== null ? oldPatterns[from] : samePattern(g.loadType);
      });
      ex.supersets = groups.map(function (g, i) {
        var from = drafts[i].origIndex;
        return from !== null ? oldSupersets[from] : null;
      });
      entry.groups = groups;
      ex.weeks = generateWeeks(ex, program.weeks);
      purgeBrokenPairs(workout); // a deleted set group unpairs its partner
      syncPairs(workout, ex, 0);
      changed();
    } else if (!groupsEqual(groups, entry.groups)) {
      entry.groups = groups;
      entry.edited = true;
      syncPairs(workout, ex, weekIndex);
      changed();
    }
  }

  var left = [el('button', {
    className: 'danger', text: 'Remove from this week',
    onclick: function () { closeModal(); removeFromWeek(workout, ex, weekIndex); }
  })];
  if (entry.edited && weekIndex > 0) {
    left.push(el('button', {
      text: 'Use pattern value',
      onclick: function () {
        closeModal();
        entry.edited = false;
        ex.weeks = generateWeeks(ex, program.weeks);
        changed();
      }
    }));
  }

  var bodyChildren = [rowsBox];
  bodyChildren.push(el('div', { className: 'form-row' }, [addGroupBtn]));
  bodyChildren.push(errorBox);

  openModal({
    title: title,
    wide: true,
    body: el('div', null, bodyChildren),
    actions: [
      el('div', { className: 'left' }, left),
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Save', onclick: save })
    ]
  });
}


// No "unsaved changes" warning on closing the tab: every edit is saved to the library at once.

startUp();
</script>
</body>
</html>

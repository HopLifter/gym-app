<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymLog Program Builder</title>
<style>
  :root {
    --bg: #0B0D0C;
    --surface: #161917;
    --line: #2A2F2B;
    --text: #EDEEEA;
    --text-dim: #8C948C;
    --accent: #C6FF3D;
    --danger: #E05C4E;
    --rpe: #8FC7FF;
    --selected-bg: #232A1A;
    --hair: #1F2421;                      /* faint divider inside the grid */
    --accent-soft: rgba(198, 255, 61, 0.45); /* light accent for the week header underline */
  }
  * { box-sizing: border-box; }
  /* Thin, dark scroll bars everywhere (the default light ones look out of place on this dark page). */
  * { scrollbar-width: thin; scrollbar-color: #3A413B transparent; }
  html { height: 100%; }
  body {
    height: 100%;
    display: flex; flex-direction: column; /* header on top, the grid scrolls in the middle, the table at the bottom */
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    min-width: 1024px;
  }
  button, input {
    font: inherit;
    color: var(--text);
  }
  button {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--text-dim); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  /* ---- Header ---- */
  .header {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .field { display: flex; align-items: center; gap: 8px; }
  .field label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  #name-input { width: 260px; font-size: 16px; font-weight: 600; }
  .stepper { display: flex; align-items: center; }
  .stepper button { width: 32px; padding: 7px 0; font-size: 16px; line-height: 1; }
  .stepper .value { min-width: 36px; text-align: center; font-weight: 600; }
  .header-buttons { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

  /* ---- Grid (flat: thin lines and spacing, no boxes) ---- */
  .main { flex: 1 1 auto; min-width: 0; min-height: 0; overflow: auto; padding: 0 20px 20px; }
  /* Week columns are 200 to 260 px wide: they fill the window up to 260 px each, shrink to 200 px,
     and the grid scrolls sideways below that. --n (the number of weeks) is set on the table. */
  table.grid {
    border-collapse: separate; border-spacing: 0; table-layout: fixed;
    width: clamp(calc(var(--n) * 200px), 100%, calc(var(--n) * 260px));
  }
  /* The week header row stays visible while the grid scrolls (.main is the scroll container). */
  table.grid th {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 14px; text-align: left;
    color: var(--accent); font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.04em;
    border-bottom: 2px solid var(--accent-soft);
  }
  /* One full-width row per workout: its title and a one-sentence description. */
  tr.band-row td { padding: 0; border-top: 1px solid var(--line); }
  .band {
    position: sticky; left: 0; max-width: var(--mainw, calc(100vw - 40px));
    display: flex; align-items: baseline; gap: 10px; padding: 22px 14px 7px;
  }
  /* Week heading: the title on the left, the flag icon at the right. */
  .th-in { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .flag-btn {
    display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0 2px;
    color: var(--text-dim); font-size: 15px; line-height: 1; font-weight: 400; letter-spacing: 0; text-transform: none;
  }
  .flag-btn:hover:not(:disabled) { color: var(--text); }
  .flag-name { font-size: 12px; font-weight: 600; }
  .flag-btn.flag-deload, .flag-item.flag-deload { color: #E8B04A; }
  .flag-btn.flag-test, .flag-item.flag-test { color: var(--rpe); }
  .flag-btn.flag-comp, .flag-item.flag-comp { color: var(--accent); }
  .flag-menu {
    position: fixed; z-index: 150; min-width: 130px; display: flex; flex-direction: column; padding: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .flag-item { background: none; border: none; text-align: left; padding: 6px 10px; border-radius: 6px; color: var(--text-dim); }
  .flag-item:hover { background: var(--bg); }
  .flag-item.on { font-weight: 600; }
  .band .t { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .band input.workout-desc {
    flex: 1; min-width: 0; background: transparent; color: var(--text-dim);
    border: 1px solid transparent; border-radius: 6px; padding: 2px 6px;
  }
  .band input.workout-desc:hover { border-color: var(--line); }
  .band input.workout-desc:focus { border-color: var(--accent); color: var(--text); outline: none; }
  .band input.workout-desc::placeholder { font-style: italic; opacity: 0.7; }
  /* One table row per exercise (a "slot"), the same in every week, so exercises line up across weeks. */
  table.grid td.cell { vertical-align: top; padding: 7px 14px; border-left: 1px solid var(--hair); }
  table.grid td.cell.c0 { border-left: none; }
  tr.slot td.cell { border-top: 1px solid var(--hair); }
  tr.slot.first td.cell { border-top: none; }
  tr.foot-row td.cell { padding: 4px 14px 14px; }
  td.cell.sel { background: var(--selected-bg); }
  td.cell.sel .ex.selected { background: none; box-shadow: none; }
  .ex-top { display: flex; gap: 6px; align-items: baseline; }
  .ex-name { font-weight: 600; word-break: break-word; }
  .ex-scheme { color: var(--text-dim); }
  .ex-load { font-weight: 600; }
  /* The superset label (A1, A2) sits at the right end of the prescription line. */
  .ex-label { color: var(--accent); font-weight: 700; }
  /* All load types use the accent colour; the text itself names the type (kg, %, RPE). */
  .load-kg, .load-pct, .load-rpe, .load-rir { color: var(--accent); }
  .load-blank { color: var(--text-dim); font-style: italic; font-weight: 400; }
  .ex-more { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .ex-edited { color: var(--text-dim); font-size: 12px; margin-left: auto; white-space: nowrap; }
  /* A set group line: the prescription on the left (it can wrap), the superset label at the right. */
  .ex-group { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: start; margin-top: 2px; }
  .ex-rx { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; min-width: 0; }
  .ex-group + .ex-group { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 6px; }
  .set-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; align-self: center;
    padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--text-dim);
  }
  .set-badge.strong { border-color: #3B4A1C; color: var(--accent); }
  .ex-sub { grid-column: 1 / -1; font-size: 12px; color: var(--text-dim); }
  .ss-block { border-left: 2px solid var(--accent); padding-left: 8px; margin-left: -10px; }
  .ss-block .ex { padding: 3px 0; }
  .ss-block .ex + .ex { border-top: 1px solid var(--hair); }
  .ex.selected { background: var(--selected-bg); box-shadow: -14px 0 0 var(--selected-bg), 14px 0 0 var(--selected-bg); }
  .ex.clickable:hover:not(.selected) { background: var(--surface); box-shadow: -14px 0 0 var(--surface), 14px 0 0 var(--surface); }
  .cell-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; }
  .link-btn { background: none; border: none; padding: 0; color: var(--text-dim); font-size: 13px; }
  .link-btn:hover:not(:disabled) { color: var(--accent); }
  .gone { color: var(--text-dim); font-style: italic; padding: 6px 0 2px; }
  .gone .link-btn { color: var(--accent); font-style: normal; margin-left: 8px; }

  /* ---- Exercise settings panel (docked right of the grid; flat, no boxes) ---- */
  #workspace { flex: 1 1 auto; min-height: 0; display: flex; }
  #workspace[hidden] { display: none; }
  .detail { width: 360px; flex: none; overflow: auto; border-left: 1px solid var(--line); padding: 14px 18px 18px; }
  .detail[hidden] { display: none; }
  .ph { display: flex; align-items: flex-start; gap: 10px; }
  .ph .t { flex: 1; min-width: 0; }
  .ph .t b { display: block; font-size: 16px; word-break: break-word; }
  .ph .t span { color: var(--text-dim); font-size: 12px; }
  .ph .x { background: none; border: none; color: var(--text-dim); font-size: 22px; line-height: 1; padding: 0 4px; }
  .ph .x:hover { color: var(--text); }
  .ps { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
  .ps-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .ps-head b { font-size: 13px; }
  .hint { color: var(--text-dim); font-size: 12px; }
  .pr { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 30px; }
  .pr > label { width: 84px; flex: none; color: var(--text-dim); font-size: 12px; }
  .pr .unit { color: var(--text-dim); }
  .link-btn.acc { color: var(--accent); text-align: left; }
  .link-btn.danger-link { color: var(--danger); }
  .link-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  table.prog { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 4px; }
  table.prog th { text-align: left; color: var(--text-dim); font-size: 11px; font-weight: 600; padding: 2px 8px 2px 0; }
  table.prog td { padding: 3px 8px 3px 0; vertical-align: baseline; }
  table.prog td.k { color: var(--text-dim); }
  table.prog td.v { color: var(--accent); font-weight: 600; cursor: pointer; }
  table.prog td.v.blank { color: var(--text-dim); font-style: italic; font-weight: 400; }
  table.prog td.v.edited { text-decoration: underline dashed; text-underline-offset: 3px; }
  table.prog td.v:hover { background: var(--surface); }
  .panel-acts { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 16px; }
  .detail textarea {
    width: 100%; background: var(--bg); color: var(--text); font: inherit; resize: vertical; min-height: 48px;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
  }
  .detail textarea:focus { outline: none; border-color: var(--accent); }
  .detail select { background: var(--bg); color: var(--text); font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  .detail select:focus { outline: none; border-color: var(--accent); }
  /* ---- Athletes in the Library, and the profile screen (two columns) ---- */
  .lib-sect.static { cursor: default; }
  .tag-template { font-size: 11px; padding: 1px 8px; border-radius: 9px; border: 1px solid #3B4A1C; color: var(--accent); }
  .tag-warn { font-size: 11px; padding: 1px 8px; border-radius: 9px; border: 1px solid #5A4720; color: #E8B04A; white-space: nowrap; }
  .warn-text { color: #E8B04A; font-size: 12px; }
  .lib-row .t.dim { color: var(--text-dim); }
  #profile { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #profile[hidden] { display: none; }
  .lib-bar .dim { color: var(--text-dim); }
  .pf-body { flex: 1 1 auto; min-height: 0; display: flex; }
  .pf-left { flex: 0 0 600px; max-width: 60%; overflow: auto; padding: 16px 20px 24px; }
  .pf-right { flex: 1 1 auto; min-width: 0; overflow: auto; border-left: 1px solid var(--line); padding: 16px 24px 24px; display: flex; flex-direction: column; }
  .pf-left .pr > label { width: 110px; }
  .pf-left .pr input[type="text"] { width: 300px; }
  .pf-left .pr input.num-input { width: 70px; text-align: right; }
  .pf-left textarea, .pf-right textarea {
    width: 100%; background: var(--bg); color: var(--text); font: inherit; resize: vertical; min-height: 48px;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
  }
  .pf-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .pf-table th { text-align: left; color: var(--text-dim); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 10px 6px 0; }
  .pf-table td { padding: 5px 10px 5px 0; border-top: 1px solid var(--hair); vertical-align: middle; }
  .pf-table input[type="text"] { width: 100%; }
  .pf-table input.num-input { width: 74px; text-align: right; }
  .pf-table .segmented button { padding: 4px 10px; font-size: 12px; }
  .pf-right .pr input[type="text"] { width: 100%; }
  .pf-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 24px; margin-top: 8px; align-content: start; }
  .pf-check { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .pf-check input { accent-color: var(--danger); margin: 0; }
  .pf-check.no { color: var(--danger); }
  .tempo-input { width: 110px; }
  .pr .tgt input[type="text"] { width: 54px; flex: none; }
  .pr .segmented button { padding: 4px 9px; font-size: 12px; }
  .danger-text { color: var(--danger); }
  .segmented { display: inline-flex; }
  .segmented button { border-radius: 0; margin-left: -1px; padding: 5px 12px; }
  .segmented button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .segmented button:last-child { border-radius: 0 8px 8px 0; }
  .segmented button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; position: relative; }
  .pattern-btn { display: block; max-width: 190px; white-space: normal; text-align: left; margin-bottom: 4px; }
  .pattern-group { display: block; color: var(--text-dim); font-size: 12px; }
  .pattern-group:empty { display: none; }
  .amount-input { width: 80px; text-align: center; }
  .mode-select { width: auto; }
  .rest-line { margin-top: 4px; color: var(--text-dim); font-size: 12px; }
  .rest-input { width: 48px; padding: 3px 6px; text-align: center; }
  .ex.clickable { cursor: pointer; }
  .ex.clickable:hover { border-color: var(--text-dim); }
  .ex.clickable:focus-visible { outline: 2px solid var(--accent); }

  /* ---- Forms inside modals ---- */
  .modal.wide { width: 800px; }
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .form-row label, .group-row label { color: var(--text-dim); font-size: 12px; }
  .form-cols { display: flex; gap: 12px; }
  .form-cols .form-row { flex: 1; }
  .modal input[type="text"], .modal select, .modal textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit;
  }
  .modal textarea { resize: vertical; min-height: 56px; }
  .modal textarea.prompt-box { height: 340px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
  .form-warning { color: var(--rpe); font-size: 12px; margin-top: -6px; margin-bottom: 12px; }
  .form-error { color: var(--danger); margin-bottom: 12px; }
  .modal .sub { margin: -4px 0 14px; color: var(--text-dim); }
  .group-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
  .group-row > div { flex: 1; min-width: 0; }
  .group-row .del { flex: 0 0 auto; }
  /* Week editor: narrow fields so a whole set group (with rep range and target) fits on one line. */
  .group-row > .w-xs { flex: 0 0 52px; }
  .group-row > .w-sm { flex: 0 0 74px; }
  .group-row > .w-target { flex: 0 0 172px; }
  .tgt { display: flex; align-items: center; gap: 6px; }
  .tgt input[type="text"] { width: 54px; flex: none; }
  .tgt .segmented button { padding: 5px 7px; font-size: 12px; }
  /* The second line of a set group: set type, tempo, pause. */
  .group-more { display: flex; gap: 8px; align-items: flex-end; margin: -2px 0 14px 12px; padding-left: 12px; border-left: 2px solid var(--line); }
  .group-more > div { min-width: 0; }
  .group-more .w-md { flex: 0 0 150px; }
  .group-more .w-sm { flex: 0 0 74px; }
  .group-more-link { margin: -2px 0 12px 12px; }
  .opt { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; cursor: pointer; }
  .opt input { width: auto; margin: 0; accent-color: var(--accent); }
  .opt-label { font-weight: 600; }
  .opt-desc { color: var(--text-dim); font-size: 12px; }
  .custom-step { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px 24px; }
  .custom-step button { width: 30px; padding: 4px 0; }
  .pv-title { display: block; color: var(--text-dim); font-size: 12px; margin-bottom: 6px; }
  .preview { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .pv { display: flex; flex-direction: column; gap: 2px; min-width: 96px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .pv-week { color: var(--text-dim); font-size: 12px; }
  .pv-val { font-weight: 600; }
  .pv-tag { color: var(--text-dim); font-size: 12px; }
  .pv input[type="text"] { padding: 4px 6px; width: 88px; }
  .modal .actions .left { margin-right: auto; display: flex; gap: 8px; }

  /* ---- Modal and notice ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; width: 420px; max-width: 90vw;
  }
  .modal h2 { margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0 0 18px; color: var(--text-dim); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .notice {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--accent); color: var(--text);
    padding: 10px 18px; border-radius: 8px; z-index: 200;
  }
  #save-warning { color: var(--danger); padding: 8px 20px 0; display: flex; align-items: center; gap: 12px; }
  #save-warning[hidden] { display: none; }
  #save-warning button { padding: 3px 10px; font-size: 12px; }

  /* ---- Library screen (Phase 2 spec 1.1). Flat: dividers and spacing, no boxes around items. ---- */
  .header, #save-warning, .detail { flex: none; }
  #library { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .lib-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .lib-bar, .lib-foot { flex: none; }
  .meta-text { color: var(--text-dim); }
  .icon-btn { background: none; border: none; padding: 2px 6px; font-size: 17px; line-height: 1; color: var(--text-dim); }
  .icon-btn:hover:not(:disabled) { color: var(--accent); border-color: transparent; }
  .size-row { display: flex; gap: 28px; margin-bottom: 14px; }
  .header[hidden], #library[hidden] { display: none; }
  .lib-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .lib-bar .title { font-size: 16px; font-weight: 600; }
  .lib-bar .spacer { margin-left: auto; display: flex; gap: 8px; }
  .lib-sect { display: flex; align-items: center; gap: 10px; padding: 14px 20px 8px; font-weight: 600; cursor: pointer; }
  .lib-sect .car { width: 14px; color: var(--text-dim); }
  .lib-sect .count { color: var(--text-dim); font-weight: 400; font-size: 12px; }
  .lib-sect button { margin-left: auto; padding: 4px 10px; }
  .lib-row { display: flex; align-items: center; gap: 12px; padding: 9px 20px 9px 44px; border-top: 1px solid var(--line); }
  .lib-row:hover { background: var(--surface); }
  .lib-row.current { background: var(--selected-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .lib-row .t { flex: 1; min-width: 0; }
  .lib-row .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-row .t span { color: var(--text-dim); font-size: 12px; }
  .lib-row .when { color: var(--text-dim); }
  .lib-row .acts { display: flex; gap: 6px; }
  .lib-row .acts button { padding: 3px 9px; font-size: 12px; }
  .tag-now { font-size: 11px; padding: 1px 7px; border-radius: 9px; border: 1px solid #3b4a1c; color: var(--accent); white-space: nowrap; }
  .lib-foot { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-top: 1px solid var(--line); color: var(--text-dim); font-size: 12px; }
  .lib-foot .grow { flex: 1; }
  .lib-foot .stale { color: #E8B04A; }
  .meter { width: 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .meter.warn i { background: var(--danger); }
</style>
</head>
<body>
  <div class="header" id="header"></div>
  <div id="save-warning" hidden><span>This browser could not save your last change. It will be lost when the page closes.</span><button id="warn-export">Export everything</button></div>
  <div id="library" hidden></div>
  <div id="profile" hidden></div>
  <div id="workspace">
    <div class="main" id="main"><div class="grid-wrap" id="grid"></div></div>
    <div class="detail" id="detail" hidden></div>
  </div>

<script>
'use strict';

/* ==========================================================================
   DATA MODEL (spec section 6)
   Pure functions: no drawing code here, so they are easy to test and reuse.
   ========================================================================== */

var DRAFT_KEY = 'builder_draft_v1';         // Phase 1 draft: read once to move it into the library, never written or deleted
var PROGRAMS_KEY = 'builder_programs_v1';   // the library: array of { id, name, modified, program }
var OPEN_KEY = 'builder_open_v1';           // { kind: 'program', id } of the item open in the editor
var PROFILES_KEY = 'builder_profiles_v1';   // athlete profiles: array of profile objects (Phase 2 spec step 3)
var LAST_EXPORT_KEY = 'builder_lastexport_v1'; // ISO date-time of the last Export everything
var LIBRARY_FORMAT = 'gym-builder-library';    // the backup file made by Export everything
var LIBRARY_FORMAT_VERSION = 1;
var MAX_LIBRARY_FILE_BYTES = 20 * 1024 * 1024;
var EXPORT_REMINDER_DAYS = 14;              // "Last exported" turns amber after this many days
var STORAGE_LIMIT_CHARS = 5 * 1024 * 1024;  // browsers allow about 5 MB of text per site
var EXERCISE_LIST_KEY = 'builder_exercise_list_v1';
var FORMAT_NAME = 'gym-program-builder';
var FORMAT_VERSION = 1;
var MAX_WEEKS = 12;
var MAX_WORKOUTS = 7;

var nextIdNumber = 1; // used by makeId(); reset from the program after loading

function makeId(prefix) {
  return prefix + '_' + (nextIdNumber++);
}

// Look through a program and make sure new ids never repeat existing ones.
function syncIdCounter(program) {
  var highest = 0;
  function check(id) {
    var n = parseInt(String(id).split('_')[1], 10);
    if (n > highest) highest = n;
  }
  program.workouts.forEach(function (w) {
    check(w.id);
    w.exercises.forEach(function (e) {
      check(e.id);
      (e.supersets || []).forEach(function (id) { if (id) check(id); });
    });
  });
  nextIdNumber = highest + 1;
}

// Set types (Phase 2 spec 2.2): a label for a set group. Nothing is calculated from it yet.
var SET_TYPES = ['warmup', 'top', 'backoff', 'amrap', 'drop'];
var SET_TYPE_LABELS = { warmup: 'Warm-up', top: 'Top set', backoff: 'Back-off', amrap: 'AMRAP', drop: 'Drop set' };
var SET_TYPE_BADGES = { warmup: 'Warm-up', top: 'Top', backoff: 'Back-off', amrap: 'AMRAP', drop: 'Drop' };

function newGroup() {
  // `rest` is in seconds and belongs to the set group, so groups can rest for different times.
  // Coaching fields (Phase 2 spec step 2), all optional (null = not used):
  //   repsMax   upper end of a rep range (`reps` is then the lower end)
  //   rir       target reps in reserve (a group has an RPE target or an RIR target, never both)
  //   setType   one of SET_TYPES
  //   tempo     free text up to 12 characters, such as 3-1-1-0
  //   pause     seconds paused in the bottom position, 0 to 30
  return {
    sets: 3, reps: 10, repsMax: null, loadType: 'kg', load: null, rpe: null, rir: null, kg: null, rest: 90,
    setType: null, tempo: null, pause: null
  };
}

function newWeekEntry() {
  return { included: true, edited: false, groups: [newGroup()] };
}

// A new exercise has one weeks[] entry per program week (spec section 6).
function newExercise(name, weekCount) {
  var weeks = [];
  for (var i = 0; i < weekCount; i++) weeks.push(newWeekEntry());
  return {
    id: makeId('ex'),
    name: name,
    notes: '',
    // One pattern and one superset entry per set group of Week 1, in the same order as Week 1's
    // groups. A superset entry is null, or an id shared by exactly two set groups (of two
    // different exercises in the same workout) that are paired.
    patterns: [samePattern('kg')],
    supersets: [null],
    weeks: weeks
  };
}

function samePattern(loadType) {
  return { kind: 'same', type: loadType, amount: 0 };
}

function newWorkout() {
  return { id: makeId('wk'), description: '', exercises: [] };
}

// A new empty program. `options` (all optional): name, weeks, workoutsPerWeek. There is no "block"
// number any more: anything the block number told you belongs in the program name.
function createDefaultProgram(options) {
  options = options || {};
  nextIdNumber = 1;
  var count = options.workoutsPerWeek || 3;
  var weekCount = options.weeks || 4;
  var workouts = [];
  for (var i = 0; i < count; i++) workouts.push(newWorkout());
  var flags = [];
  for (var w = 0; w < weekCount; w++) flags.push(null);
  return {
    format: FORMAT_NAME,
    version: FORMAT_VERSION,
    name: options.name || 'New Program',
    weeks: weekCount,
    workoutsPerWeek: count,
    weekFlags: flags,
    workouts: workouts
  };
}

// Week flags (Phase 2 spec 2.6): a label for a whole week. Deload only labels the week for now.
var WEEK_FLAGS = ['deload', 'test', 'comp'];
var WEEK_FLAG_LABELS = { deload: 'Deload', test: 'Test', comp: 'Competition' };

/* --------------------------------------------------------------------------
   Validation. Anything that comes from outside (localStorage now, opened
   files later) is untrusted, so we check every field before using it.
   Returns true only if the object has the full, correct shape.
   -------------------------------------------------------------------------- */

function isNum(v) { return typeof v === 'number' && isFinite(v); }
function isNumOrNull(v) { return v === null || isNum(v); }
function isWholeBetween(v, lo, hi) { return isNum(v) && Math.floor(v) === v && v >= lo && v <= hi; }

function isValidGroup(g) {
  return !!g && typeof g === 'object'
    && isWholeBetween(g.sets, 1, 99)
    && isWholeBetween(g.reps, 1, 999)
    && (g.loadType === 'kg' || g.loadType === 'pct' || g.loadType === 'rpe' || g.loadType === 'rir')
    && isNumOrNull(g.load)
    && isNumOrNull(g.rpe)
    && (g.loadType !== 'rpe' || g.rpe === null)
    && (g.loadType !== 'rir' || g.rpe === null)    // a load that is itself an RPE or RIR has no separate target
    && isNumOrNull(g.kg)
    && isNum(g.rest) && g.rest >= 0
    // Coaching fields. migrateOldPatterns fills them in (as null) for files made before they existed.
    && (g.repsMax === null || (isWholeBetween(g.repsMax, 2, 999) && g.repsMax > g.reps))
    && isNumOrNull(g.rir) && (g.rir === null || (g.rir >= 0 && g.rir <= 10))
    && (g.rir === null || g.rpe === null)                        // one effort target, not both
    && ((g.loadType !== 'rpe' && g.loadType !== 'rir') || g.rir === null)
    && (g.setType === null || SET_TYPES.indexOf(g.setType) >= 0)
    && (g.tempo === null || (typeof g.tempo === 'string' && g.tempo.length <= 12))
    && (g.pause === null || isWholeBetween(g.pause, 0, 30));
}

function isValidWeekEntry(w) {
  return !!w && typeof w === 'object'
    && typeof w.included === 'boolean'
    && typeof w.edited === 'boolean'
    && Array.isArray(w.groups)
    && w.groups.length >= 1 && w.groups.length <= 20
    && w.groups.every(isValidGroup);
}

function isValidPattern(p) {
  return !!p && typeof p === 'object'
    && (p.kind === 'same' || p.kind === 'add' || p.kind === 'percent' || p.kind === 'manual')
    && (p.type === 'kg' || p.type === 'pct' || p.type === 'rpe' || p.type === 'rir')
    && isNum(p.amount)
    // Percentage patterns also say how to round (step in kg, and nearest / up / down).
    && (p.step === undefined || (isNum(p.step) && p.step > 0))
    && (p.mode === undefined || p.mode === 'nearest' || p.mode === 'up' || p.mode === 'down');
}

function isValidExercise(e, weekCount) {
  return !!e && typeof e === 'object'
    && typeof e.id === 'string' && /^ex_\d+$/.test(e.id)
    && typeof e.name === 'string' && e.name.length <= 200
    && typeof e.notes === 'string'
    && Array.isArray(e.weeks) && e.weeks.length === weekCount
    && e.weeks.every(isValidWeekEntry)
    && Array.isArray(e.supersets)
    && e.supersets.length === e.weeks[0].groups.length
    && e.supersets.every(function (s) { return s === null || typeof s === 'string'; })
    && Array.isArray(e.patterns)
    && e.patterns.length === e.weeks[0].groups.length
    && e.patterns.every(isValidPattern);
}

function isValidProgram(p) {
  if (!p || typeof p !== 'object') return false;
  if (p.format !== FORMAT_NAME) return false;
  if (!isWholeBetween(p.version, 1, FORMAT_VERSION)) return false; // higher version = reject (spec 5.13)
  if (typeof p.name !== 'string' || p.name.length > 200) return false;
  // `block` is optional: older files have it, new programs do not.
  if (p.block !== undefined && !isWholeBetween(p.block, 1, 9999)) return false;
  if (!isWholeBetween(p.weeks, 1, MAX_WEEKS)) return false;
  if (!isWholeBetween(p.workoutsPerWeek, 1, MAX_WORKOUTS)) return false;
  if (!Array.isArray(p.workouts) || p.workouts.length !== p.workoutsPerWeek) return false;
  // One flag per week: null, "deload", "test" or "comp". (migrateOldPatterns adds it to older files.)
  if (!Array.isArray(p.weekFlags) || p.weekFlags.length !== p.weeks) return false;
  if (!p.weekFlags.every(function (f) { return f === null || WEEK_FLAGS.indexOf(f) >= 0; })) return false;
  for (var i = 0; i < p.workouts.length; i++) {
    var w = p.workouts[i];
    if (!w || typeof w !== 'object') return false;
    if (typeof w.id !== 'string' || !/^wk_\d+$/.test(w.id)) return false;
    if (typeof w.description !== 'string' || w.description.length > 500) return false;
    if (!Array.isArray(w.exercises)) return false;
    for (var j = 0; j < w.exercises.length; j++) {
      if (!isValidExercise(w.exercises[j], p.weeks)) return false;
    }
  }
  return true;
}

/* --------------------------------------------------------------------------
   Draft storage (spec 5.13). localStorage can fail (private mode, full disk),
   so every call is wrapped in try/catch.
   -------------------------------------------------------------------------- */

// Older drafts had ONE pattern and ONE rest time per exercise (`pattern`, `rest`). Both now belong
// to each set group (`patterns`, `group.rest`), so convert before validating. Anything odd is left
// for validation to reject.
function migrateOldPatterns(p) {
  if (!p || !Array.isArray(p.workouts)) return;
  // Week flags were added in Phase 2 step 2: an older file has none, which means no week is flagged.
  if (!Array.isArray(p.weekFlags) && isWholeBetween(p.weeks, 1, MAX_WEEKS)) {
    p.weekFlags = [];
    for (var f = 0; f < p.weeks; f++) p.weekFlags.push(null);
  }
  p.workouts.forEach(function (w) {
    if (!w || !Array.isArray(w.exercises)) return;
    w.exercises.forEach(function (e) {
      if (!e || !Array.isArray(e.weeks) || !e.weeks[0] || !Array.isArray(e.weeks[0].groups)) return;
      if (!Array.isArray(e.patterns) && e.pattern) {
        var old = e.pattern;
        e.patterns = e.weeks[0].groups.map(function (g) {
          return g && g.loadType === old.type ? old : samePattern(g ? g.loadType : 'kg');
        });
        delete e.pattern;
      }
      // Supersets used to pair whole exercises (`supersetId`); they now pair set groups.
      if (!Array.isArray(e.supersets)) {
        var oldId = typeof e.supersetId === 'string' ? e.supersetId : null;
        e.supersets = e.weeks[0].groups.map(function () { return oldId; });
      }
      delete e.supersetId;
      var rest = typeof e.rest === 'number' ? e.rest : 90;
      e.weeks.forEach(function (week) {
        if (!week || !Array.isArray(week.groups)) return;
        week.groups.forEach(function (g) {
          if (!g || typeof g !== 'object') return;
          if (g.rest === undefined) g.rest = rest;
          // Coaching fields added in Phase 2 step 2: older files do not have them.
          ['repsMax', 'rir', 'setType', 'tempo', 'pause'].forEach(function (key) { if (g[key] === undefined) g[key] = null; });
        });
      });
      delete e.rest;
    });
  });
}

/* --------------------------------------------------------------------------
   Library storage (Phase 2 spec step 1). All programs live in one localStorage key as an array
   of { id, name, modified, program }. Everything that reads or writes the library goes through
   these functions, so the storage can be changed later without touching the editor.
   -------------------------------------------------------------------------- */

function newLibraryId() {
  return 'lib_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// Checks one library entry from storage or from a file. Returns a clean entry, or null if
// anything about it is wrong (the program gets the same full check as an opened program file).
function cleanLibraryEntry(entry) {
  if (!entry || typeof entry !== 'object') return null;
  if (typeof entry.id !== 'string' || !/^lib_[a-z0-9]+$/.test(entry.id)) return null;
  if (typeof entry.modified !== 'string' || isNaN(new Date(entry.modified).getTime())) return null;
  migrateOldPatterns(entry.program);
  if (!isValidProgram(entry.program)) return null;
  entry.program.workouts.forEach(purgeBrokenPairs);
  return { id: entry.id, name: entry.program.name, kind: entry.kind === 'template' ? 'template' : 'program', modified: entry.modified, program: entry.program };
}

// Returns the saved programs. An entry that fails the checks is skipped, never half-used.
function libraryLoadPrograms() {
  try {
    var data = JSON.parse(localStorage.getItem(PROGRAMS_KEY));
    if (!Array.isArray(data)) return [];
    var seen = {};
    var good = [];
    data.forEach(function (raw) {
      var entry = cleanLibraryEntry(raw);
      if (!entry || seen[entry.id]) return;
      seen[entry.id] = true;
      good.push(entry);
    });
    return good;
  } catch (err) {
    return [];
  }
}

/* --------------------------------------------------------------------------
   Athlete profiles (Phase 2 spec step 3). One object per athlete, all in one array under
   builder_profiles_v1: name, notes, the lifts with their maxes, the rounding step, and the
   exercises the athlete cannot do. Pure data and checks here; the screens come later in the file.
   -------------------------------------------------------------------------- */

var PROFILE_FORMAT = 'gym-builder-profile';
var PROFILE_VERSION = 1;
var STANDARD_LIFTS = ['Back Squat', 'Bench Press', 'Deadlift'];

function newProfileId() {
  return 'pf_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// `base` says which value percentages use: '1rm' or 'tm' (training max). `updated` is the date the
// maxes were last changed (ISO text), or null.
function newLift(name) {
  return { name: name, oneRm: null, trainingMax: null, base: '1rm', updated: null };
}

function newProfile(name) {
  return {
    format: PROFILE_FORMAT, version: PROFILE_VERSION, id: newProfileId(), name: name,
    modified: new Date().toISOString(), rounding: 2.5, notes: '', unavailable: [],
    lifts: STANDARD_LIFTS.map(newLift)
  };
}

function isValidLift(l) {
  return !!l && typeof l === 'object' && typeof l.name === 'string' && l.name.length <= 100
    && (l.oneRm === null || (isNum(l.oneRm) && l.oneRm >= 0 && l.oneRm <= 2000))
    && (l.trainingMax === null || (isNum(l.trainingMax) && l.trainingMax >= 0 && l.trainingMax <= 2000))
    && (l.base === '1rm' || l.base === 'tm')
    && (l.updated === null || (typeof l.updated === 'string' && !isNaN(new Date(l.updated).getTime())));
}

// Checks one profile from storage or from a file. Returns it, or null if anything is wrong.
function cleanProfile(p) {
  if (!p || typeof p !== 'object' || p.format !== PROFILE_FORMAT) return null;
  if (!isWholeBetween(p.version, 1, PROFILE_VERSION)) return null;
  if (typeof p.id !== 'string' || !/^pf_[a-z0-9]+$/.test(p.id)) return null;
  if (typeof p.name !== 'string' || p.name.length > 200) return null;
  if (typeof p.modified !== 'string' || isNaN(new Date(p.modified).getTime())) return null;
  if (!isNum(p.rounding) || p.rounding < 0.5 || p.rounding > 10) return null;
  if (typeof p.notes !== 'string' || p.notes.length > 2000) return null;
  if (!Array.isArray(p.unavailable) || p.unavailable.length > MAX_EXERCISE_NAMES) return null;
  if (!p.unavailable.every(function (n) { return typeof n === 'string' && n.length >= 1 && n.length <= 200; })) return null;
  if (!Array.isArray(p.lifts) || p.lifts.length > 50 || !p.lifts.every(isValidLift)) return null;
  return p;
}

function profilesLoad() {
  try {
    var data = JSON.parse(localStorage.getItem(PROFILES_KEY));
    if (!Array.isArray(data)) return [];
    var seen = {};
    var good = [];
    data.forEach(function (raw) {
      var p = cleanProfile(raw);
      if (!p || seen[p.id]) return;
      seen[p.id] = true;
      good.push(p);
    });
    return good;
  } catch (err) {
    return [];
  }
}

function profilesSave(list) {
  try {
    localStorage.setItem(PROFILES_KEY, JSON.stringify(list));
    return true;
  } catch (err) {
    return false;
  }
}

// A lift of the profile by name (capital letters and spaces at the ends do not matter), or null.
function findLift(profile, name) {
  if (!profile || typeof name !== 'string') return null;
  var wanted = name.trim().toLowerCase();
  for (var i = 0; i < profile.lifts.length; i++) {
    if (profile.lifts[i].name.trim().toLowerCase() === wanted) return profile.lifts[i];
  }
  return null;
}

// The value percentages use for a lift: its 1RM or its training max, as the profile says. null if blank.
function liftBaseValue(lift) {
  var v = lift.base === 'tm' ? lift.trainingMax : lift.oneRm;
  return v === undefined ? null : v;
}

// Spec 3.4: `percent` of the lift's base value, rounded to the profile's step. null when the lift is
// missing, its value is blank, or the percent is blank. (Pure: no drawing, no storage.)
function kgForPercent(percent, liftName, profile) {
  if (percent === null || percent === undefined) return null;
  var lift = findLift(profile, liftName);
  if (!lift) return null;
  var base = liftBaseValue(lift);
  if (base === null) return null;
  var step = profile.rounding;
  return cleanNum(Math.round(percent / 100 * base / step) * step);
}

// ---- Export everything / Import everything (Phase 2 spec 1.4 and 1.5) ----

// The date and time of the last Export everything (ISO text), or null if never.
function libraryReadLastExport() {
  try {
    var text = localStorage.getItem(LAST_EXPORT_KEY);
    return text && !isNaN(new Date(text).getTime()) ? text : null;
  } catch (err) {
    return null;
  }
}

// Builds the backup file's content. Templates, profiles and versions arrive in later steps, so
// their lists are empty for now; the file already has a place for them.
function buildLibraryFile(exportedOn) {
  return {
    format: LIBRARY_FORMAT,
    version: LIBRARY_FORMAT_VERSION,
    exportedOn: exportedOn,
    programs: library.map(function (e) { return { id: e.id, name: e.name, kind: e.kind, modified: e.modified, program: e.program }; }),
    templates: [],
    profiles: JSON.parse(JSON.stringify(profiles)),
    versions: [],
    exerciseList: loadExerciseList()
  };
}

// Reads and checks a library file. Returns { entries, profiles, exerciseList } or null. One broken item
// refuses the whole file: a half-imported backup would be worse than none.
function parseLibraryFile(text) {
  var data;
  try { data = JSON.parse(text); } catch (err) { return null; }
  if (!data || typeof data !== 'object' || Array.isArray(data)) return null;
  if (data.format !== LIBRARY_FORMAT) return null;
  if (!isWholeBetween(data.version, 1, LIBRARY_FORMAT_VERSION)) return null; // a newer file is refused
  if (!Array.isArray(data.programs)) return null;
  var lists = ['templates', 'profiles', 'versions'];
  for (var i = 0; i < lists.length; i++) {
    if (data[lists[i]] !== undefined && !Array.isArray(data[lists[i]])) return null;
  }
  var seen = {};
  var entries = [];
  for (var j = 0; j < data.programs.length; j++) {
    var entry = cleanLibraryEntry(data.programs[j]);
    if (!entry || seen[entry.id]) return null;
    seen[entry.id] = true;
    entries.push(entry);
  }
  // Athlete profiles: every one must be valid, like the programs.
  var profs = [];
  if (data.profiles !== undefined) {
    var seenP = {};
    for (var k = 0; k < data.profiles.length; k++) {
      var pr = cleanProfile(data.profiles[k]);
      if (!pr || seenP[pr.id]) return null;
      seenP[pr.id] = true;
      profs.push(pr);
    }
  }
  var names = [];
  if (data.exerciseList !== undefined) {
    if (!Array.isArray(data.exerciseList) || data.exerciseList.length > MAX_EXERCISE_NAMES) return null;
    var have = {};
    data.exerciseList.forEach(function (n) {
      if (typeof n !== 'string') return;
      var t = n.trim();
      if (t !== '' && t.length <= 200 && !have[t]) { have[t] = true; names.push(t); }
    });
  }
  return { entries: entries, profiles: profs, exerciseList: names };
}

// Returns true if the write worked (localStorage can fail: private mode, full storage).
function librarySavePrograms(list) {
  try {
    localStorage.setItem(PROGRAMS_KEY, JSON.stringify(list));
    return true;
  } catch (err) {
    return false;
  }
}

function libraryReadOpenId() {
  try {
    var data = JSON.parse(localStorage.getItem(OPEN_KEY));
    return data && data.kind === 'program' && typeof data.id === 'string' ? data.id : null;
  } catch (err) {
    return null;
  }
}

function libraryWriteOpenId(id) {
  try { localStorage.setItem(OPEN_KEY, JSON.stringify({ kind: 'program', id: id })); } catch (err) { /* the open item is a convenience */ }
}

// How much of the browser's storage the builder uses, in characters (about the same as bytes of text).
function libraryStorageChars() {
  var total = 0;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (key.indexOf('builder_') === 0) total += key.length + (localStorage.getItem(key) || '').length;
    }
  } catch (err) { /* report what we have */ }
  return total;
}

// dd/mm/yyyy (the project's date format) from a stored ISO date.
function formatDate(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  function two(n) { return (n < 10 ? '0' : '') + n; }
  return two(d.getDate()) + '/' + two(d.getMonth() + 1) + '/' + d.getFullYear();
}

// Returns a valid program, or null if there is no draft or it is damaged.
function loadDraft() {
  try {
    var text = localStorage.getItem(DRAFT_KEY);
    if (text === null) return null;
    var data = JSON.parse(text);
    migrateOldPatterns(data);
    if (!isValidProgram(data)) return null;
    data.workouts.forEach(purgeBrokenPairs);
    return data;
  } catch (err) {
    return null;
  }
}

/* ==========================================================================
   CALCULATIONS (spec 5.9, 5.10). Pure functions: no drawing, no storage.
   ========================================================================== */

// Removes tiny floating-point errors, e.g. 0.1 + 0.2 = 0.30000000000000004.
function cleanNum(v) { return Math.round(v * 10000) / 10000; }

function cloneGroup(g) {
  return {
    sets: g.sets, reps: g.reps, repsMax: g.repsMax, loadType: g.loadType, load: g.load, rpe: g.rpe, rir: g.rir,
    kg: g.kg, rest: g.rest, setType: g.setType, tempo: g.tempo, pause: g.pause
  };
}

// Are two lists of set groups the same? (Compared field by field, so the order of keys in the
// objects does not matter.)
var GROUP_KEYS = ['sets', 'reps', 'repsMax', 'loadType', 'load', 'rpe', 'rir', 'kg', 'rest', 'setType', 'tempo', 'pause'];
function groupsEqual(a, b) {
  return a.length === b.length && a.every(function (x, i) {
    return GROUP_KEYS.every(function (key) { return x[key] === b[i][key]; });
  });
}

// The load one week later, following the pattern. `load` is never null here.
function nextLoad(load, pattern) {
  if (pattern.kind === 'add') {
    var next = cleanNum(load + pattern.amount);
    // RPE tops out at 10 and RIR cannot go below 0 (both stay between 0 and 10).
    return (pattern.type === 'rpe' || pattern.type === 'rir') ? Math.min(10, Math.max(0, next)) : next;
  }
  if (pattern.kind === 'percent') {
    // e.g. +5% rounded to the nearest 2.5 kg: round(previous x 1.05 / 2.5) x 2.5.
    // The step and direction (nearest / up / down) are chosen in the picker.
    var step = pattern.step || 2.5;
    var steps = cleanNum(load * (1 + pattern.amount / 100) / step); // cleanNum avoids 40.0000001 rounding up
    var whole = pattern.mode === 'up' ? Math.ceil(steps) : (pattern.mode === 'down' ? Math.floor(steps) : Math.round(steps));
    return cleanNum(whole * step);
  }
  return load; // 'same' and 'manual' copy the previous week
}

// Builds the full weeks[] array for an exercise from Week 1 and its pattern.
// - Week 1 is the source and is returned unchanged.
// - Edited weeks are kept exactly as they are.
// - Other weeks are regenerated. Each one starts from the previous week's
//   GENERATED value (not from a hand-edited value).
// - A blank Week 1 load stays blank. A group's kg value is kept only if its
//   load type and load did not change.
// Returns a new array of length weekCount; the exercise itself is not changed.
function generateWeeks(exercise, weekCount) {
  var week1 = exercise.weeks[0];
  var result = [week1];
  var previous = week1.groups.map(cloneGroup); // generated groups of the previous week
  for (var i = 1; i < weekCount; i++) {
    var generated = previous.map(function (prev, k) {
      var g = cloneGroup(prev);
      var pattern = exercise.patterns[k]; // each set group has its own pattern
      g.kg = null;
      g.rpe = prev.rpe;
      if (pattern && g.loadType === pattern.type && g.load !== null) {
        g.load = nextLoad(g.load, pattern);
      }
      return g;
    });
    var existing = exercise.weeks[i];
    if (existing && existing.edited) {
      result.push(existing);
    } else {
      // Keep kg values for set groups whose prescription did not change.
      if (existing) {
        generated.forEach(function (g, k) {
          var old = existing.groups[k];
          if (old && old.loadType === g.loadType && old.load === g.load) g.kg = old.kg;
        });
      }
      result.push({
        included: existing ? existing.included : week1.included,
        edited: false,
        groups: generated
      });
    }
    previous = generated;
  }
  return result;
}

// The two set groups that share superset id `id` in a workout, in exercise order:
// [{ ex, k }, { ex, k }], or fewer if the pair is broken.
function pairMembers(workout, id) {
  var found = [];
  workout.exercises.forEach(function (ex) {
    ex.supersets.forEach(function (s, k) { if (s === id) found.push({ ex: ex, k: k }); });
  });
  return found;
}

// Superset labels for one workout in one week (spec 5.4, 5.10).
// Returns { 'exerciseId:groupIndex': 'A1' | 'A2' | 'B1' ... }. Letters restart in each workout.
// A pair is labelled only if BOTH exercises are included that week and both have that set group.
function supersetLabels(workout, weekIndex) {
  var labels = {};
  var letterCode = 65; // 'A'
  var seen = {};
  workout.exercises.forEach(function (ex) {
    ex.supersets.forEach(function (id) {
      if (!id || seen[id]) return;
      seen[id] = true;
      var members = pairMembers(workout, id);
      var active = members.length === 2 && members.every(function (m) {
        var entry = m.ex.weeks[weekIndex];
        return entry.included && !!entry.groups[m.k];
      });
      if (!active) return;
      var letter = String.fromCharCode(letterCode++);
      labels[members[0].ex.id + ':' + members[0].k] = letter + '1';
      labels[members[1].ex.id + ':' + members[1].k] = letter + '2';
    });
  });
  return labels;
}

// Any superset id that is not used by exactly two set groups is cleared. Called after anything
// that can remove a set group (deleting an exercise or a group), and after loading a draft.
function purgeBrokenPairs(workout) {
  var counts = {};
  workout.exercises.forEach(function (ex) {
    ex.supersets.forEach(function (id) { if (id) counts[id] = (counts[id] || 0) + 1; });
  });
  workout.exercises.forEach(function (ex) {
    ex.supersets = ex.supersets.map(function (id) { return id && counts[id] === 2 ? id : null; });
  });
}

function formatNum(v) { return String(Math.round(v * 100) / 100); }

// "8" or "8–12" (a rep range).
function repsText(g) { return g.reps + (g.repsMax !== null ? '–' + g.repsMax : ''); }
// "3 × 8–12"
function setsRepsText(g) { return g.sets + ' × ' + repsText(g); }
// " @ RPE 8", " @ RIR 2", or '' when the group has no effort target.
function targetText(g) {
  if (g.rpe !== null) return ' @ RPE ' + formatNum(g.rpe);
  if (g.rir !== null) return ' @ RIR ' + formatNum(g.rir);
  return '';
}
// The tempo and pause of a group as one dim line, or '' if neither is set.
function tempoPauseText(g) {
  var parts = [];
  if (g.tempo) parts.push('Tempo ' + g.tempo);
  if (g.pause !== null) parts.push(g.pause + ' s pause');
  return parts.join(' · ');
}

// How a set group's load is shown (spec 5.4, 5.11). Returns { text, cls }.
// `plan` (optional) is text such as " + 5 kg": the change the pattern will make once a load is set.
function describeLoad(g, plan) {
  if (g.load === null) return { text: 'Set load' + (plan || ''), cls: 'load-blank' };
  var kgPart = g.kg === null ? '' : ' · ' + formatNum(g.kg) + ' kg';
  if (g.loadType === 'kg') {
    var shown = formatNum(g.load) + ' kg';
    if (g.kg !== null && g.kg !== g.load) shown += kgPart;
    return { text: shown, cls: 'load-kg' };
  }
  if (g.loadType === 'pct') return { text: formatNum(g.load) + '%' + kgPart, cls: 'load-pct' };
  if (g.loadType === 'rir') return { text: 'RIR ' + formatNum(g.load) + kgPart, cls: 'load-rir' };
  return { text: 'RPE ' + formatNum(g.load) + kgPart, cls: 'load-rpe' };
}

var UNIT_SUFFIX = { kg: ' kg', pct: '%', rpe: ' RPE', rir: ' RIR' };

// For a set group whose load is still blank: the total change its pattern plans for this week,
// counted from Week 1 (e.g. Week 3 of "+5 kg per week" gives " + 10 kg"). Returns '' when there
// is nothing to show: Week 1, a load that is set, an edited week, or a pattern that changes nothing.
function plannedChange(pattern, weekIndex, g, entry) {
  if (!pattern || weekIndex === 0 || g.load !== null || entry.edited) return '';
  if (pattern.type !== g.loadType) return '';
  var total;
  if (pattern.kind === 'add') {
    total = cleanNum(pattern.amount * weekIndex);
  } else if (pattern.kind === 'percent') {
    total = cleanNum((Math.pow(1 + pattern.amount / 100, weekIndex) - 1) * 100);
    if (total === 0) return '';
    return ' ' + (total > 0 ? '+' : '−') + ' ' + formatNum(Math.abs(total)) + '%';
  } else {
    return '';
  }
  if (total === 0) return '';
  return ' ' + (total > 0 ? '+' : '−') + ' ' + formatNum(Math.abs(total)) + UNIT_SUFFIX[pattern.type];
}

// The "Replace edited weeks" choice in the pattern picker: for set group k, put the pattern's
// value into every week edited by hand. A week stops being "edited" if it then matches what the
// patterns would generate; otherwise it stays edited (it has other hand-made differences).
function replaceEditedGroup(ex, k) {
  var clone = JSON.parse(JSON.stringify(ex));
  clone.weeks.forEach(function (w) { w.edited = false; });
  var fresh = generateWeeks(clone, ex.weeks.length);
  ex.weeks.forEach(function (w, i) {
    if (i === 0 || !w.edited) return;
    var g = w.groups[k];
    var f = fresh[i].groups[k];
    if (g && f && g.loadType === f.loadType && g.load !== f.load) { g.load = f.load; g.kg = null; }
    var same = w.groups.length === fresh[i].groups.length && w.groups.every(function (x, j) {
      var y = fresh[i].groups[j];
      return x.sets === y.sets && x.reps === y.reps && x.repsMax === y.repsMax && x.loadType === y.loadType
        && x.load === y.load && x.rpe === y.rpe && x.rir === y.rir && x.rest === y.rest
        && x.setType === y.setType && x.tempo === y.tempo && x.pause === y.pause;
    });
    if (same) w.edited = false;
  });
}

// Does cutting the program down to `weekCount` weeks lose edits or kg values?
function weeksHaveWork(prog, weekCount) {
  return prog.workouts.some(function (w) {
    return w.exercises.some(function (ex) {
      return ex.weeks.slice(weekCount).some(function (entry) {
        return entry.edited || entry.groups.some(function (g) { return g.kg !== null; });
      });
    });
  });
}

function programHasExercises(prog) {
  return prog.workouts.some(function (w) { return w.exercises.length > 0; });
}

/* ==========================================================================
   APP STATE
   One `program` object; render() redraws everything from it.
   ========================================================================== */

var program = null;        // the program open in the editor: the same object as `program` in its library entry
var library = [];          // every saved program: { id, name, modified, program }
var currentId = null;      // id of the library entry open in the editor
var libraryOpen = false;   // true while the Library screen is showing instead of the editor
var draftSaved = true;     // false if the last localStorage write failed (shows a warning)

function findEntry(id) {
  for (var i = 0; i < library.length; i++) if (library[i].id === id) return library[i];
  return null;
}

// The entry edited most recently (used when nothing else says which program to open).
function mostRecentEntry() {
  var best = null;
  library.forEach(function (e) { if (!best || e.modified > best.modified) best = e; });
  return best;
}

function saveLibrary() {
  draftSaved = librarySavePrograms(library);
  return draftSaved;
}

var profiles = [];   // every athlete profile (see "Athlete profiles" above)

function saveProfiles() {
  draftSaved = profilesSave(profiles);
  return draftSaved;
}

// Marks the open program as edited just now. Its entry shares the program object, so only the
// name and date need copying across.
function touchCurrent() {
  var entry = findEntry(currentId);
  if (!entry) return;
  entry.name = program.name;
  entry.modified = new Date().toISOString();
}

// Call this after EVERY change that needs a redraw. The library saves itself: there is no
// separate "save" step and no unsaved-changes warning (Phase 2 spec 1.2).
function changed() {
  touchCurrent();
  saveLibrary();
  render();
}

// For typing in text boxes: save, but do not redraw (a redraw would drop the cursor).
function changedQuietly() {
  touchCurrent();
  saveLibrary();
  document.getElementById('save-warning').hidden = draftSaved;
}

// `kind` is 'program' (default) or 'template'. A template is a program meant to be reused for many
// athletes (Phase 2 spec step 4); both live in the same list and open in the same editor.
function addProgramEntry(p, kind) {
  var entry = { id: newLibraryId(), name: p.name, kind: kind === 'template' ? 'template' : 'program', modified: new Date().toISOString(), program: p };
  library.push(entry);
  return entry;
}

// Makes an entry the program in the editor. It does not redraw and does not leave the Library.
function setCurrent(entry) {
  currentId = entry.id;
  program = entry.program;
  syncIdCounter(program);
  selected = null;
  libraryWriteOpenId(entry.id);
}

function startUp() {
  document.getElementById('warn-export').addEventListener('click', exportEverything);
  library = libraryLoadPrograms();
  profiles = profilesLoad();
  if (library.length === 0) {
    // First visit to the library: move the Phase 1 draft in (the draft key itself is left alone),
    // or start with an empty program.
    addProgramEntry(loadDraft() || createDefaultProgram());
    saveLibrary();
  }
  setCurrent(findEntry(libraryReadOpenId()) || mostRecentEntry());
  libraryOpen = true;   // the builder starts on the Library; pick a program to work on
  render();
}

/* ==========================================================================
   NEW PROGRAM AND PROGRAM SETTINGS
   The size of a program (weeks and workouts per week) is chosen when the program is created, and
   changed later with the Edit button in the editor header.
   ========================================================================== */

// Two steppers (weeks, workouts per week) that write into `state`.
function sizeSteppers(state) {
  var box = el('div', { className: 'size-row' });
  function draw() {
    box.textContent = '';
    box.appendChild(stepper('Weeks', state.weeks, 1, MAX_WEEKS, function (n) { state.weeks = n; draw(); if (state.onChange) state.onChange(); }));
    box.appendChild(stepper('Workouts / week', state.workouts, 1, MAX_WORKOUTS, function (n) { state.workouts = n; draw(); if (state.onChange) state.onChange(); }));
  }
  draw();
  return box;
}

// New program (opened from the Library): name, weeks and workouts per week. The new program is
// added to the library and opened in the editor.
function openNewProgramDialog(kind) {
  var isTemplate = kind === 'template';
  var state = { weeks: 4, workouts: 3 };
  var nameInput = textInput(isTemplate ? 'New Template' : 'New Program', { maxlength: '200', 'aria-label': isTemplate ? 'Template name' : 'Program name' });
  var error = el('div', { className: 'form-error' });
  function create() {
    var name = nameInput.value.trim();
    if (name === '') { error.textContent = 'Enter a name.'; return; }
    closeModal();
    var entry = addProgramEntry(createDefaultProgram({ name: name, weeks: state.weeks, workoutsPerWeek: state.workouts }), kind);
    saveLibrary();
    setCurrent(entry);
    libraryOpen = false;
    render();
  }
  nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') create(); });
  openModal({
    title: isTemplate ? 'New template' : 'New program',
    body: el('div', null, [
      formRow('Name', nameInput),
      sizeSteppers(state),
      el('div', { className: 'sub', text: 'You can change the weeks and workouts later with Edit.' }),
      error
    ]),
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Create', onclick: create })
    ]
  });
  nameInput.focus();
  nameInput.select();
}

// Edit (editor header): change the number of weeks and workouts per week.
function openProgramSettings() {
  var state = { weeks: program.weeks, workouts: program.workoutsPerWeek };
  var mode = 'extend';
  var note = el('div');

  function radio(value, label, desc) {
    var input = el('input', { type: 'radio', name: 'new-weeks', value: value });
    if (value === mode) input.checked = true;
    input.addEventListener('change', function () { mode = value; });
    return el('label', { className: 'opt' }, [input, el('span', null, [
      el('span', { className: 'opt-label', text: label }),
      el('span', { className: 'opt-desc', text: ' ' + desc })
    ])]);
  }
  function drawNote() {
    note.textContent = '';
    if (state.weeks > program.weeks && programHasExercises(program)) {
      note.appendChild(el('div', { className: 'sub', text: 'How should the new weeks start?' }));
      note.appendChild(radio('extend', 'Extend existing workouts and patterns', 'The exercises continue into the new weeks.'));
      note.appendChild(radio('blank', 'Leave the new weeks blank', 'The new weeks start with no exercises.'));
    }
    if (state.weeks < program.weeks) {
      var first = state.weeks + 1;
      note.appendChild(el('div', { className: 'form-warning', text: (first === program.weeks ? 'Week ' + first : 'Weeks ' + first + ' to ' + program.weeks) + ' will be removed.' }));
    }
    if (state.workouts < program.workoutsPerWeek) {
      var firstW = state.workouts + 1;
      note.appendChild(el('div', { className: 'form-warning', text: (firstW === program.workoutsPerWeek ? 'Workout ' + firstW : 'Workouts ' + firstW + ' to ' + program.workoutsPerWeek) + ' will be removed.' }));
    }
  }
  state.onChange = drawNote;
  drawNote();

  openModal({
    title: 'Program settings',
    body: el('div', null, [sizeSteppers(state), note]),
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', {
        className: 'primary', text: 'Save',
        onclick: function () { closeModal(); applyProgramSettings(state.weeks, state.workouts, mode === 'blank'); }
      })
    ]
  });
}

// Changes the size of the open program. Removing weeks or workouts that hold work asks first.
// New weeks either continue the existing exercises and patterns, or (`blank`) start with every
// exercise left out of them.
function applyProgramSettings(newWeeks, newWorkouts, blank) {
  if (newWeeks === program.weeks && newWorkouts === program.workoutsPerWeek) return;
  var losses = [];
  if (newWeeks < program.weeks && weeksHaveWork(program, newWeeks)) {
    losses.push('The removed weeks hold edited cells or kg values.');
  }
  var lostExercises = 0;
  if (newWorkouts < program.workoutsPerWeek) {
    program.workouts.slice(newWorkouts).forEach(function (w) { lostExercises += w.exercises.length; });
  }
  if (lostExercises > 0) losses.push(plural(lostExercises, 'exercise') + ' in the removed workouts will be deleted.');

  function go() {
    var oldWeeks = program.weeks;
    if (newWorkouts > program.workoutsPerWeek) {
      while (program.workouts.length < newWorkouts) program.workouts.push(newWorkout());
    } else {
      program.workouts.length = newWorkouts;
    }
    program.workoutsPerWeek = newWorkouts;
    program.weeks = newWeeks;
    // One flag per week: new weeks start unflagged, removed weeks take their flags with them.
    while (program.weekFlags.length < newWeeks) program.weekFlags.push(null);
    program.weekFlags.length = newWeeks;
    program.workouts.forEach(function (w) {
      w.exercises.forEach(function (ex) {
        if (newWeeks > oldWeeks) {
          ex.weeks = generateWeeks(ex, newWeeks);
          if (blank) for (var i = oldWeeks; i < newWeeks; i++) ex.weeks[i].included = false;
        } else if (newWeeks < oldWeeks) {
          ex.weeks.length = newWeeks;
        }
      });
    });
    changed();
  }
  if (losses.length > 0) {
    showConfirm({ title: 'Remove from the program?', text: losses.join(' '), confirmLabel: 'Remove', onConfirm: go });
  } else {
    go();
  }
}

/* ==========================================================================
   SMALL DRAWING HELPERS
   `el` builds elements with textContent only, so user text can never run as HTML.
   ========================================================================== */

function el(tag, props, children) {
  var node = document.createElement(tag);
  if (props) {
    Object.keys(props).forEach(function (key) {
      if (props[key] === null) return; // null means "leave this attribute off"
      if (key === 'text') node.textContent = props[key];
      else if (key === 'className') node.className = props[key];
      else if (key === 'onclick') node.addEventListener('click', props[key]);
      else node.setAttribute(key, props[key]);
    });
  }
  (children || []).forEach(function (child) { node.appendChild(child); });
  return node;
}

var openModalCleanup = null;

function closeModal() {
  var overlay = document.getElementById('modal-overlay');
  if (overlay) overlay.remove();
  if (openModalCleanup) { openModalCleanup(); openModalCleanup = null; }
}

// Custom confirm dialog (native confirm() is not allowed in this project).
function showConfirm(opts) {
  closeModal();
  var cancelBtn = el('button', {
    text: 'Cancel',
    onclick: function () { closeModal(); if (opts.onCancel) opts.onCancel(); }
  });
  var okBtn = el('button', {
    className: opts.primary ? 'primary' : 'danger', // red for destructive confirms, green for the rest
    text: opts.confirmLabel,
    onclick: function () { closeModal(); opts.onConfirm(); }
  });
  var overlay = el('div', { className: 'overlay', id: 'modal-overlay' }, [
    el('div', { className: 'modal', role: 'dialog', 'aria-modal': 'true' }, [
      el('h2', { text: opts.title }),
      el('p', { text: opts.text }),
      el('div', { className: 'actions' }, [cancelBtn, okBtn])
    ])
  ]);
  document.body.appendChild(overlay);
  function onKey(e) { if (e.key === 'Escape') closeModal(); }
  document.addEventListener('keydown', onKey);
  openModalCleanup = function () { document.removeEventListener('keydown', onKey); };
  cancelBtn.focus();
}

var noticeTimer = null;
function showNotice(message) {
  var old = document.getElementById('notice');
  if (old) old.remove();
  document.body.appendChild(el('div', { className: 'notice', id: 'notice', text: message }));
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(function () {
    var n = document.getElementById('notice');
    if (n) n.remove();
  }, 2500);
}

/* ==========================================================================
   DRAWING (spec 5.2 header, 5.4 grid)
   ========================================================================== */

function stepper(label, value, min, max, onChange) {
  return el('div', { className: 'field' }, [
    el('label', { text: label }),
    el('div', { className: 'stepper' }, [
      el('button', {
        text: '−', 'aria-label': 'Decrease ' + label,
        onclick: function () { onChange(value - 1); },
        disabled: value <= min ? 'disabled' : null
      }),
      el('span', { className: 'value', text: String(value) }),
      el('button', {
        text: '+', 'aria-label': 'Increase ' + label,
        onclick: function () { onChange(value + 1); },
        disabled: value >= max ? 'disabled' : null
      })
    ])
  ]);
}

/* ==========================================================================
   FILES: Save file, Open file, Load Exercise List (spec 5.12, 5.13)
   Every file the user opens is untrusted: it is parsed and checked before anything is used.
   ========================================================================== */

var MAX_PROGRAM_FILE_BYTES = 5 * 1024 * 1024;     // a program file is small
var MAX_BACKUP_FILE_BYTES = 100 * 1024 * 1024;    // a GymLog backup can hold a lot of history
var BACKUP_EXERCISE_LIST_KEY = 'gymapp_exercise_list_v1'; // a key INSIDE the backup file; the builder never touches GymLog's localStorage
var MAX_EXERCISE_NAMES = 5000;

// The file name for Save file: the program name without characters that are unsafe in file
// names, followed by ".program.json" (spec 5.13).
function programFileName(name) {
  var safe = String(name)
    .replace(/[\\/:*?"<>|\u0000-\u001F]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/^[\s.]+|[\s.]+$/g, '');
  if (safe.length > 100) safe = safe.slice(0, 100).replace(/[\s.]+$/g, '');
  if (safe === '') safe = 'Program';
  return safe + '.program.json';
}

// Reads the text of a program file and returns a checked program, or null if it can not be opened.
function parseProgramFile(text) {
  var data;
  try { data = JSON.parse(text); } catch (err) { return null; }
  migrateOldPatterns(data); // files saved by an earlier build of the builder
  if (!isValidProgram(data)) return null;
  var seen = {};
  var unique = true;
  data.workouts.forEach(function (w) {
    if (seen[w.id]) unique = false;
    seen[w.id] = true;
    w.exercises.forEach(function (ex) {
      if (seen[ex.id]) unique = false;
      seen[ex.id] = true;
    });
  });
  if (!unique) return null;
  data.workouts.forEach(purgeBrokenPairs);
  return data;
}

// Finds the Exercise List in the text of a GymLog "Backup All Data" file. That key holds a
// JSON-encoded string, so it is parsed a second time. Returns a clean array of names, or null.
function parseExerciseListFromBackup(text) {
  try {
    var backup = JSON.parse(text);
    if (!backup || typeof backup !== 'object' || Array.isArray(backup)) return null;
    if (!Object.prototype.hasOwnProperty.call(backup, BACKUP_EXERCISE_LIST_KEY)) return null;
    var value = backup[BACKUP_EXERCISE_LIST_KEY];
    var list = typeof value === 'string' ? JSON.parse(value) : value;
    if (!Array.isArray(list)) return null;
    var names = [];
    var seen = Object.create(null);
    list.forEach(function (n) {
      if (typeof n !== 'string') return;
      var t = n.trim().slice(0, 200);
      if (t === '' || Object.prototype.hasOwnProperty.call(seen, t)) return;
      seen[t] = true;
      names.push(t);
    });
    if (names.length === 0 || names.length > MAX_EXERCISE_NAMES) return null;
    return names;
  } catch (err) {
    return null;
  }
}

// A simple message dialog with a Close button.
function showMessage(title, text) {
  openModal({
    title: title,
    body: el('p', { text: text }),
    actions: [el('button', { className: 'primary', text: 'Close', onclick: closeModal })]
  });
}

// Opens the browser's file picker (it must be called from a click) and passes the file's text on.
function pickTextFile(maxBytes, onText, onTooBig) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', function () {
    var file = input.files && input.files[0];
    if (!file) return;
    if (file.size > maxBytes) { onTooBig(); return; }
    var reader = new FileReader();
    reader.onload = function () { onText(String(reader.result)); };
    reader.onerror = function () { onTooBig(); };
    reader.readAsText(file);
  });
  input.click();
}

// Downloads an object as a JSON file with the given name.
function downloadJson(name, data) {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

// Downloads any program as a file (used by Save file and by Export in the Library).
function downloadProgram(p) {
  var name = programFileName(p.name);
  downloadJson(name, p);
  showNotice('Saved as ' + name + '.');
}

// Export everything (spec 1.4): one backup file with the whole library, and the date is remembered
// for the "Last exported" reminder.
function exportEverything() {
  var now = new Date();
  function two(n) { return (n < 10 ? '0' : '') + n; }
  var stamp = now.getFullYear() + two(now.getMonth() + 1) + two(now.getDate());
  var name = 'GymLog-Builder-Library-' + stamp + '.json';
  downloadJson(name, buildLibraryFile(now.toISOString()));
  try { localStorage.setItem(LAST_EXPORT_KEY, now.toISOString()); } catch (err) { /* the reminder is a convenience */ }
  showNotice('Saved as ' + name + '.');
  render();
}

// Import everything (spec 1.5): checks the file, then asks how to bring it in.
function importEverything() {
  function cannotOpen() { showMessage('Import everything', "This file can't be opened."); }
  pickTextFile(MAX_LIBRARY_FILE_BYTES, function (text) {
    var data = parseLibraryFile(text);
    if (!data) { cannotOpen(); return; }
    askImportMode(data);
  }, cannotOpen);
}

function askImportMode(data) {
  var mode = 'add';
  function radio(value, label, desc) {
    var input = el('input', { type: 'radio', name: 'import-mode', value: value });
    if (value === mode) input.checked = true;
    input.addEventListener('change', function () { mode = value; });
    return el('label', { className: 'opt' }, [input, el('span', null, [
      el('span', { className: 'opt-label', text: label }),
      el('span', { className: 'opt-desc', text: ' ' + desc })
    ])]);
  }
  var summary = 'This file holds ' + plural(data.entries.length, 'program') +
    (data.profiles.length ? ', ' + plural(data.profiles.length, 'athlete') : '') +
    (data.exerciseList.length ? ' and an Exercise List of ' + plural(data.exerciseList.length, 'exercise') : '') + '.';
  function go() {
    closeModal();
    if (mode === 'replace') {
      showConfirm({
        title: 'Replace everything?',
        text: 'All ' + plural(library.length, 'program') + ' in this browser will be deleted and replaced by the file. This cannot be undone.',
        confirmLabel: 'Replace',
        onConfirm: function () { applyImport(data, 'replace'); }
      });
    } else {
      applyImport(data, 'add');
    }
  }
  openModal({
    title: 'Import everything',
    body: el('div', null, [
      el('p', { text: summary }),
      radio('add', 'Add as copies', 'Keeps everything you have and adds the programs from the file.'),
      radio('replace', 'Replace everything', 'Deletes what you have and uses the file instead.')
    ]),
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Import', onclick: go })
    ]
  });
}

function applyImport(data, mode) {
  if (mode === 'replace') {
    library = data.entries.slice();
    if (library.length === 0) addProgramEntry(createDefaultProgram());
    profiles = data.profiles.slice();
  } else {
    var usedNames = {};
    profiles.forEach(function (p) { usedNames[p.name] = true; });
    data.profiles.forEach(function (p) {
      var copy = JSON.parse(JSON.stringify(p));
      copy.id = newProfileId();   // a new id, so nothing you have is replaced
      if (usedNames[copy.name]) copy.name = (copy.name + ' (imported)').slice(0, 200);
      usedNames[copy.name] = true;
      profiles.push(copy);
    });
    var used = {};
    library.forEach(function (e) { used[e.name] = true; });
    data.entries.forEach(function (e) {
      var p = e.program;
      if (used[p.name]) p.name = (p.name + ' (imported)').slice(0, 200);
      used[p.name] = true;
      var added = addProgramEntry(p, e.kind); // gets a new id
      added.modified = e.modified;
    });
  }
  // The Exercise List: Replace uses the file's list (if it has one); Add only fills in a missing one.
  if (data.exerciseList.length && (mode === 'replace' || loadExerciseList().length === 0)) {
    try { localStorage.setItem(EXERCISE_LIST_KEY, JSON.stringify(data.exerciseList)); } catch (err) { /* reported below if the library fails too */ }
  }
  if (!findEntry(currentId)) setCurrent(mostRecentEntry());
  var savedPrograms = saveLibrary();
  var savedProfiles = saveProfiles();
  if (!savedPrograms || !savedProfiles) showMessage('Import everything', 'The imported items could not be saved in this browser. They are in memory only until the page closes.');
  render();
  showNotice('Imported ' + plural(data.entries.length, 'program') + (data.profiles.length ? ' and ' + plural(data.profiles.length, 'athlete') : '') + '.');
}

// Import program (Library page): reads and checks a program file and adds it to the library as a
// new program. Nothing is replaced and the Library stays open. An invalid file changes nothing.
function importProgramFile() {
  function cannotOpen() { showMessage('Import program', "This file can't be opened."); }
  pickTextFile(MAX_PROGRAM_FILE_BYTES, function (text) {
    var data = parseProgramFile(text);
    if (!data) { cannotOpen(); return; }
    var entry = addProgramEntry(data);
    saveLibrary();
    render();
    showNotice('Imported "' + entry.name + '".');
  }, cannotOpen);
}

// Load Exercise List: reads a GymLog backup file, keeps only the Exercise List (it replaces any
// list saved before) and nothing else from the backup.
function loadExerciseListFile() {
  function noList() { showMessage('Load Exercise List', "This file doesn't contain an Exercise List."); }
  pickTextFile(MAX_BACKUP_FILE_BYTES, function (text) {
    var names = parseExerciseListFromBackup(text);
    if (!names) { noList(); return; }
    try {
      localStorage.setItem(EXERCISE_LIST_KEY, JSON.stringify(names));
    } catch (err) {
      showMessage('Load Exercise List', 'The Exercise List could not be saved in this browser.');
      return;
    }
    showNotice(names.length + (names.length === 1 ? ' exercise loaded.' : ' exercises loaded.'));
  }, noList);
}

// The full prompt for the current program. split/join is used instead of replace so that
// characters like "$" in a program name are copied as they are.
function buildAiPrompt() {
  var text = AI_PROMPT_LINES.join('\n');
  text = text.split('[program name]').join(program.name);
  return text.split('[program JSON]').join(JSON.stringify(program, null, 2));
}

// How many set groups in included weeks have no load yet (the AI will suggest values for them).
function countBlankLoads() {
  var count = 0;
  program.workouts.forEach(function (w) {
    w.exercises.forEach(function (ex) {
      ex.weeks.forEach(function (entry) {
        if (!entry.included) return;
        entry.groups.forEach(function (g) { if (g.load === null) count++; });
      });
    });
  });
  return count;
}

// Shown when the browser does not allow copying: the prompt in a text box to copy by hand.
function showPromptBox(text) {
  var box = el('textarea', { className: 'prompt-box', readonly: 'readonly', 'aria-label': 'AI prompt' });
  box.value = text;
  openModal({
    title: 'Copy the prompt',
    wide: true,
    body: el('div', null, [
      el('p', { text: 'Your browser did not allow copying. Select all the text below and copy it yourself.' }),
      box
    ]),
    actions: [
      el('button', { text: 'Select all', onclick: function () { box.focus(); box.select(); } }),
      el('button', { className: 'primary', text: 'Close', onclick: closeModal })
    ]
  });
  box.focus();
  box.select();
}

function copyPromptNow() {
  var text = buildAiPrompt();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function () { showNotice('Prompt copied.'); },
      function () { showPromptBox(text); }
    );
  } else {
    showPromptBox(text);
  }
}

// Copy AI prompt (spec 5.14): needs at least one exercise, and asks first if some loads are blank.
function copyAiPrompt() {
  if (!programHasExercises(program)) {
    showNotice('Add an exercise first.');
    return;
  }
  var blank = countBlankLoads();
  if (blank > 0) {
    showConfirm({
      title: 'Copy AI prompt?',
      text: blank + (blank === 1 ? ' load is blank.' : ' loads are blank.') + ' The AI will suggest values for them.',
      confirmLabel: 'Copy prompt',

      onConfirm: copyPromptNow
    });

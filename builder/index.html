/* ==========================================================================
   FILES: Save file, Open file, Load Exercise List (spec 5.12, 5.13)
   Every file the user opens is untrusted: it is parsed and checked before anything is used.
   ========================================================================== */

var MAX_PROGRAM_FILE_BYTES = 5 * 1024 * 1024;     // a program file is small
var MAX_BACKUP_FILE_BYTES = 100 * 1024 * 1024;    // a GymLog backup can hold a lot of history
var BACKUP_EXERCISE_LIST_KEY = 'gymapp_exercise_list_v1'; // a key INSIDE the backup file; the builder never touches GymLog's localStorage
var MAX_EXERCISE_NAMES = 5000;

// The file name for Save file: the program name without characters that are unsafe in file
// names, followed by ".program.json" (spec 5.13).
function safeFileBase(name) {
  var safe = String(name)
    .replace(/[\\/:*?"<>|\u0000-\u001F]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/^[\s.]+|[\s.]+$/g, '');
  if (safe.length > 100) safe = safe.slice(0, 100).replace(/[\s.]+$/g, '');
  return safe === '' ? 'Program' : safe;
}
function programFileName(name) { return safeFileBase(name) + '.program.json'; }
function gymlogFileName(name) { return safeFileBase(name) + '.gymlog.json'; }

// Reads the text of a program file and returns a checked program, or null if it can not be opened.
function parseProgramFile(text) {
  var data;
  try { data = JSON.parse(text); } catch (err) { return null; }
  migrateOldPatterns(data); // files saved by an earlier build of the builder
  if (!isValidProgram(data)) return null;
  var seen = {};
  var unique = true;
  data.workouts.forEach(function (w) {
    if (seen[w.id]) unique = false;
    seen[w.id] = true;
    w.exercises.forEach(function (ex) {
      if (seen[ex.id]) unique = false;
      seen[ex.id] = true;
    });
  });
  if (!unique) return null;
  data.workouts.forEach(purgeBrokenPairs);
  return data;
}

// Finds the Exercise List in the text of a GymLog "Backup All Data" file. That key holds a
// JSON-encoded string, so it is parsed a second time. Returns a clean array of names, or null.
function parseExerciseListFromBackup(text) {
  try {
    var backup = JSON.parse(text);
    if (!backup || typeof backup !== 'object' || Array.isArray(backup)) return null;
    if (!Object.prototype.hasOwnProperty.call(backup, BACKUP_EXERCISE_LIST_KEY)) return null;
    var value = backup[BACKUP_EXERCISE_LIST_KEY];
    var list = typeof value === 'string' ? JSON.parse(value) : value;
    if (!Array.isArray(list)) return null;
    var names = [];
    var seen = Object.create(null);
    list.forEach(function (n) {
      if (typeof n !== 'string') return;
      var t = n.trim().slice(0, 200);
      if (t === '' || Object.prototype.hasOwnProperty.call(seen, t)) return;
      seen[t] = true;
      names.push(t);
    });
    if (names.length === 0 || names.length > MAX_EXERCISE_NAMES) return null;
    return names;
  } catch (err) {
    return null;
  }
}

// A simple message dialog with a Close button.
function showMessage(title, text) {
  openModal({
    title: title,
    body: el('p', { text: text }),
    actions: [el('button', { className: 'primary', text: 'Close', onclick: closeModal })]
  });
}

// Opens the browser's file picker (it must be called from a click) and passes the file's text on.
function pickTextFile(maxBytes, onText, onTooBig) {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', function () {
    var file = input.files && input.files[0];
    if (!file) return;
    if (file.size > maxBytes) { onTooBig(); return; }
    var reader = new FileReader();
    reader.onload = function () { onText(String(reader.result)); };
    reader.onerror = function () { onTooBig(); };
    reader.readAsText(file);
  });
  input.click();
}

// Downloads an object as a JSON file with the given name.
function downloadJson(name, data) {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

// Downloads any program as a file (used by Save file and by Export in the Library).
function downloadProgram(p) {
  var name = programFileName(p.name);
  downloadJson(name, p);
  showNotice('Saved as ' + name + '.');
}

// Export everything (spec 1.4): one backup file with the whole library, and the date is remembered
// for the "Last exported" reminder.
function exportEverything() {
  var now = new Date();
  function two(n) { return (n < 10 ? '0' : '') + n; }
  var stamp = now.getFullYear() + two(now.getMonth() + 1) + two(now.getDate());
  var name = 'GymLog-Builder-Library-' + stamp + '.json';
  downloadJson(name, buildLibraryFile(now.toISOString()));
  try { localStorage.setItem(LAST_EXPORT_KEY, now.toISOString()); } catch (err) { /* the reminder is a convenience */ }
  showNotice('Saved as ' + name + '.');
  render();
}

// Import everything (spec 1.5): checks the file, then asks how to bring it in.
function importEverything() {
  function cannotOpen() { showMessage('Restore backup', "This file can't be opened."); }
  pickTextFile(MAX_LIBRARY_FILE_BYTES, function (text) {
    var data = parseLibraryFile(text);
    if (!data) { cannotOpen(); return; }
    askImportMode(data);
  }, cannotOpen);
}

function askImportMode(data) {
  var mode = 'add';
  function radio(value, label, desc) {
    var input = el('input', { type: 'radio', name: 'import-mode', value: value });
    if (value === mode) input.checked = true;
    input.addEventListener('change', function () { mode = value; });
    return el('label', { className: 'opt' }, [input, el('span', null, [
      el('span', { className: 'opt-label', text: label }),
      el('span', { className: 'opt-desc', text: ' ' + desc })
    ])]);
  }
  var summary = 'This file holds ' + plural(data.entries.length, 'program') +
    (data.profiles.length ? ', ' + plural(data.profiles.length, 'athlete') : '') +
    (data.exerciseList.length ? ' and an Exercise List of ' + plural(data.exerciseList.length, 'exercise') : '') + '.';
  function go() {
    closeModal();
    if (mode === 'replace') {
      showConfirm({
        title: 'Replace everything?',
        text: 'All ' + plural(library.length, 'program') + ' in this browser will be deleted and replaced by the file. This cannot be undone.',
        confirmLabel: 'Replace',
        onConfirm: function () { applyImport(data, 'replace'); }
      });
    } else {
      applyImport(data, 'add');
    }
  }
  openModal({
    title: 'Restore backup',
    body: el('div', null, [
      el('p', { text: summary }),
      radio('add', 'Add as copies', 'Keeps everything you have and adds the programs from the file.'),
      radio('replace', 'Replace everything', 'Deletes what you have and uses the file instead.')
    ]),
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Import', onclick: go })
    ]
  });
}

function applyImport(data, mode) {
  if (mode === 'replace') {
    library = data.entries.slice();
    if (library.length === 0) addProgramEntry(createDefaultProgram());
    profiles = data.profiles.slice();
  } else {
    var usedNames = {};
    var profileIdMap = {};   // old athlete id -> new id, so imported programs stay linked to their athlete
    var entryIdMap = {};     // old library id -> new id, so imported programs still know their template
    profiles.forEach(function (p) { usedNames[p.name] = true; });
    data.profiles.forEach(function (p) {
      var copy = JSON.parse(JSON.stringify(p));
      copy.id = newProfileId();   // a new id, so nothing you have is replaced
      profileIdMap[p.id] = copy.id;
      if (usedNames[copy.name]) copy.name = (copy.name + ' (imported)').slice(0, 200);
      usedNames[copy.name] = true;
      profiles.push(copy);
    });
    var used = {};
    var added = [];
    library.forEach(function (e) { used[e.name] = true; });
    data.entries.forEach(function (e) {
      var p = e.program;
      if (used[p.name]) p.name = (p.name + ' (imported)').slice(0, 200);
      used[p.name] = true;
      var entry = addProgramEntry(p, e.kind); // gets a new id
      entry.modified = e.modified;
      entry.note = e.note;
      entryIdMap[e.id] = entry.id;
      added.push(entry);
    });
    added.forEach(function (entry) {
      var src = entry.program.source;
      if (!src) return;
      src.profileId = src.profileId && profileIdMap[src.profileId] ? profileIdMap[src.profileId] : null;
      src.templateId = src.templateId && entryIdMap[src.templateId] ? entryIdMap[src.templateId] : null;
    });
  }
  // The Exercise List: Replace uses the file's list (if it has one); Add only fills in a missing one.
  if (data.exerciseList.length && (mode === 'replace' || loadExerciseList().length === 0)) {
    try { localStorage.setItem(EXERCISE_LIST_KEY, JSON.stringify(data.exerciseList)); } catch (err) { /* reported below if the library fails too */ }
  }
  if (!findEntry(currentId)) setCurrent(mostRecentEntry());
  var savedPrograms = saveLibrary();
  var savedProfiles = saveProfiles();
  if (!savedPrograms || !savedProfiles) showMessage('Restore backup', 'The imported items could not be saved in this browser. They are in memory only until the page closes.');
  render();
  showNotice('Imported ' + plural(data.entries.length, 'program') + (data.profiles.length ? ' and ' + plural(data.profiles.length, 'athlete') : '') + '.');
}

// Import program (Library page): reads and checks a program file and adds it to the library as a
// new program. Nothing is replaced and the Library stays open. An invalid file changes nothing.
function importProgramFile() {
  function cannotOpen() { showMessage('Import program file', "This file can't be opened."); }
  pickTextFile(MAX_PROGRAM_FILE_BYTES, function (text) {
    var data = parseProgramFile(text);
    if (!data) { cannotOpen(); return; }
    var entry = addProgramEntry(data);
    saveLibrary();
    render();
    showNotice('Imported "' + entry.name + '".');
  }, cannotOpen);
}

// Load Exercise List: reads a GymLog backup file, keeps only the Exercise List (it replaces any
// list saved before) and nothing else from the backup.
function loadExerciseListFile() {
  function noList() { showMessage('Import exercise list', "This file doesn't contain an Exercise List."); }
  pickTextFile(MAX_BACKUP_FILE_BYTES, function (text) {
    var names = parseExerciseListFromBackup(text);
    if (!names) { noList(); return; }
    try {
      localStorage.setItem(EXERCISE_LIST_KEY, JSON.stringify(names));
    } catch (err) {
      showMessage('Import exercise list', 'The Exercise List could not be saved in this browser.');
      return;
    }
    showNotice(names.length + (names.length === 1 ? ' exercise loaded.' : ' exercises loaded.'));
  }, noList);
}

/* ==========================================================================
   EXPORT FOR GYMLOG (Phase 2 spec 4.4)
   Writes the file the GymLog phone app imports (see docs/Program Import Format.md): one GymLog
   workout per workout per week. The coaching fields go into the exercise notes.
   ========================================================================== */

// The exercise notes for a set group: the coaching fields in a fixed order, then the coach's own notes.
// For example: "Top set · RIR 2 · 8–12 reps · Tempo 3-1-1-0 · 2 s pause".
function coachingNotes(g, exerciseNotes) {
  var parts = [];
  if (g.setType) parts.push(SET_TYPE_LABELS[g.setType]);
  if (g.loadType === 'rir' && g.load !== null) parts.push('RIR ' + formatNum(g.load));
  else if (g.rir !== null) parts.push('RIR ' + formatNum(g.rir));
  if (g.repsMax !== null) parts.push(g.reps + '–' + g.repsMax + ' reps');
  if (g.tempo) parts.push('Tempo ' + g.tempo);
  if (g.pause !== null) parts.push(g.pause + ' s pause');
  if (exerciseNotes) parts.push(exerciseNotes);
  return parts.join(' · ');
}

// The weight in kg GymLog should show for a set group, or null (left out).
function gymlogWeight(g) {
  if (g.loadType === 'kg') return g.load !== null ? g.load : g.kg;
  return g.kg;   // a % load (calculated for an athlete) or an RPE / RIR load (filled in by the AI), may be null
}

// Exercises with % loads that have no kg value yet, counted in included weeks only:
// [{ name, count (how many loads), weeks (how many weeks) }]. Two exercises with the same name
// (capital letters do not matter) are one line, because one max serves both.
function missingKgList(prog) {
  var list = [];
  var byName = {};
  prog.workouts.forEach(function (w) {
    w.exercises.forEach(function (ex) {
      var key = ex.name.trim().toLowerCase();
      ex.weeks.forEach(function (week) {
        if (!week.included) return;
        var n = week.groups.filter(function (g) { return g.loadType === 'pct' && g.load !== null && g.kg === null; }).length;
        if (n === 0) return;
        if (!byName[key]) { byName[key] = { name: ex.name, count: 0, weeks: 0 }; list.push(byName[key]); }
        byName[key].count += n;
        byName[key].weeks++;
      });
    });
  });
  return list;
}

// Shown in place of the export while % loads have no kg value. A program made for an athlete can
// take a max for each exercise here; the max is kept in the program (as Generate does for an
// exercise that is not a lift of the athlete). Any other program gets the correct advice.
function openMissingKgDialog(missing) {
  var owner = program.source ? findProfile(program.source.profileId) : null;
  var who = owner && owner.name ? owner.name : 'the athlete';
  function countText(m) { return plural(m.count, 'percentage load') + ' in ' + plural(m.weeks, 'week') + (m.count === 1 ? ' has' : ' have') + ' no kg value'; }
  var intro = el('p', { text: 'GymLog needs a kg value for each percentage load. ' + plural(missing.length, 'exercise') + (missing.length === 1 ? ' has' : ' have') + ' no max:' });

  if (!program.profileUsed) {
    openModal({
      title: "Can't export yet",
      body: el('div', null, [intro].concat(
        missing.map(function (m) { return el('div', { className: 'warn-text', text: '• ' + m.name + ': ' + countText(m) }); }),
        [el('p', { className: 'hint', text: 'This program is not made for an athlete, so the builder has no maxes for it. Use "Save as template" and then "Use for athlete", or get the kg values with "Copy AI prompt".' })]
      )),
      actions: [el('button', { className: 'primary', text: 'Close', onclick: closeModal })]
    });
    return;
  }

  var typed = {};
  var error = el('div', { className: 'form-error' });
  var rows = missing.map(function (m) {
    var input = textInput('', { inputmode: 'decimal', placeholder: '–', 'aria-label': 'Max in kg for ' + m.name });
    input.className = 'num-input';
    input.addEventListener('input', function () { typed[m.name] = input.value; });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') apply(); });
    return el('div', { className: 'gen-extra' }, [
      el('div', null, [el('b', { text: m.name }), el('div', { className: 'hint', text: countText(m) })]),
      input, el('span', { className: 'unit', text: 'kg' })
    ]);
  });

  function apply() {
    var extras = [];
    for (var i = 0; i < missing.length; i++) {
      var n = readMax(typed[missing[i].name] || '', 2000);
      if (n === undefined) { error.textContent = 'A max must be a number from 0 to 2000 kg.'; return; }
      if (n !== null) extras.push({ name: missing[i].name, value: n, extra: true });
    }
    if (extras.length === 0) { error.textContent = 'Enter a max for one exercise or more.'; return; }
    closeModal();
    program.profileUsed.lifts = program.profileUsed.lifts.concat(extras);
    changed();           // calculates the kg values again and saves
    exportForGymLog();   // goes on to the export, or shows what is still missing
  }

  openModal({
    title: "Can't export yet",
    wide: true,
    body: el('div', null, [intro].concat(rows, [
      el('p', { className: 'hint', text: 'Enter the max of each exercise. It is kept in this program only. To keep it for all programs of ' + who + ', add the lift to the profile.' }),
      error
    ])),
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Calculate kg', onclick: apply })
    ]
  });
}

// `withNotes` is false for the second and later set groups of an exercise in a workout: the coach's
// own notes go on the first entry only (the coaching fields of each set group are always written).
function gymlogExerciseEntry(ex, g, letter, withNotes) {
  var o = { name: ex.name, sets: g.sets, reps: g.reps };
  var weight = gymlogWeight(g);
  if (weight !== null) o.weight = weight;
  var rpe = g.loadType === 'rpe' ? g.load : g.rpe;   // RIR never goes in the rpe field
  if (rpe !== null) o.rpe = rpe;
  o.rest = g.rest;
  var notes = coachingNotes(g, withNotes ? ex.notes : '');
  if (notes !== '') o.notes = notes;
  if (letter) o.superset = letter;
  return o;
}

// The whole GymLog import file for a program: { program, workouts }.
function buildGymLogFile(prog) {
  var flagText = { deload: 'Deload week', test: 'Test week', comp: 'Competition week' };
  var workouts = [];
  for (var week = 0; week < prog.weeks; week++) {
    prog.workouts.forEach(function (workout, wi) {
      if (workout.exercises.length === 0 || workoutRemovedInWeek(workout, week)) return;
      var labels = supersetLabels(workout, week);
      var exercises = [];
      var noted = {};   // exercise id -> true once its notes are written in this workout
      function addGroup(ex, k) {
        var entry = ex.weeks[week];
        if (!entry.included || !entry.groups[k]) return;
        var label = labels[ex.id + ':' + k];
        exercises.push(gymlogExerciseEntry(ex, entry.groups[k], label ? label.charAt(0) : null, !noted[ex.id]));
        noted[ex.id] = true;
      }
      // The same row order as the grid: a paired set group is followed straight away by its partner.
      workoutSlots(workout).forEach(function (slot) {
        if (slot.type === 'run') slot.ks.forEach(function (k) { addGroup(slot.ex, k); });
        else slot.members.forEach(function (m) { addGroup(m.ex, m.k); });
      });
      if (exercises.length === 0) return;
      var flag = prog.weekFlags[week];
      var description = [workout.description.trim(), flag ? flagText[flag] : ''].filter(Boolean).join(' · ');
      var out = { label: prog.name + ' - Wk' + (week + 1) + ' D' + (wi + 1) };
      if (description !== '') out.description = description;
      out.exercises = exercises;
      workouts.push(out);
    });
  }
  return { program: { name: prog.name }, workouts: workouts };
}

// Names of exercises in the program that the athlete it was made for cannot do.
function unavailableInProgram(prog) {
  var owner = prog.source ? findProfile(prog.source.profileId) : null;
  var names = [];
  if (!owner) return names;
  prog.workouts.forEach(function (w) {
    w.exercises.forEach(function (ex) {
      if (isUnavailable(owner, ex.name) && names.indexOf(ex.name) < 0) names.push(ex.name);
    });
  });
  return names;
}

// One readable line for the preview: "Back Squat · 4 × 5 · 150 kg · RPE 8 · rest 4 min".
function previewLine(o) {
  var bits = [o.sets + ' × ' + o.reps];
  bits.push(o.weight !== undefined ? formatNum(o.weight) + ' kg' : 'no weight');
  if (o.rpe !== undefined) bits.push('RPE ' + formatNum(o.rpe));
  bits.push('rest ' + formatNum(o.rest / 60) + ' min');
  return bits.join(' · ');
}

function exportForGymLog() {
  var entry = findEntry(currentId);
  if (entry && entry.kind === 'template') return;   // a template has no kg to export
  var missing = missingKgList(program);
  if (missing.length > 0) { openMissingKgDialog(missing); return; }
  var file = buildGymLogFile(program);
  if (file.workouts.length === 0) { showMessage('Export for GymLog', 'There is nothing to export yet. Add some exercises first.'); return; }
  var cannot = unavailableInProgram(program);
  var owner = program.source ? findProfile(program.source.profileId) : null;
  var exerciseCount = file.workouts.reduce(function (n, w) { return n + w.exercises.length; }, 0);
  var first = file.workouts[0];

  var body = el('div', null, [
    el('p', { text: plural(file.workouts.length, 'workout') + ' and ' + exerciseCount + (exerciseCount === 1 ? ' exercise entry' : ' exercise entries') + ' (a set group with a different load is its own entry). The first workout:' }),
    el('div', { className: 'gl-preview' }, [
      el('div', { className: 'gl-title' }, [el('b', { text: first.label }), el('span', { className: 'dim', text: first.description ? '  ' + first.description : '' })])
    ].concat(first.exercises.map(function (o) {
      return el('div', { className: 'gl-line' }, [
        el('div', null, [el('b', { text: o.name }), el('span', { className: 'dim', text: '  ' + previewLine(o) })]),
        o.superset ? el('span', { className: 'ex-label', text: 'Superset ' + o.superset }) : el('span'),
        o.notes ? el('div', { className: 'gl-notes', text: o.notes }) : null
      ].filter(Boolean));
    })))
  ]);
  if (cannot.length > 0) {
    body.appendChild(el('div', { className: 'warn-text', text: (owner ? owner.name : 'The athlete') + " can't do: " + cannot.join(', ') + '.' }));
  }
  openModal({
    title: 'Export for GymLog',
    wide: true,
    body: body,
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', {
        className: 'primary', text: cannot.length > 0 ? 'Export anyway' : 'Download file',
        onclick: function () {
          closeModal();
          var name = gymlogFileName(program.name);
          downloadJson(name, file);
          showNotice('Saved as ' + name + '. In GymLog: Settings, Program Management, import it.');
        }
      })
    ]
  });
}

// The full prompt for the current program. split/join is used instead of replace so that
// characters like "$" in a program name are copied as they are.
function buildAiPrompt() {
  var text = AI_PROMPT_LINES.join('\n');
  text = text.split('[program name]').join(program.name);
  return text.split('[program JSON]').join(JSON.stringify(program, null, 2));
}

// How many set groups in included weeks have no load yet (the AI will suggest values for them).
function countBlankLoads() {
  var count = 0;
  program.workouts.forEach(function (w) {
    w.exercises.forEach(function (ex) {
      ex.weeks.forEach(function (entry) {
        if (!entry.included) return;
        entry.groups.forEach(function (g) { if (g.load === null) count++; });
      });
    });
  });
  return count;
}

// Shown when the browser does not allow copying: the prompt in a text box to copy by hand.
function showPromptBox(text) {
  var box = el('textarea', { className: 'prompt-box', readonly: 'readonly', 'aria-label': 'AI prompt' });
  box.value = text;
  openModal({
    title: 'Copy the prompt',
    wide: true,
    body: el('div', null, [
      el('p', { text: 'Your browser did not allow copying. Select all the text below and copy it yourself.' }),
      box
    ]),
    actions: [
      el('button', { text: 'Select all', onclick: function () { box.focus(); box.select(); } }),
      el('button', { className: 'primary', text: 'Close', onclick: closeModal })
    ]
  });
  box.focus();
  box.select();
}

function copyPromptNow() {
  var text = buildAiPrompt();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function () { showNotice('Prompt copied.'); },
      function () { showPromptBox(text); }
    );
  } else {
    showPromptBox(text);
  }
}

// Copy AI prompt (spec 5.14): needs at least one exercise, and asks first if some loads are blank.
function copyAiPrompt() {
  if (!programHasExercises(program)) {
    showNotice('Add an exercise first.');
    return;
  }
  var blank = countBlankLoads();
  if (blank > 0) {
    showConfirm({
      title: 'Copy AI prompt?',
      text: blank + (blank === 1 ? ' load is blank.' : ' loads are blank.') + ' The AI will suggest values for them.',
      confirmLabel: 'Copy prompt',
      primary: true,
      onConfirm: copyPromptNow
    });
  } else {
    copyPromptNow();
  }
}


function renderHeader() {

    program.name = nameInput.value;
    changedQuietly();
  });

  var isTemplate = !!openEntry && openEntry.kind === 'template';

  header.appendChild(nameInput);

  }));

    : el('button', { className: 'primary', text: 'Export for GymLog', onclick: exportForGymLog }));

// One block per set group, so every group is visible in the grid (see PROJECT_SUMMARY: this
// replaces the spec's "+N more").
// `label` (optional) is a superset label such as "A1", shown in front of the line.
function renderGroupLines(g, plan, label) {
  var load = describeLoad(g, plan);
  var line = el('div', { className: 'ex-group' });
  // The prescription (it may wrap inside its own column) and, to its right, the superset label.
  var rx = el('div', { className: 'ex-rx' });
  // sets × reps (with a rep range and RPE or RIR target) and the load, always starting at the left;
  // the set-type badge comes after them.
  rx.appendChild(el('span', { className: 'ex-scheme', text: setsRepsText(g) + targetText(g) }));
  rx.appendChild(el('span', { className: 'ex-load ' + load.cls, text: load.text }));
  if (g.setType) rx.appendChild(el('span', { className: 'set-badge' + (g.setType === 'top' ? ' strong' : ''), text: SET_TYPE_BADGES[g.setType] }));
  line.appendChild(rx);
  if (label) line.appendChild(el('span', { className: 'ex-label', text: label }));
  // Tempo and pause: a dim line of their own, only when used.
  var extra = tempoPauseText(g);
  if (extra) line.appendChild(el('span', { className: 'ex-sub', text: extra }));
  return line;
}

// A box in the grid for one exercise: its name, then one line per entry (set group) given.
// `entries` is a list of { k, label }; label is a superset label such as "A1" (or undefined).
function renderBox(ex, wi, weekIndex, entries) {
  var entry = ex.weeks[weekIndex];
  var top = el('div', { className: 'ex-top' });
  top.appendChild(el('span', { className: 'ex-name', text: ex.name }));
  if (entry.edited) top.appendChild(el('span', { className: 'ex-edited', text: '(edited)' }));

  var isSelected = selected !== null && selected.exId === ex.id;
  var choose = function () { selectExercise(wi, ex.id); };
  var box = el('div', {
    className: 'ex clickable' + (isSelected ? ' selected' : ''),
    role: 'button', tabindex: '0', onclick: choose
  }, [top]);
  entries.forEach(function (e) {
    var g = entry.groups[e.k];
    box.appendChild(renderGroupLines(g, plannedChange(ex.patterns[e.k], weekIndex, g, entry), e.label));
  });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); }
  });
  return box;
}

/* ==========================================================================
   SELECTION AND EXERCISE TABLE (spec 5.5)
   `selected` is only screen state (not saved): which exercise is highlighted.
   ========================================================================== */

var selected = null; // null, or { wi: workout index, exId: exercise id }

// Screen state of the panel, not saved: which set group is open (the others fold to one line), and
// which "sets × reps" cell of a later week was opened for typing ('setGroup:week', or null).
var panelOpenGroup = 0;
var panelOpenReps = null;

function selectExercise(wi, exId) {
  if (!selected || selected.exId !== exId) { panelOpenGroup = 0; panelOpenReps = null; }
  selected = { wi: wi, exId: exId };
  render();
}

function closeDetail() {
  selected = null;
  render();
}

// Finds the selected exercise, or null if it no longer exists.
function findSelected() {
  if (!selected) return null;
  var workout = program.workouts[selected.wi];
  if (!workout) return null;
  for (var i = 0; i < workout.exercises.length; i++) {
    if (workout.exercises[i].id === selected.exId) return { workout: workout, ex: workout.exercises[i] };
  }
  return null;
}

/* ---- Changes made from the table ---- */

// Does set group k have any load, target RPE or kg value in any week?
function groupHasLoadValues(ex, k) {
  return ex.weeks.some(function (w) {
    var g = w.groups[k];
    return !!g && (g.load !== null || g.rpe !== null || g.rir !== null || g.kg !== null);
  });
}

// Spec 5.8, per set group: that group takes the new type with a blank load, its target RPE and
// kg values are cleared, and its pattern resets to "Same every week".
// `replaceEdited` says what happens in weeks edited by hand: true changes them too (and a week
// stops being "edited" if it then matches the patterns); false leaves them exactly as they are.
function applyGroupLoadType(ex, k, type, replaceEdited) {
  ex.weeks.forEach(function (w, i) {
    var g = w.groups[k];
    if (!g || (i > 0 && w.edited && !replaceEdited)) return;
    g.loadType = type;
    g.load = null;
    g.rpe = null;
    g.rir = null;
    g.kg = null;
  });
  ex.patterns[k] = samePattern(type);
  if (replaceEdited) replaceEditedGroup(ex, k);
  changed();
}

// How many weeks edited by hand contain set group k.
function editedWeeksWithGroup(ex, k) {
  return ex.weeks.filter(function (w, i) { return i > 0 && w.edited && !!w.groups[k]; }).length;
}

function setGroupLoadType(ex, k, type) {
  if (ex.weeks[0].groups[k].loadType === type) return;
  if (!groupHasLoadValues(ex, k)) {
    applyGroupLoadType(ex, k, type, true);
    return;
  }
  var editedCount = editedWeeksWithGroup(ex, k);
  if (editedCount === 0) {
    showConfirm({
      title: 'Change load type?',
      text: 'All loads for this set group will be cleared.',
      confirmLabel: 'Change',
      onConfirm: function () { applyGroupLoadType(ex, k, type, true); }
    });
    return;
  }
  // Some weeks were edited by hand: ask whether they change too.
  var choice = 'keep';
  var radios = [['keep', 'Keep the edited weeks as they are'], ['replace', 'Clear the edited weeks too']].map(function (c) {
    var radio = el('input', { type: 'radio', name: 'type-edited-choice', value: c[0] });
    radio.checked = c[0] === choice;
    radio.addEventListener('change', function () { choice = c[0]; });
    return el('label', { className: 'opt' }, [radio, el('span', { text: c[1] })]);
  });
  openModal({
    title: 'Change load type?',
    body: el('div', null, [
      el('p', { text: 'All loads for this set group will be cleared.' }),
      el('p', { text: (editedCount === 1 ? '1 week was' : editedCount + ' weeks were') + ' edited by hand. What should happen to ' + (editedCount === 1 ? 'it?' : 'them?') })
    ].concat(radios)),
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', {
        className: 'danger', text: 'Change',
        onclick: function () { closeModal(); applyGroupLoadType(ex, k, type, choice === 'replace'); }
      })
    ]
  });
}

// The kg / % / RPE / RIR control for set group k.
function loadTypeControl(ex, k) {
  var current = ex.weeks[0].groups[k].loadType;
  var seg = el('div', { className: 'segmented', role: 'group', 'aria-label': 'Load type' });
  loadTypeChoices(current).forEach(function (o) {
    seg.appendChild(el('button', {
      text: o[1] === '% of 1RM' ? '%' : o[1],
      className: current === o[0] ? 'on' : '',
      'aria-pressed': current === o[0] ? 'true' : 'false',
      onclick: function () { setGroupLoadType(ex, k, o[0]); }
    }));
  });
  return seg;
}

// Rest belongs to each set group. Week 1 is the source, so change it there and let the
// weeks that are not edited follow. A superset pair shares one rest time (spec 5.10), so the
// partner's set group changes too (pairs only have one set group each).
function setGroupRest(workout, ex, k, seconds) {
  function apply(target, index) {
    target.weeks = withSourceFields(target, index, { rest: seconds }, program.weeks);
  }
  apply(ex, k);
  var id = ex.supersets[k];
  if (id) {
    pairMembers(workout, id).forEach(function (m) {
      if (m.ex !== ex) apply(m.ex, m.k);
    });
  }
  changed();
}

function confirmDeleteExercise(workout, ex) {
  showConfirm({
    title: 'Delete ' + ex.name + '?',
    text: 'It will be removed from every week.',
    confirmLabel: 'Delete',
    onConfirm: function () { deleteExercise(workout, ex); }
  });
}

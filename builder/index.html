// One block per set group, so every group is visible in the grid (see PROJECT_SUMMARY: this
// replaces the spec's "+N more").
// `label` (optional) is a superset label such as "A1", shown in front of the line.
function renderGroupLines(g, plan, label) {
  var load = describeLoad(g, plan);
  var line = el('div', { className: 'ex-group' });
  // The prescription (it may wrap inside its own column) and, to its right, the superset label.
  var rx = el('div', { className: 'ex-rx' });
  // sets × reps (with a rep range and RPE or RIR target) and the load, always starting at the left;
  // the set-type badge comes after them.
  rx.appendChild(el('span', { className: 'ex-scheme', text: setsRepsText(g) + targetText(g) }));
  rx.appendChild(el('span', { className: 'ex-load ' + load.cls, text: load.text }));
  if (g.setType) rx.appendChild(el('span', { className: 'set-badge' + (g.setType === 'top' ? ' strong' : ''), text: SET_TYPE_BADGES[g.setType] }));
  line.appendChild(rx);
  if (label) line.appendChild(el('span', { className: 'ex-label', text: label }));
  // Tempo and pause: a dim line of their own, only when used.
  var extra = tempoPauseText(g);
  if (extra) line.appendChild(el('span', { className: 'ex-sub', text: extra }));
  return line;
}

// A box in the grid for one exercise: its name, then one line per entry (set group) given.
// `entries` is a list of { k, label }; label is a superset label such as "A1" (or undefined).
function renderBox(ex, wi, weekIndex, entries) {
  var entry = ex.weeks[weekIndex];
  var top = el('div', { className: 'ex-top' });
  top.appendChild(el('span', { className: 'ex-name', text: ex.name }));
  if (entry.edited) top.appendChild(el('span', { className: 'ex-edited', text: '(edited)' }));

  var isSelected = selected !== null && selected.exId === ex.id;
  var choose = function () { selectExercise(wi, ex.id); };
  var box = el('div', {
    className: 'ex clickable' + (isSelected ? ' selected' : ''),
    role: 'button', tabindex: '0', onclick: choose
  }, [top]);
  entries.forEach(function (e) {
    var g = entry.groups[e.k];
    box.appendChild(renderGroupLines(g, plannedChange(ex.patterns[e.k], weekIndex, g, entry), e.label));
  });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); }
  });
  return box;
}

/* ==========================================================================
   SELECTION AND EXERCISE TABLE (spec 5.5)
   `selected` is only screen state (not saved): which exercise is highlighted.
   ========================================================================== */

var selected = null; // null, or { wi: workout index, exId: exercise id }

function selectExercise(wi, exId) {
  selected = { wi: wi, exId: exId };
  render();
}

function closeDetail() {
  selected = null;
  render();
}

// Finds the selected exercise, or null if it no longer exists.
function findSelected() {
  if (!selected) return null;
  var workout = program.workouts[selected.wi];
  if (!workout) return null;
  for (var i = 0; i < workout.exercises.length; i++) {
    if (workout.exercises[i].id === selected.exId) return { workout: workout, ex: workout.exercises[i] };
  }
  return null;
}

/* ---- Changes made from the table ---- */

// Does set group k have any load, target RPE or kg value in any week?
function groupHasLoadValues(ex, k) {
  return ex.weeks.some(function (w) {
    var g = w.groups[k];
    return !!g && (g.load !== null || g.rpe !== null || g.rir !== null || g.kg !== null);
  });
}

// Spec 5.8, per set group: that group takes the new type with a blank load, its target RPE and
// kg values are cleared, and its pattern resets to "Same every week".
// `replaceEdited` says what happens in weeks edited by hand: true changes them too (and a week
// stops being "edited" if it then matches the patterns); false leaves them exactly as they are.
function applyGroupLoadType(ex, k, type, replaceEdited) {
  ex.weeks.forEach(function (w, i) {
    var g = w.groups[k];
    if (!g || (i > 0 && w.edited && !replaceEdited)) return;
    g.loadType = type;
    g.load = null;
    g.rpe = null;
    g.rir = null;
    g.kg = null;
  });
  ex.patterns[k] = samePattern(type);
  if (replaceEdited) replaceEditedGroup(ex, k);
  changed();
}

// How many weeks edited by hand contain set group k.
function editedWeeksWithGroup(ex, k) {
  return ex.weeks.filter(function (w, i) { return i > 0 && w.edited && !!w.groups[k]; }).length;
}

// `after` (optional) runs once the change is done or cancelled; the pattern picker uses it to reopen.
function setGroupLoadType(ex, k, type, after) {
  if (ex.weeks[0].groups[k].loadType === type) return;
  if (!groupHasLoadValues(ex, k)) {
    applyGroupLoadType(ex, k, type, true);
    if (after) after();
    return;
  }
  var editedCount = editedWeeksWithGroup(ex, k);
  if (editedCount === 0) {
    showConfirm({
      title: 'Change load type?',
      text: 'All loads for this set group will be cleared.',
      confirmLabel: 'Change',
      onConfirm: function () { applyGroupLoadType(ex, k, type, true); if (after) after(); },
      onCancel: after
    });
    return;
  }
  // Some weeks were edited by hand: ask whether they change too.
  var choice = 'keep';
  var radios = [['keep', 'Keep the edited weeks as they are'], ['replace', 'Clear the edited weeks too']].map(function (c) {
    var radio = el('input', { type: 'radio', name: 'type-edited-choice', value: c[0] });
    radio.checked = c[0] === choice;
    radio.addEventListener('change', function () { choice = c[0]; });
    return el('label', { className: 'opt' }, [radio, el('span', { text: c[1] })]);
  });
  function cancel() { closeModal(); if (after) after(); }
  openModal({
    title: 'Change load type?',
    body: el('div', null, [
      el('p', { text: 'All loads for this set group will be cleared.' }),
      el('p', { text: (editedCount === 1 ? '1 week was' : editedCount + ' weeks were') + ' edited by hand. What should happen to ' + (editedCount === 1 ? 'it?' : 'them?') })
    ].concat(radios)),
    actions: [
      el('button', { text: 'Cancel', onclick: cancel }),
      el('button', {
        className: 'danger', text: 'Change',
        onclick: function () { closeModal(); applyGroupLoadType(ex, k, type, choice === 'replace'); if (after) after(); }
      })
    ]
  });
}

// The kg / % / RPE control for set group k. `after` is passed on to setGroupLoadType.
function loadTypeControl(ex, k, after) {
  var current = ex.weeks[0].groups[k].loadType;
  var seg = el('div', { className: 'segmented', role: 'group', 'aria-label': 'Load type' });
  LOAD_TYPE_OPTIONS.forEach(function (o) {
    seg.appendChild(el('button', {
      text: o[1] === '% of 1RM' ? '%' : o[1],
      className: current === o[0] ? 'on' : '',
      'aria-pressed': current === o[0] ? 'true' : 'false',
      onclick: function () { setGroupLoadType(ex, k, o[0], after); }
    }));
  });
  return seg;
}

// Rest belongs to each set group. Week 1 is the source, so change it there and let the
// weeks that are not edited follow. A superset pair shares one rest time (spec 5.10), so the
// partner's set group changes too (pairs only have one set group each).
function setGroupRest(workout, ex, k, seconds) {
  function apply(target, index) {
    target.weeks[0].groups[index].rest = seconds;
    target.weeks = generateWeeks(target, program.weeks);
  }
  apply(ex, k);
  var id = ex.supersets[k];
  if (id) {
    pairMembers(workout, id).forEach(function (m) {
      if (m.ex !== ex) apply(m.ex, m.k);
    });
  }
  changed();
}

function confirmDeleteExercise(workout, ex) {
  showConfirm({
    title: 'Delete ' + ex.name + '?',
    text: 'It will be removed from every week.',
    confirmLabel: 'Delete',
    onConfirm: function () { deleteExercise(workout, ex); }
  });
}

/* ==========================================================================
   PROGRESSION PATTERNS (spec 5.9)
   Each set group has its own pattern: ex.patterns[k] belongs to Week 1's set group k.
   ========================================================================== */

var CUSTOM_STEP = { kg: 1.25, pct: 0.5, rpe: 1 };    // size of the +/- buttons
var CUSTOM_LIMIT = { kg: 100, pct: 50, rpe: 10 };   // largest change per week, up or down
var PERCENT_STEP = 0.5;
var PERCENT_LIMIT = 50;

function signedNum(n) { return (n > 0 ? '+' : '') + formatNum(n); }

// Reads a number that may be negative, accepting "," or "." and "-" or the minus sign.
// Returns NaN if the text is not a number.
function parseSigned(text) {
  var t = String(text).trim().replace(',', '.').replace('−', '-');
  if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
  return Number(t);
}

// Which picker option a stored pattern corresponds to.
function patternOption(p) {
  if (p.kind === 'manual') return 'manual';
  if (p.kind === 'percent') return 'percent';
  if (p.kind === 'add') {
    if (p.type === 'rpe' && p.amount === 1) return 'rpe1';
    if (p.type === 'rir' && p.amount === -1) return 'rir1';
    return 'custom';
  }
  return 'same';
}

// The options that exist for a load type, in display order.
function patternOptionsFor(type) {
  var list = [{ key: 'same', label: 'Same every week', desc: '' }];
  if (type === 'rpe') {
    // RPE is subjective and tops out at 10, so it only offers a whole-number step.
    list.push({ key: 'rpe1', label: '+1 RPE per week', desc: '' });
  } else if (type === 'rir') {
    // RIR also only offers a whole-number step, and goes down as the weeks get harder (never below 0).
    list.push({ key: 'rir1', label: '−1 RIR per week', desc: '' });
  } else {
    list.push({ key: 'custom', label: 'Custom change per week', desc: '' });
    if (type === 'kg') {
      list.push({ key: 'percent', label: 'Percentage increase', desc: 'rounded to the nearest 2.5 kg' });
    }
  }
  list.push({ key: 'manual', label: 'Set each week manually', desc: '' });
  return list;
}

function patternText(p) {
  var u = UNIT_SUFFIX[p.type];
  switch (patternOption(p)) {
    case 'rpe1':
    case 'rir1':
    case 'custom': return signedNum(p.amount).replace('-', '−') + u + ' per week';
    case 'percent':
      return '+' + formatNum(p.amount) + '% per week (rounded '
        + ({ up: 'up to', down: 'down to' }[p.mode] || 'to the nearest') + ' ' + formatNum(p.step || 2.5) + ' kg)';
    case 'manual': return 'Set each week manually';
    default: return 'Same every week';
  }
}

// The "Repeat across weeks" picker for set group `k` of an exercise.
// All choices live in `state` until Apply, so Cancel changes nothing.
function openPatternPicker(wi, ex, k) {
  var group0 = ex.weeks[0].groups[k];
  var type = group0.loadType; // each set group has its own load type
  var weekCount = program.weeks;
  var editedCount = ex.weeks.slice(1).filter(function (w) { return w.edited; }).length;
  var oldPattern = ex.patterns[k];
  var reopen = function () { openPatternPicker(wi, ex, k); };

  var valid = patternOptionsFor(type).map(function (o) { return o.key; });
  var startOption = patternOption(oldPattern);
  var state = {
    option: valid.indexOf(startOption) >= 0 ? startOption : 'same',
    custom: startOption === 'custom' ? formatNum(oldPattern.amount) : (type === 'kg' ? '5' : '2.5'),
    percent: startOption === 'percent' ? formatNum(oldPattern.amount) : '5',
    roundStep: startOption === 'percent' && oldPattern.step ? formatNum(oldPattern.step) : '2.5',
    roundMode: startOption === 'percent' && oldPattern.mode ? oldPattern.mode : 'nearest',
    editedChoice: 'keep', // what to do with weeks edited by hand: 'keep' or 'replace'
    start: group0.load === null ? '' : formatNum(group0.load),
    manual: ex.weeks.map(function (w) {
      var g = w.groups[k];
      return g && g.load !== null ? formatNum(g.load) : '';
    })
  };

  function kindFor(opt) {
    if (opt === 'same' || opt === 'manual' || opt === 'percent') return opt;
    return 'add'; // custom, rpe1 and rir1
  }

  // The amount typed for the current option, or null if it is not a valid number.
  function amountFor(opt) {
    if (opt === 'rpe1') return 1;
    if (opt === 'rir1') return -1;
    if (opt === 'custom') {
      var c = parseSigned(state.custom);
      return (isNaN(c) || Math.abs(c) > CUSTOM_LIMIT[type]) ? null : c;
    }
    if (opt === 'percent') {
      var p = parseNumber(state.percent);
      return (p === null || isNaN(p) || p <= 0 || p > PERCENT_LIMIT) ? null : p;
    }
    return 0;
  }

  function amountError(opt) {
    if (opt === 'custom') return 'Change per week must be a number from -' + CUSTOM_LIMIT[type] + ' to ' + CUSTOM_LIMIT[type] + '.';
    return 'Percentage must be a number above 0, up to ' + PERCENT_LIMIT + '.';
  }

  // The rounding step in kg for a percentage increase, or null if not a valid number.
  function roundStepValue() {
    var s = parseNumber(state.roundStep);
    return (s === null || isNaN(s) || s <= 0 || s > 50) ? null : s;
  }

  // The whole pattern object for the current choices (the amount may be invalid: then 0).
  function buildPattern() {
    var amount = amountFor(state.option);
    var p = { kind: kindFor(state.option), type: type, amount: amount === null ? 0 : amount };
    if (state.option === 'percent') {
      p.step = roundStepValue() || 2.5;
      p.mode = state.roundMode;
    }
    return p;
  }

  // Loads of this set group in each week for the current choices. Uses a copy of the
  // exercise, so nothing real changes until Apply.
  function previewWeeks() {
    var clone = JSON.parse(JSON.stringify(ex));
    clone.patterns[k] = buildPattern();
    if (state.editedChoice === 'replace') clone.weeks.forEach(function (w) { w.edited = false; });
    var start = readLoad(state.start, type);
    clone.weeks[0].groups[k].load = start.error ? null : start.value;
    var weeks = generateWeeks(clone, weekCount);
    return weeks.map(function (w, idx) {
      var g = w.groups[k];
      return { group: g, edited: idx > 0 && w.edited, plan: plannedChange(clone.patterns[k], idx, g, w) };
    });
  }

  var typeBox = el('div', { className: 'form-row' });
  var optionsBox = el('div');
  var startInput = textInput(state.start, { inputmode: 'decimal', 'aria-label': 'Start value' });
  startInput.addEventListener('input', function () { state.start = startInput.value; drawPreview(); });
  var startRow = formRow('Start (Week 1, ' + LOAD_LABELS[type] + '), blank = set later', startInput);
  var previewBox = el('div', { className: 'preview' });
  var noteBox = el('div', { className: 'form-warning' });
  var choiceBox = el('div');
  var errorBox = el('div', { className: 'form-error', hidden: 'hidden' });

  function drawType() {
    typeBox.textContent = '';
    typeBox.appendChild(el('label', { text: 'Load type (this set group)' }));
    typeBox.appendChild(loadTypeControl(ex, k, reopen)); // asks first if loads would be cleared
  }

  function chooseOption(key) {
    if (key === 'manual' && state.option !== 'manual') {
      // Start the manual inputs from what the preview shows now.
      state.manual = previewWeeks().map(function (w) {
        return w.group.load === null ? '' : formatNum(w.group.load);
      });
    }
    state.option = key;
    drawOptions();
    drawChoice();
    drawPreview();
  }

  // A text box for the weekly change, with - and + buttons. Typing is allowed, so any
  // value can be entered; the buttons just nudge it.
  function amountControl(key, step, unit, allowNegative) {
    var input = textInput(state[key], { inputmode: 'decimal', 'aria-label': 'Change per week' });
    input.className = 'amount-input';
    input.addEventListener('input', function () { state[key] = input.value; drawPreview(); });
    function nudge(delta) {
      var current = parseSigned(input.value);
      if (isNaN(current)) current = 0;
      var next = cleanNum(current + delta);
      if (!allowNegative && next <= 0) return;
      var limit = key === 'custom' ? CUSTOM_LIMIT[type] : PERCENT_LIMIT;
      if (Math.abs(next) > limit) return;
      input.value = formatNum(next);
      state[key] = input.value;
      drawPreview();
    }
    return el('div', { className: 'custom-step' }, [
      el('button', { text: '−', 'aria-label': 'Decrease change per week', onclick: function () { nudge(-step); } }),
      input,
      el('button', { text: '+', 'aria-label': 'Increase change per week', onclick: function () { nudge(step); } }),
      el('span', { text: unit + ' per week' })
    ]);
  }

  // How a percentage increase is rounded: to which step (the plates available) and which way.
  function roundingControl() {
    var stepInput = textInput(state.roundStep, { inputmode: 'decimal', 'aria-label': 'Round to kg' });
    stepInput.className = 'amount-input';
    stepInput.addEventListener('input', function () { state.roundStep = stepInput.value; drawPreview(); });
    var modeSelect = selectBox([['nearest', 'to the nearest'], ['up', 'up to'], ['down', 'down to']], state.roundMode);
    modeSelect.setAttribute('aria-label', 'Rounding direction');
    modeSelect.className = 'mode-select';
    modeSelect.addEventListener('change', function () { state.roundMode = modeSelect.value; drawPreview(); });
    return el('div', { className: 'custom-step' }, [
      el('span', { text: 'Round' }), modeSelect, stepInput, el('span', { text: 'kg' })
    ]);
  }

  function drawOptions() {
    optionsBox.textContent = '';
    patternOptionsFor(type).forEach(function (o) {
      var radio = el('input', { type: 'radio', name: 'pattern-option', value: o.key });
      radio.checked = state.option === o.key;
      radio.addEventListener('change', function () { chooseOption(o.key); });
      optionsBox.appendChild(el('label', { className: 'opt' }, [
        radio,
        el('span', { className: 'opt-label', text: o.label }),
        el('span', { className: 'opt-desc', text: o.desc })
      ]));
      if (o.key === 'custom' && state.option === 'custom') {
        optionsBox.appendChild(amountControl('custom', CUSTOM_STEP[type], UNIT_SUFFIX[type], true));
      }
      if (o.key === 'percent' && state.option === 'percent') {
        optionsBox.appendChild(amountControl('percent', PERCENT_STEP, '%', false));
        optionsBox.appendChild(roundingControl());
      }
    });
  }

  function drawPreview() {
    previewBox.textContent = '';
    noteBox.textContent = '';
    if (state.option === 'manual') {
      var first = readLoad(state.start, type);
      var week1Text = (first.error || first.value === null)
        ? 'Set load'
        : describeLoad({ loadType: type, load: first.value, kg: null }).text;
      previewBox.appendChild(el('div', { className: 'pv' }, [
        el('span', { className: 'pv-week', text: 'Week 1' }),
        el('span', { className: 'pv-val', text: week1Text })
      ]));
      for (var i = 1; i < weekCount; i++) {
        (function (idx) {
          var input = textInput(state.manual[idx], { inputmode: 'decimal', 'aria-label': 'Load for Week ' + (idx + 1) });
          input.addEventListener('input', function () { state.manual[idx] = input.value; });
          previewBox.appendChild(el('div', { className: 'pv' }, [
            el('span', { className: 'pv-week', text: 'Week ' + (idx + 1) }), input
          ]));
        })(i);
      }
      if (ex.weeks[0].groups.length > 1) {
        noteBox.textContent = 'These weeks become edited, so later changes to the other set groups will not update them.';
      }
      return;
    }
    previewWeeks().forEach(function (w, idx) {
      var d = describeLoad({ loadType: w.group.loadType, load: w.group.load, kg: null }, w.plan);
      previewBox.appendChild(el('div', { className: 'pv' }, [
        el('span', { className: 'pv-week', text: 'Week ' + (idx + 1) }),
        el('span', { className: 'pv-val ' + d.cls, text: d.text }),
        el('span', { className: 'pv-tag', text: w.edited ? '(edited)' : '' })
      ]));
    });
    // RPE tops out at 10. Once a start value is given, say so if the pattern would pass it.
    if (type === 'rpe' && state.option === 'rpe1') {
      var startRpe = readLoad(state.start, type);
      if (!startRpe.error && startRpe.value !== null && startRpe.value + (weekCount - 1) > 10) {
        noteBox.textContent = 'RPE is capped at 10. Every week after it reaches 10 stays at 10.';
      }
    }
    // RIR cannot go below 0.
    if (type === 'rir' && state.option === 'rir1') {
      var startRir = readLoad(state.start, type);
      if (!startRir.error && startRir.value !== null && startRir.value - (weekCount - 1) < 0) {
        noteBox.textContent = 'RIR stops at 0. Every week after it reaches 0 stays at 0.';
      }
    }
  }

  // Weeks edited by hand: ask whether the new pattern should replace them or skip them.
  function drawChoice() {
    choiceBox.textContent = '';
    if (editedCount === 0 || state.option === 'manual') return;
    choiceBox.appendChild(el('div', {
      className: 'form-warning',
      text: editedCount === 1 ? '1 week was edited by hand.' : editedCount + ' weeks were edited by hand.'
    }));
    [['keep', 'Keep the edited weeks as they are'], ['replace', 'Replace the edited weeks with the new pattern']].forEach(function (c) {
      var radio = el('input', { type: 'radio', name: 'edited-choice', value: c[0] });
      radio.checked = state.editedChoice === c[0];
      radio.addEventListener('change', function () { state.editedChoice = c[0]; drawPreview(); });
      choiceBox.appendChild(el('label', { className: 'opt' }, [radio, el('span', { text: c[1] })]));
    });
  }

  function fail(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  function apply() {
    var start = readLoad(state.start, type);
    if (start.error) return fail('Start: ' + start.error);
    if (amountFor(state.option) === null) return fail(amountError(state.option));
    if (state.option === 'percent' && roundStepValue() === null) return fail('Rounding step must be a number above 0, up to 50.');
    var manualLoads = null;
    if (state.option === 'manual') {
      manualLoads = [];
      for (var i = 1; i < weekCount; i++) {
        var r = readLoad(state.manual[i], type);
        if (r.error) return fail('Week ' + (i + 1) + ': ' + r.error);
        manualLoads.push(r.value);
      }
    }
    closeModal();

    ex.patterns[k] = buildPattern();
    if (start.value !== group0.load) {
      group0.load = start.value;
      group0.kg = null; // a changed load clears its kg value
    }
    if (!manualLoads && state.editedChoice === 'replace') replaceEditedGroup(ex, k);
    if (manualLoads) {
      manualLoads.forEach(function (load, idx) {
        var entry = ex.weeks[idx + 1];
        var g = entry.groups[k];
        if (g && g.loadType === type && g.load !== load) { g.load = load; g.kg = null; }
        entry.edited = true;
      });
    } else {
      ex.weeks = generateWeeks(ex, weekCount);
    }
    changed();
  }

  var groupLabel = ex.weeks[0].groups.length > 1
    ? ' · Set group ' + (k + 1) + ' (' + setsRepsText(group0) + ')'
    : '';
  var body = el('div', null, [
    el('div', { className: 'sub', text: ex.name + ' · Workout ' + (wi + 1) + groupLabel }),
    typeBox,
    el('div', { className: 'form-row' }, [optionsBox]),
    startRow,
    el('label', { className: 'pv-title', text: 'Preview' }),
    previewBox,
    noteBox,
    choiceBox,
    errorBox
  ]);
  drawType();
  drawOptions();
  drawChoice();
  drawPreview();

  openModal({
    title: 'Repeat across weeks',
    wide: true,
    body: body,
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Apply', onclick: apply })
    ]
  });
}


/* ==========================================================================
   SUPERSETS AND REORDERING (spec 5.10)
   A superset pairs ONE SET GROUP of an exercise with one set group of another exercise in the
   same workout. The two groups have the same number of sets (one set of each per round).
   Exercise.supersets[k] holds a pair id for Week 1's set group k, or null.
   ========================================================================== */

function canMove(workout, ex, direction) {
  var target = workout.exercises.indexOf(ex) + direction;
  return target >= 0 && target < workout.exercises.length;
}

// Moves one exercise up or down. Paired set groups do not need to sit next to each other here;
// the AI places each pair side by side in the import file.
function moveExercise(workout, ex, direction) {
  if (!canMove(workout, ex, direction)) return;
  var from = workout.exercises.indexOf(ex);
  workout.exercises.splice(from, 1);
  workout.exercises.splice(from + direction, 0, ex);
  changed();
}

// Splits set group k into two groups in every week: the first keeps `firstSets` sets, the second
// gets the rest, with the same reps, load, rest and pattern. Used when the two groups to pair
// have different numbers of sets (e.g. Curls 6 sets -> 3 + 3).
function splitGroup(ex, k, firstSets) {
  ex.weeks.forEach(function (w) {
    var g = w.groups[k];
    if (!g) return;
    var copy = cloneGroup(g);
    if (g.sets > firstSets) {
      copy.sets = g.sets - firstSets;
      g.sets = firstSets;
    } else {
      copy.sets = 1; // only in an odd edited week that has fewer sets than Week 1
    }
    w.groups.splice(k + 1, 0, copy);
  });
  ex.patterns.splice(k + 1, 0, JSON.parse(JSON.stringify(ex.patterns[k])));
  ex.supersets.splice(k + 1, 0, null);
}

// Set groups of other exercises in the workout that are not paired yet: [{ ex, k }].
function freeGroupsOf(workout, ex) {
  var list = [];
  workout.exercises.forEach(function (o) {
    if (o === ex) return;
    o.supersets.forEach(function (s, k) { if (s === null) list.push({ ex: o, k: k }); });
  });
  return list;
}

// Pairs set group a.k of a.ex with b.k of b.ex. If their set counts differ, the larger group is
// split first. The later exercise in the workout adopts the earlier one's rest.
function pairGroups(workout, a, b) {
  var ga = a.ex.weeks[0].groups[a.k];
  var gb = b.ex.weeks[0].groups[b.k];
  if (ga.sets > gb.sets) splitGroup(a.ex, a.k, gb.sets);
  else if (gb.sets > ga.sets) splitGroup(b.ex, b.k, ga.sets);

  var id = makeId('ss');
  a.ex.supersets[a.k] = id;
  b.ex.supersets[b.k] = id;

  var aFirst = workout.exercises.indexOf(a.ex) < workout.exercises.indexOf(b.ex);
  var source = aFirst ? a : b;
  var target = aFirst ? b : a;
  target.ex.weeks[0].groups[target.k].rest = source.ex.weeks[0].groups[source.k].rest;
  target.ex.weeks = generateWeeks(target.ex, program.weeks);
  changed();
}

// Clears the pair of set group k; both exercises stay.
function unpairGroup(workout, ex, k) {
  var id = ex.supersets[k]; // read it first: clearing changes what we compare against
  pairMembers(workout, id).forEach(function (m) { m.ex.supersets[m.k] = null; });
  changed();
}

// After a week is edited, the partner of each paired set group gets the same sets and rest in
// that week (pairs always match). A later week that has to change is marked edited.
function syncPairs(workout, ex, weekIndex) {
  var regenerate = [];
  ex.supersets.forEach(function (id, k) {
    if (!id) return;
    var src = ex.weeks[weekIndex].groups[k];
    if (!src) return;
    pairMembers(workout, id).forEach(function (m) {
      if (m.ex === ex) return;
      var entry = m.ex.weeks[weekIndex];
      var dst = entry.groups[m.k];
      if (!dst || (dst.sets === src.sets && dst.rest === src.rest)) return;
      dst.sets = src.sets;
      dst.rest = src.rest;
      if (weekIndex === 0) { if (regenerate.indexOf(m.ex) < 0) regenerate.push(m.ex); }
      else entry.edited = true;
    });
  });
  regenerate.forEach(function (o) { o.weeks = generateWeeks(o, program.weeks); });
}

// "Superset with..." dialog for set group k of `ex`.
function openSupersetPicker(wi, ex, k) {
  var workout = program.workouts[wi];
  var free = freeGroupsOf(workout, ex);
  var mine = ex.weeks[0].groups[k];

  if (free.length === 0) {
    openModal({
      title: 'Superset',
      body: el('p', { text: 'No other exercise in this workout has a set group that is free to pair. Add another exercise first.' }),
      actions: [el('button', { text: 'Close', onclick: closeModal })]
    });
    return;
  }

  // Exercises that still have a free set group, nearest below first.
  var partners = [];
  free.forEach(function (f) { if (partners.indexOf(f.ex) < 0) partners.push(f.ex); });
  var myIndex = workout.exercises.indexOf(ex);
  var below = partners.filter(function (p) { return workout.exercises.indexOf(p) > myIndex; });
  var above = partners.filter(function (p) { return workout.exercises.indexOf(p) < myIndex; });
  var ordered = below.concat(above);

  var state = { partner: ordered[0], group: null };
  var partnerSelect = selectBox(ordered.map(function (p, i) { return [String(i), p.name]; }), '0');
  var groupsBox = el('div');
  var infoBox = el('div', { className: 'form-warning' });
  var confirmBtn = el('button', { className: 'primary', text: 'Superset' });

  function chooseDefaultGroup() {
    var options = free.filter(function (f) { return f.ex === state.partner; });
    var sameSets = options.filter(function (f) { return f.ex.weeks[0].groups[f.k].sets === mine.sets; });
    state.group = (sameSets[0] || options[0]).k;
  }

  function drawGroups() {
    groupsBox.textContent = '';
    free.filter(function (f) { return f.ex === state.partner; }).forEach(function (f) {
      var g = f.ex.weeks[0].groups[f.k];
      var radio = el('input', { type: 'radio', name: 'superset-group', value: String(f.k) });
      radio.checked = state.group === f.k;
      radio.addEventListener('change', function () { state.group = f.k; drawInfo(); });
      groupsBox.appendChild(el('label', { className: 'opt' }, [
        radio,
        el('span', { className: 'opt-label', text: 'Set group ' + (f.k + 1) + ': ' + setsRepsText(g) }),
        el('span', { className: 'opt-desc', text: describeLoad(g).text })
      ]));
    });
  }

  function drawInfo() {
    var theirs = state.partner.weeks[0].groups[state.group];
    var text;
    if (mine.sets === theirs.sets) {
      text = 'Pairs ' + mine.sets + (mine.sets === 1 ? ' set' : ' sets') + ' of each.';
    } else if (mine.sets > theirs.sets) {
      text = ex.name + ' set group ' + (k + 1) + ' has ' + mine.sets + ' sets. It will be split into '
        + theirs.sets + ' + ' + (mine.sets - theirs.sets) + ', and the first ' + theirs.sets + ' pair with ' + state.partner.name + '.';
    } else {
      text = state.partner.name + ' set group ' + (state.group + 1) + ' has ' + theirs.sets + ' sets. It will be split into '
        + mine.sets + ' + ' + (theirs.sets - mine.sets) + ', and the first ' + mine.sets + ' pair with ' + ex.name + '.';
    }
    infoBox.textContent = text;
    confirmBtn.textContent = mine.sets === theirs.sets ? 'Superset' : 'Split and superset';
  }

  partnerSelect.addEventListener('change', function () {
    state.partner = ordered[Number(partnerSelect.value)];
    chooseDefaultGroup();
    drawGroups();
    drawInfo();
  });
  confirmBtn.addEventListener('click', function () {
    closeModal();
    pairGroups(workout, { ex: ex, k: k }, { ex: state.partner, k: state.group });
  });

  chooseDefaultGroup();
  drawGroups();
  drawInfo();
  openModal({
    title: 'Superset',
    body: el('div', null, [
      el('div', { className: 'sub', text: ex.name + ' · set group ' + (k + 1) + ' (' + setsRepsText(mine) + ')' }),
      formRow('Superset with', partnerSelect),
      el('label', { className: 'pv-title', text: 'Which set group?' }),
      groupsBox,
      infoBox
    ]),
    actions: [el('button', { text: 'Cancel', onclick: closeModal }), confirmBtn]
  });
}

/* ==========================================================================
   EXERCISE SETTINGS PANEL
   Docked to the right of the grid. It shows the settings of the selected exercise: one section per
   set group (load type, rest, progression, superset), a small Weeks strip, notes, and the actions
   (add set group, move, delete). Clicking a value in the Weeks strip edits that week. The cross
   closes the panel; clicking any exercise in the grid opens it again.
   ========================================================================== */

// A labelled row in the panel: label on the left, a control on the right.
function panelRow(labelText, children) {
  return el('div', { className: 'pr' }, [el('label', { text: labelText })].concat(children));
}

function restRow(workout, ex, r) {
  var g = ex.weeks[0].groups[r];
  var input = textInput(formatNum(g.rest / 60), { inputmode: 'decimal', 'aria-label': 'Rest in minutes, set group ' + (r + 1) });
  input.className = 'rest-input';
  input.addEventListener('change', function () {
    var min = parseNumber(input.value);
    if (min === null || isNaN(min) || min > 60) {
      input.value = formatNum(g.rest / 60); // invalid: put the old value back
      return;
    }
    setGroupRest(workout, ex, r, Math.round(min * 60));
  });
  return panelRow('Rest', [input, el('span', { className: 'unit', text: 'min' })]);
}

// Who set group r is paired with and a Remove link, or a "Superset with…" link.
function supersetRow(workout, wi, ex, r) {
  var id = ex.supersets[r];
  var partner = null;
  if (id) pairMembers(workout, id).forEach(function (m) { if (m.ex !== ex) partner = m; });
  if (partner) {
    var pg = partner.ex.weeks[0].groups[partner.k];
    var many = partner.ex.weeks[0].groups.length > 1;
    return panelRow('Superset', [
      el('span', { text: 'With ' + partner.ex.name + (many ? ' (group ' + (partner.k + 1) + ')' : '') + ', ' + setsRepsText(pg) }),
      el('button', { className: 'link-btn', text: 'Remove', onclick: function () { unpairGroup(workout, ex, r); } })
    ]);
  }
  var none = freeGroupsOf(workout, ex).length === 0;
  var btn = el('button', {
    className: 'link-btn acc', text: 'Superset with… ▸',
    title: none ? 'No other exercise in this workout has a free set group' : 'Pair this set group with a set group of another exercise',
    onclick: function () { openSupersetPicker(wi, ex, r); }
  });
  if (none) btn.disabled = true;
  return panelRow('Superset', [btn]);
}

// Changes fields of set group k in Week 1 (the source) and lets the weeks that are not edited follow.
function setGroupFields(ex, k, changes) {
  var g = ex.weeks[0].groups[k];
  Object.keys(changes).forEach(function (key) { g[key] = changes[key]; });
  ex.weeks = generateWeeks(ex, program.weeks);
  changed();
}

// Which effort target (RPE or RIR) the panel shows for a set group while its number is blank.
var targetModeMemory = {};

// The effort target: an RPE | RIR switch and a number. Not shown when the group's load is an RPE.
function targetRow(ex, r) {
  var g = ex.weeks[0].groups[r];
  if (!hasEffortTarget(g.loadType, g.rpe !== null || g.rir !== null)) return null;
  var key = ex.id + ':' + r;
  var mode = g.rir !== null ? 'rir' : (g.rpe !== null ? 'rpe' : (targetModeMemory[key] || 'rpe'));
  var seg = el('div', { className: 'segmented' }, ['rpe', 'rir'].map(function (m) {
    return el('button', {
      className: m === mode ? 'on' : null, text: m.toUpperCase(),
      onclick: function () {
        if (m === mode) return;
        targetModeMemory[key] = m;
        setGroupFields(ex, r, { rpe: null, rir: null });   // the number is not carried over: RPE 8 is not RIR 8
      }
    });
  }));
  var value = mode === 'rir' ? g.rir : g.rpe;
  var input = textInput(value === null ? '' : formatNum(value), { inputmode: 'decimal', 'aria-label': 'Target ' + mode.toUpperCase() + ', set group ' + (r + 1), placeholder: '–' });
  input.addEventListener('change', function () {
    var target = readEffortTarget(input.value, mode.toUpperCase());
    if (target.error) { showNotice(target.error); input.value = value === null ? '' : formatNum(value); return; }
    setGroupFields(ex, r, mode === 'rir' ? { rir: target.value, rpe: null } : { rpe: target.value, rir: null });
  });
  return panelRow('Target', [el('div', { className: 'tgt' }, [seg, input])]);
}

function setTypeRow(ex, r) {
  var g = ex.weeks[0].groups[r];
  var select = selectBox([['', 'None']].concat(SET_TYPES.map(function (t) { return [t, SET_TYPE_LABELS[t]]; })), g.setType || '');
  select.setAttribute('aria-label', 'Set type, set group ' + (r + 1));
  select.addEventListener('change', function () { setGroupFields(ex, r, { setType: select.value === '' ? null : select.value }); });
  return panelRow('Set type', [select]);
}

function tempoRow(ex, r) {
  var g = ex.weeks[0].groups[r];
  var input = textInput(g.tempo || '', { maxlength: '12', placeholder: '3-1-1-0', 'aria-label': 'Tempo, set group ' + (r + 1) });
  input.className = 'tempo-input';
  input.addEventListener('change', function () {
    var text = input.value.trim();
    if (text.length > 12) { showNotice('Tempo can have at most 12 characters.'); input.value = g.tempo || ''; return; }
    setGroupFields(ex, r, { tempo: text === '' ? null : text });
  });
  return panelRow('Tempo', [input]);
}

function pauseRow(ex, r) {
  var g = ex.weeks[0].groups[r];
  var input = textInput(g.pause === null ? '' : String(g.pause), { inputmode: 'numeric', placeholder: '–', 'aria-label': 'Pause in seconds, set group ' + (r + 1) });
  input.className = 'rest-input';
  input.addEventListener('change', function () {
    var text = input.value.trim();
    var n = text === '' ? null : parseWhole(text, 0, 30);
    if (n !== null && isNaN(n)) { showNotice('Pause must be a whole number of seconds from 0 to 30.'); input.value = g.pause === null ? '' : String(g.pause); return; }
    setGroupFields(ex, r, { pause: n });
  });
  return panelRow('Pause', [input, el('span', { className: 'unit', text: 's' })]);
}

function renderSetGroupSection(workout, wi, ex, r) {
  var g = ex.weeks[0].groups[r];
  return el('div', { className: 'ps' }, [
    el('div', { className: 'ps-head' }, [
      el('b', { text: 'Set group ' + (r + 1) + ' · ' + setsRepsText(g) }),
      el('button', {
        className: 'link-btn', text: 'Edit', title: 'Edit sets, reps, rep range and load in Week 1',
        onclick: function () { openWeekEditor(wi, ex, 0); }
      })
    ]),
    panelRow('Load type', [loadTypeControl(ex, r)]),
    targetRow(ex, r),
    restRow(workout, ex, r),
    setTypeRow(ex, r),
    tempoRow(ex, r),
    pauseRow(ex, r),
    panelRow('Progression', [el('button', {
      className: 'link-btn acc', title: 'Change how this set group repeats across weeks',
      text: patternText(ex.patterns[r]) + ' ▸',
      onclick: function () { openPatternPicker(wi, ex, r); }
    })]),
    supersetRow(workout, wi, ex, r)
  ].filter(Boolean));
}

// One row per week, one column per set group. Click a value to edit that week. A dashed underline
// marks a week edited by hand.
function renderWeeksStrip(wi, ex) {
  var most = 0;
  ex.weeks.forEach(function (w) { if (w.included && w.groups.length > most) most = w.groups.length; });
  if (most === 0) most = ex.weeks[0].groups.length;
  var head = el('tr', null, [el('th')]);
  for (var k = 0; k < most; k++) head.appendChild(el('th', { text: most > 1 ? 'Group ' + (k + 1) : 'Load' }));
  var rows = [el('thead', null, [head])];
  var body = el('tbody');
  ex.weeks.forEach(function (entry, w) {
    var row = el('tr', null, [el('td', { className: 'k', text: 'W' + (w + 1) })]);
    if (!entry.included) {
      row.appendChild(el('td', { colspan: String(most), className: 'k' }, [
        el('button', { className: 'link-btn acc', text: 'Add', title: 'Add this exercise to Week ' + (w + 1), onclick: function () { addToWeek(ex, w); } })
      ]));
    } else {
      for (var g = 0; g < most; g++) {
        var grp = entry.groups[g];
        var td;
        if (!grp) {
          td = el('td', { className: 'k', text: '—' });
        } else {
          var first = ex.weeks[0].groups[g];
          var load = describeLoad(grp, plannedChange(ex.patterns[g] || samePattern(grp.loadType), w, grp, entry));
          var text = load.text;
          if (first && setsRepsText(first) !== setsRepsText(grp)) text = setsRepsText(grp) + ' · ' + text;
          td = el('td', {
            className: 'v' + (load.cls === 'load-blank' ? ' blank' : '') + (entry.edited ? ' edited' : ''),
            role: 'button', tabindex: '0', text: text, 'aria-label': 'Edit ' + ex.name + ' in Week ' + (w + 1)
          });
          (function (weekIndex) {
            td.addEventListener('click', function () { openWeekEditor(wi, ex, weekIndex); });
            td.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openWeekEditor(wi, ex, weekIndex); }
            });
          })(w);
        }
        row.appendChild(td);
      }
    }
    body.appendChild(row);
  });
  rows.push(body);
  return el('div', { className: 'ps' }, [
    el('div', { className: 'ps-head' }, [
      el('b', { text: 'Weeks' }),
      el('span', { className: 'hint', text: 'Click a value to edit that week' })
    ]),
    el('table', { className: 'prog' }, rows),
    el('div', { className: 'hint', text: 'Dashed underline = edited by hand.' })
  ]);
}

function renderDetail() {
  var box = document.getElementById('detail');
  var scrollTop = box.scrollTop;
  var found = findSelected();
  if (!found) {
    selected = null;
    box.hidden = true;
    box.textContent = '';
    return;
  }
  var wi = selected.wi;
  var workout = found.workout;
  var ex = found.ex;
  box.hidden = false;
  box.textContent = '';

  box.appendChild(el('div', { className: 'ph' }, [
    el('div', { className: 't' }, [
      el('b', { text: ex.name }),
      el('span', { text: 'Workout ' + (wi + 1) + (workout.description ? ' · ' + workout.description : '') })
    ]),
    el('button', { className: 'x', text: '×', title: 'Close', 'aria-label': 'Close the exercise settings', onclick: closeDetail })
  ]));

  ex.weeks[0].groups.forEach(function (g, r) { box.appendChild(renderSetGroupSection(workout, wi, ex, r)); });
  box.appendChild(renderWeeksStrip(wi, ex));

  var notes = el('textarea', { maxlength: '500', 'aria-label': 'Notes for ' + ex.name, placeholder: 'Notes for this exercise' });
  notes.value = ex.notes;
  notes.addEventListener('input', function () {
    ex.notes = notes.value;
    changedQuietly();
  });
  box.appendChild(el('div', { className: 'ps' }, [el('div', { className: 'ps-head' }, [el('b', { text: 'Notes' })]), notes]));

  var up = el('button', { className: 'link-btn', text: 'Move up', onclick: function () { moveExercise(workout, ex, -1); } });
  var down = el('button', { className: 'link-btn', text: 'Move down', onclick: function () { moveExercise(workout, ex, 1); } });
  if (!canMove(workout, ex, -1)) { up.disabled = true; up.title = 'Already first'; }
  if (!canMove(workout, ex, 1)) { down.disabled = true; down.title = 'Already last'; }
  box.appendChild(el('div', { className: 'panel-acts' }, [
    el('button', {
      className: 'link-btn acc', text: '+ Add set group', title: 'Add another set group to this exercise',
      onclick: function () { openWeekEditor(wi, ex, 0, true); }
    }),
    up, down,
    el('button', { className: 'link-btn danger-link', text: 'Delete exercise', onclick: function () { confirmDeleteExercise(workout, ex); } })
  ]));

// A workout is "removed" from a week when it has exercises but none are included in that week.
function workoutRemovedInWeek(workout, weekIndex) {
  return workout.exercises.length > 0 && workout.exercises.every(function (ex) { return !ex.weeks[weekIndex].included; });
}

// The rows of one workout in the grid. They are the same in every week, so exercises line up across
// the weeks: a week with an extra set group (or without an exercise) leaves a gap in the other weeks
// instead of pushing everything below it out of line. A slot is one exercise's run of set groups, or
// two set groups paired in a superset (the partner follows straight after, as in GymLog).
// Returns [{ type: 'run', ex, ks: [set group numbers] } | { type: 'pair', members: [{ ex, k }, { ex, k }] }].
function workoutSlots(workout) {
  var slots = [];
  var placed = {};
  workout.exercises.forEach(function (ex) {
    var most = 0;
    ex.weeks.forEach(function (w) { if (w.groups.length > most) most = w.groups.length; });
    var run = null;
    for (var k = 0; k < most; k++) {
      if (placed[ex.id + ':' + k]) continue;
      var id = ex.supersets[k];
      var members = id ? pairMembers(workout, id) : [];
      if (members.length === 2) {
        placed[members[0].ex.id + ':' + members[0].k] = true;
        placed[members[1].ex.id + ':' + members[1].k] = true;
        slots.push({ type: 'pair', members: members });
        run = null;
      } else {
        if (!run) { run = { type: 'run', ex: ex, ks: [] }; slots.push(run); }
        run.ks.push(k);
      }
    }
  });
  return slots;
}

// The flag control at the right of a week heading: a grey flag icon. Clicking it opens a small menu
// (None, Deload, Test, Competition). A flagged week shows its flag name and icon in the flag's colour.
function weekFlagButton(week) {
  var current = program.weekFlags[week];
  var label = current ? WEEK_FLAG_LABELS[current] : 'None';
  // A flagged week shows just its name (in the flag's colour); the grey flag icon is only for unflagged weeks.
  var children = [current
    ? el('span', { className: 'flag-name', text: label })
    : el('span', { className: 'flag-ico', text: '⚑' })];
  var btn = el('button', {
    className: 'flag-btn' + (current ? ' flag-' + current : ''),
    title: 'Flag this week (now: ' + label + ')', 'aria-label': 'Flag for Week ' + (week + 1) + ': ' + label,
    'aria-haspopup': 'menu'
  }, children);
  btn.addEventListener('click', function () { openFlagMenu(btn, week); });
  return btn;
}

var flagMenuCleanup = null;

function closeFlagMenu() {
  var menu = document.getElementById('flag-menu');
  if (menu) menu.remove();
  if (flagMenuCleanup) { flagMenuCleanup(); flagMenuCleanup = null; }
}

function openFlagMenu(anchor, week) {
  closeFlagMenu();
  var current = program.weekFlags[week];
  var items = [[null, 'None']].concat(WEEK_FLAGS.map(function (f) { return [f, WEEK_FLAG_LABELS[f]]; }));
  var menu = el('div', { id: 'flag-menu', className: 'flag-menu', role: 'menu' }, items.map(function (item) {
    return el('button', {
      className: 'flag-item' + (item[0] ? ' flag-' + item[0] : '') + (item[0] === current ? ' on' : ''),
      role: 'menuitem', text: item[1],
      onclick: function () { closeFlagMenu(); program.weekFlags[week] = item[0]; changed(); }
    });
  }));
  document.body.appendChild(menu);
  var box = anchor.getBoundingClientRect();
  menu.style.top = (box.bottom + 4) + 'px';
  menu.style.left = Math.max(8, box.right - menu.offsetWidth) + 'px';   // right edge under the icon
  function onDown(e) { if (!menu.contains(e.target) && !anchor.contains(e.target)) closeFlagMenu(); }
  function onKey(e) { if (e.key === 'Escape') closeFlagMenu(); }
  document.addEventListener('mousedown', onDown, true);
  document.addEventListener('keydown', onKey);
  flagMenuCleanup = function () {
    document.removeEventListener('mousedown', onDown, true);
    document.removeEventListener('keydown', onKey);
  };
}

// One cell of the grid: what one slot looks like in one week. It is left blank where the exercise
// is not in that week (or has fewer set groups); clicking a blank cell still selects the exercise,
// so its settings panel can add it back.
function renderSlotCell(workout, wi, week, slot, isFirstWeek) {
  var td = el('td', { className: 'cell' + (isFirstWeek ? ' c0' : '') });
  var labels = supersetLabels(workout, week);
  function boxFor(ex, ks) {
    var entry = ex.weeks[week];
    if (!entry.included) return null;
    var entries = ks.filter(function (k) { return !!entry.groups[k]; }).map(function (k) {
      return { k: k, label: labels[ex.id + ':' + k] };
    });
    return entries.length > 0 ? renderBox(ex, wi, week, entries) : null;
  }
  if (slot.type === 'run') {
    var box = boxFor(slot.ex, slot.ks);
    if (box) td.appendChild(box);
    else td.addEventListener('click', function () { selectExercise(wi, slot.ex.id); });
    if (selected !== null && selected.exId === slot.ex.id) td.className += ' sel';
    return td;
  }
  var a = boxFor(slot.members[0].ex, [slot.members[0].k]);
  var b = boxFor(slot.members[1].ex, [slot.members[1].k]);
  var active = labels[slot.members[0].ex.id + ':' + slot.members[0].k] !== undefined;
  if (active) {
    td.appendChild(el('div', { className: 'ss-block' }, [a, b]));   // both are there: one frame
  } else {
    if (a) td.appendChild(a);
    if (b) td.appendChild(b);
  }
  return td;
}

// The foot of a workout in one week: add an exercise, or remove the whole workout from the week.
function renderFootCell(workout, wi, week) {
  var foot = [el('button', {
    className: 'link-btn', text: 'Add exercise',
    onclick: function () { openAddExerciseModal(wi, week); }
  })];
  if (workout.exercises.length > 0) {
    foot.push(el('button', {
      className: 'link-btn', text: 'Remove from week',
      onclick: function () { confirmRemoveWorkoutFromWeek(workout, wi, week); }
    }));
  }
  return el('td', { className: 'cell' + (week === 0 ? ' c0' : '') }, [el('div', { className: 'cell-foot' }, foot)]);
}

function renderGrid() {
  var grid = document.getElementById('grid');
  grid.textContent = '';

  var headRow = el('tr');
  for (var w = 0; w < program.weeks; w++) {
    headRow.appendChild(el('th', { className: 'week-col' }, [
      el('div', { className: 'th-in' }, [el('span', { text: 'Week ' + (w + 1) }), weekFlagButton(w)])
    ]));
  }

  var body = el('tbody');
  program.workouts.forEach(function (workout, wi) {
    var descInput = el('input', {
      type: 'text', className: 'workout-desc', placeholder: 'Add a description',
      'aria-label': 'Description for Workout ' + (wi + 1), maxlength: '500'
    });
    descInput.value = workout.description;
    descInput.addEventListener('input', function () {
      workout.description = descInput.value;
      changedQuietly();
    });

    // One full-width band per workout: title and description, with the exercises under it.
    body.appendChild(el('tr', { className: 'band-row' }, [
      el('td', { colspan: String(program.weeks) }, [
        el('div', { className: 'band' }, [
          el('span', { className: 't', text: 'Workout ' + (wi + 1) }),
          descInput
        ])
      ])
    ]));

    var slots = workoutSlots(workout);
    var removed = [];
    for (var week = 0; week < program.weeks; week++) removed.push(workoutRemovedInWeek(workout, week));

    slots.forEach(function (slot, i) {
      var row = el('tr', { className: 'slot' + (i === 0 ? ' first' : '') });
      for (var wk = 0; wk < program.weeks; wk++) {
        if (removed[wk]) {
          // A workout removed from this week is one tall cell down the whole workout.
          if (i === 0) {
            var gone = el('td', { className: 'cell' + (wk === 0 ? ' c0' : ''), rowspan: String(slots.length + 1) }, [
              el('div', { className: 'gone' }, [
                el('span', { text: 'No workout this week' }),
                el('button', { className: 'link-btn', text: 'Restore', onclick: (function (x) { return function () { restoreWorkoutInWeek(workout, x); }; })(wk) })
              ])
            ]);
            row.appendChild(gone);
          }
          continue;
        }
        row.appendChild(renderSlotCell(workout, wi, wk, slot, wk === 0));
      }
      body.appendChild(row);
    });

    var footRow = el('tr', { className: 'foot-row' });
    for (var fw = 0; fw < program.weeks; fw++) {
      if (!removed[fw]) footRow.appendChild(renderFootCell(workout, wi, fw));
    }
    body.appendChild(footRow);
  });

  grid.appendChild(el('table', { className: 'grid', style: '--n:' + program.weeks }, [el('thead', null, [headRow]), body]));
}

function render() {
  var header = document.getElementById('header');
  var workspace = document.getElementById('workspace');
  var lib = document.getElementById('library');
  var profileBox = document.getElementById('profile');
  document.getElementById('save-warning').hidden = draftSaved;
  if (profileOpenId !== null && findProfile(profileOpenId)) {
    header.hidden = true;
    workspace.hidden = true;
    lib.hidden = true;
    profileBox.hidden = false;
    renderProfile();
    return;
  }
  profileOpenId = null;
  profileBox.hidden = true;
  if (libraryOpen) {
    header.hidden = true;
    workspace.hidden = true;
    lib.hidden = false;
    renderLibrary();
    return;
  }
  lib.hidden = true;
  header.hidden = false;
  workspace.hidden = false;
  renderHeader();
  if (!findSelected()) selected = null;
  renderGrid();
  renderDetail();   // the panel's width changes the grid's, so measure after it is drawn
  updateMainWidth();
}

// Tells the workout bands how wide the visible grid area is, so a band stays readable when the
// program is wider than the window and scrolls sideways.
function updateMainWidth() {
  var main = document.getElementById('main');
  document.getElementById('grid').style.setProperty('--mainw', Math.max(300, main.clientWidth - 40) + 'px');
}
window.addEventListener('resize', updateMainWidth);

/* ==========================================================================
   LIBRARY SCREEN (Phase 2 spec 1.1)
   Step 1 shows one section, "Not linked to an athlete", holding every program. It is TEMPORARY:
   athlete blocks arrive in step 3 and programs move under them. Everything that belongs only to
   that section is in renderUnlinkedSection(); removing the section later means deleting that
   function and its one call in renderLibrary().
   ========================================================================== */

var unlinkedOpen = true; // step 1 has no other section, so it starts open (spec: collapsed once athletes exist)

function openLibrary() {
  libraryOpen = true;
  render();
}

function openFromLibrary(entry) {
  setCurrent(entry);
  libraryOpen = false;
  render();
}

function plural(n, word) {
  return n + ' ' + word + (n === 1 ? '' : 's');
}

function duplicateProgram(entry) {
  var copy = JSON.parse(JSON.stringify(entry.program));
  copy.name = (entry.program.name + ' copy').slice(0, 200);
  addProgramEntry(copy, entry.kind);
  saveLibrary();
  showNotice('Duplicated.');
  render();
}

// Saves a copy of a program as a template: same structure and prescriptions, with the calculated kg
// values cleared (a template is for any athlete, so it carries no personal weights).
function saveAsTemplate(entry) {
  var copy = JSON.parse(JSON.stringify(entry.program));
  copy.name = (entry.program.name + ' (template)').slice(0, 200);
  copy.workouts.forEach(function (w) {
    w.exercises.forEach(function (ex) {
      ex.weeks.forEach(function (week) { week.groups.forEach(function (g) { g.kg = null; }); });
    });
  });
  addProgramEntry(copy, 'template');
  saveLibrary();
  showNotice('Saved as a template.');
  render();
}

function renameProgram(entry) {
  var input = textInput(entry.program.name, { maxlength: '200', 'aria-label': 'Program name' });
  var error = el('div', { className: 'form-error' });
  function save() {
    var name = input.value.trim();
    if (name === '') { error.textContent = 'Enter a name.'; return; }
    entry.program.name = name;
    entry.name = name;
    entry.modified = new Date().toISOString();
    closeModal();
    saveLibrary();
    render();
  }
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); });
  openModal({
    title: 'Rename program',
    body: el('div', null, [formRow('Name', input), error]),
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Save', onclick: save })
    ]
  });
  input.focus();
  input.select();
}

// Deleting the open program opens the most recent other one, or a new empty program if it was the last.
function deleteProgram(entry) {
  showConfirm({
    title: 'Delete "' + entry.name + '"?',
    text: 'This cannot be undone.',
    confirmLabel: 'Delete',
    onConfirm: function () {
      library = library.filter(function (e) { return e !== entry; });
      if (library.length === 0) addProgramEntry(createDefaultProgram());
      if (entry.id === currentId) setCurrent(mostRecentEntry());
      saveLibrary();
      render();
    }
  });
}

function renderProgramRow(entry) {

// "never", or "dd/mm/yyyy (N days ago)", and whether to show it as a warning.
function lastExportInfo() {
  var iso = libraryReadLastExport();
  if (!iso) return { text: 'never', stale: true };
  var days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days < 0) days = 0;
  return { text: formatDate(iso) + (days === 0 ? ' (today)' : ' (' + plural(days, 'day') + ' ago)'), stale: days > EXPORT_REMINDER_DAYS };
}

   ATHLETES (Phase 2 spec step 3): the Athletes section of the Library and the profile screen

var profileOpenId = null;   // id of the profile open on the profile screen, or null
var profileSearch = '';     // the search text above the "can't do" list

function findProfile(id) {
  for (var i = 0; i < profiles.length; i++) if (profiles[i].id === id) return profiles[i];
  return null;
}

// Called after every edit to a profile: stamps the date and saves. It does not redraw, so typing
// in a box keeps its cursor.
function profileTouched(p) {
  p.modified = new Date().toISOString();
  saveProfiles();
  document.getElementById('save-warning').hidden = draftSaved;
}

function todayIso() { return new Date().toISOString(); }

function openProfile(id) {
  profileOpenId = id;
  profileSearch = '';
  render();
}

function closeProfile() {
  profileOpenId = null;
  libraryOpen = true;
  render();
}

function addAthlete() {
  var p = newProfile('New Athlete');
  profiles.push(p);
  saveProfiles();
  openProfile(p.id);
}

function duplicateAthlete(p) {
  var copy = JSON.parse(JSON.stringify(p));
  copy.id = newProfileId();
  copy.name = (p.name + ' copy').slice(0, 200);
  copy.modified = new Date().toISOString();
  profiles.push(copy);
  saveProfiles();
  showNotice('Duplicated.');
  render();
}

// Programs made for this athlete. (Step 4 records the athlete in `program.source.profileId`; until
// then no program is linked, so this is empty.)
function programsOfAthlete(p) {
  return library.filter(function (e) { return e.program.source && e.program.source.profileId === p.id; });
}

// Asks first. Programs made for the athlete are kept: they move to "Not linked to an athlete".
// `after` (optional) runs instead of a plain redraw once the athlete is deleted.
function deleteAthlete(p, after) {
  var linked = programsOfAthlete(p);
  var who = p.name || 'this athlete';
  var text = 'This cannot be undone.';
  if (linked.length > 0) {
    text = plural(linked.length, 'program') + ' made for ' + who + ' will move to "Not linked to an athlete". The programs are kept. ' + text;
  }
  showConfirm({
    title: 'Delete "' + who + '"?',
    text: text,
    confirmLabel: 'Delete',
    onConfirm: function () {
      linked.forEach(function (e) { e.program.source.profileId = null; });
      profiles = profiles.filter(function (x) { return x !== p; });
      saveProfiles();
      if (linked.length > 0) saveLibrary();
      if (after) after(); else render();
    }
  });
}

var SHORT_LIFT_NAMES = { 'Back Squat': 'Squat', 'Bench Press': 'Bench', 'Overhead Press': 'OHP' };

// "Squat 200 · Bench 130 · Deadlift 240 · 2.5 kg steps" (a training max is marked TM).
function liftsSummary(p) {
  var parts = [];
  p.lifts.forEach(function (l) {
    var v = liftBaseValue(l);
    if (v === null) return;
    parts.push((SHORT_LIFT_NAMES[l.name] || l.name) + ' ' + formatNum(v) + (l.base === 'tm' ? ' TM' : ''));
  });
  return (parts.length ? parts.join(' · ') : 'No maxes entered') + ' · ' + formatNum(p.rounding) + ' kg steps';
}

function renderAthleteRow(p) {
  var tags = [];

// The Athletes section of the Library (above the programs).
function renderAthletesSection() {

/* ---- The profile screen ---- */

function sameName(a, b) { return a.trim().toLowerCase() === b.trim().toLowerCase(); }
function isUnavailable(p, name) { return p.unavailable.some(function (n) { return sameName(n, name); }); }

// A number typed in a box: returns a number from 0 to `max`, null for blank, or undefined if invalid.
function readMax(text, max) {
  var n = parseNumber(text);
  if (n === null) return null;
  return (isNaN(n) || n > max) ? undefined : n;
}

function renderLiftRow(p, l, index) {
  var nameInput = textInput(l.name, { maxlength: '100', list: 'ex-datalist', 'aria-label': 'Lift name' });
  nameInput.addEventListener('input', function () { l.name = nameInput.value; profileTouched(p); });

  function maxInput(key, label) {
    var input = textInput(l[key] === null ? '' : formatNum(l[key]), { inputmode: 'decimal', 'aria-label': label + ', ' + (l.name || 'lift') });
    input.className = 'num-input';
    input.addEventListener('change', function () {
      var n = readMax(input.value, 2000);
      if (n === undefined) {
        showNotice('A max must be a number from 0 to 2000 kg, or left blank.');
        input.value = l[key] === null ? '' : formatNum(l[key]);
        return;
      }
      l[key] = n;
      l.updated = todayIso();
      profileTouched(p);
      renderProfile();
    });
    return input;
  }

  function baseButton(value, text) {
    return el('button', {
      className: l.base === value ? 'on' : null, text: text, 'aria-pressed': l.base === value ? 'true' : 'false',
      onclick: function () { l.base = value; profileTouched(p); renderProfile(); }
    });
  }

  var note;
  if (l.base === 'tm' && l.trainingMax === null) note = el('span', { className: 'warn-text', text: 'Add a training max' });
  else note = el('span', { className: 'dim', text: l.updated ? formatDate(l.updated) : '' });

  function remove() {
    p.lifts.splice(index, 1);
    profileTouched(p);
    renderProfile();
  }
  var hasValues = l.oneRm !== null || l.trainingMax !== null;
  return el('tr', null, [
    el('td', null, [nameInput]),
    el('td', null, [maxInput('oneRm', '1RM')]),
    el('td', null, [maxInput('trainingMax', 'Training max')]),
    el('td', null, [el('div', { className: 'segmented' }, [baseButton('1rm', '1RM'), baseButton('tm', 'TM')])]),
    el('td', null, [note]),
    el('td', null, [el('button', {
      className: 'link-btn', text: '✕', 'aria-label': 'Remove ' + (l.name || 'lift'),
      onclick: function () {
        if (!hasValues) { remove(); return; }
        showConfirm({ title: 'Remove ' + (l.name || 'this lift') + '?', text: 'Its maxes will be deleted.', confirmLabel: 'Remove', onConfirm: remove });
      }
    })])
  ]);
}

// The right-hand column: the exercises this athlete cannot do, ticked from the Exercise List.
function renderUnavailableColumn(p) {
  var base = loadExerciseList();
  var searchInput = textInput(profileSearch, { placeholder: 'Search the Exercise List…', 'aria-label': 'Search exercises' });
  var countLine = el('div', { className: 'hint' });
  var listBox = el('div', { className: 'pf-list' });
  var addBox = el('div');

  function names() {
    // The Exercise List, then any ticked name that is not on it (marked so).
    var extras = p.unavailable.filter(function (n) { return !base.some(function (b) { return sameName(b, n); }); });
    return base.map(function (n) { return { name: n, extra: false }; })
      .concat(extras.map(function (n) { return { name: n, extra: true }; }));
  }

  function toggle(name, on) {
    if (on) { if (!isUnavailable(p, name)) p.unavailable.push(name); }
    else p.unavailable = p.unavailable.filter(function (n) { return !sameName(n, name); });
    profileTouched(p);
    draw();
  }

  function draw() {
    var all = names();
    var q = profileSearch.trim().toLowerCase();
    var shown = all.filter(function (x) { return q === '' || x.name.toLowerCase().indexOf(q) >= 0; });
    countLine.textContent = p.unavailable.length + ' ticked of ' + all.length;
    listBox.textContent = '';
    if (base.length === 0) {
      listBox.appendChild(el('div', { className: 'hint', text: 'Load your Exercise List (Library > Load Exercise List) to choose from it. You can still add names by typing them.' }));
    }
    shown.forEach(function (x) {
      var box = el('input', { type: 'checkbox', 'aria-label': x.name });
      box.checked = isUnavailable(p, x.name);
      box.addEventListener('change', function () { toggle(x.name, box.checked); });
      listBox.appendChild(el('label', { className: 'pf-check' + (box.checked ? ' no' : '') }, [
        box,
        el('span', { text: x.name }),
        x.extra ? el('span', { className: 'warn-text', text: 'Not in your Exercise List' }) : el('span')
      ]));
    });
    // A typed name that is not on the list can be added.
    addBox.textContent = '';
    var typed = profileSearch.trim();
    if (typed !== '' && !all.some(function (x) { return sameName(x.name, typed); }) && typed.length <= 200) {
      addBox.appendChild(el('button', {
        className: 'link-btn acc', text: 'Add "' + typed + '" as unavailable',
        onclick: function () {
          p.unavailable.push(typed);
          profileSearch = '';
          searchInput.value = '';
          profileTouched(p);
          draw();
        }
      }));
    }
  }
  searchInput.addEventListener('input', function () { profileSearch = searchInput.value; draw(); });
  draw();

  return el('div', { className: 'pf-right' }, [
    el('div', { className: 'ps-head' }, [el('b', { text: "Exercises " + (p.name || 'this athlete') + " can't do" })]),
    el('div', { className: 'hint', text: "Tick what the gym doesn't have. Everything else is available." }),
    el('div', { className: 'pr' }, [searchInput]),
    countLine,
    addBox,
    listBox
  ]);
}

function renderProfile() {
  var box = document.getElementById('profile');

  var oldLeft = box.querySelector('.pf-left');

      el('button', { className: 'primary', text: 'Save', onclick: function () { saveProfiles(); showNotice('Saved.'); closeProfile(); } }),
      el('button', { className: 'danger-text', text: 'Delete', onclick: function () { deleteAthlete(p, closeProfile); } })
    ])

      el('th', { text: 'Lift' }), el('th', { text: '1RM' }), el('th', { text: 'Training max' }), el('th', { text: 'Use' }), el('th'), el('th')
    ])]),

      el('div', { className: 'ps-head' }, [
        el('b', { text: 'Lifts and maxes' }),
        el('span', { className: 'hint', text: 'kg · percentages use the value marked "Use"' }),
        el('button', {
          className: 'link-btn acc', text: 'Add lift',
          onclick: function () { p.lifts.push(newLift('')); profileTouched(p); renderProfile(); }
        })
      ]),
      liftTable,

}

/* ==========================================================================
   ATHLETES (Phase 2 spec step 3): the Athletes section of the Library and the profile screen
   ========================================================================== */

var profileOpenId = null;   // id of the profile open on the profile screen, or null
var profileSearch = '';     // the search text above the "can't do" list

function findProfile(id) {
  for (var i = 0; i < profiles.length; i++) if (profiles[i].id === id) return profiles[i];
  return null;
}

// Called after every edit to a profile: stamps the date and saves. It does not redraw, so typing
// in a box keeps its cursor.
function profileTouched(p) {
  p.modified = new Date().toISOString();
  saveProfiles();
  document.getElementById('save-warning').hidden = draftSaved;
}

function todayIso() { return new Date().toISOString(); }

function openProfile(id) {
  profileOpenId = id;
  profileSearch = '';
  render();
}

function closeProfile() {
  profileOpenId = null;
  libraryOpen = true;
  render();
}

function addAthlete() {
  var p = newProfile('New Athlete');
  profiles.push(p);
  saveProfiles();
  openProfile(p.id);
}

function duplicateAthlete(p) {
  var copy = JSON.parse(JSON.stringify(p));
  copy.id = newProfileId();
  copy.name = (p.name + ' copy').slice(0, 200);
  copy.modified = new Date().toISOString();
  profiles.push(copy);
  saveProfiles();
  showNotice('Duplicated.');
  render();
}

// Programs made for this athlete. (Step 4 records the athlete in `program.source.profileId`; until
// then no program is linked, so this is empty.)
function programsOfAthlete(p) {
  return library.filter(function (e) { return e.kind !== 'template' && e.program.source && e.program.source.profileId === p.id; });
}

// Asks first. Programs made for the athlete are kept: they move to "Not linked to an athlete".
// `after` (optional) runs instead of a plain redraw once the athlete is deleted.
function deleteAthlete(p, after) {
  var linked = programsOfAthlete(p);
  var who = p.name || 'this athlete';
  var text = 'This cannot be undone.';
  if (linked.length > 0) {
    text = plural(linked.length, 'program') + ' made for ' + who + ' will move to "Not linked to an athlete". The programs are kept. ' + text;
  }
  showConfirm({
    title: 'Delete "' + who + '"?',
    text: text,
    confirmLabel: 'Delete',
    onConfirm: function () {
      linked.forEach(function (e) { e.program.source.profileId = null; });
      profiles = profiles.filter(function (x) { return x !== p; });
      saveProfiles();
      if (linked.length > 0) saveLibrary();
      if (after) after(); else render();
    }
  });
}

var SHORT_LIFT_NAMES = { 'Back Squat': 'Squat', 'Bench Press': 'Bench', 'Overhead Press': 'OHP' };

// "Squat 200 · Bench 130 · Deadlift 240 · 2.5 kg steps" (a training max is marked TM).
function liftsSummary(p) {
  var parts = [];
  p.lifts.forEach(function (l) {
    var v = liftBaseValue(l);
    if (v === null) return;
    parts.push((SHORT_LIFT_NAMES[l.name] || l.name) + ' ' + formatNum(v) + (l.base === 'tm' ? ' TM' : ''));
  });
  return (parts.length ? parts.join(' · ') : 'No maxes entered') + ' · ' + formatNum(p.rounding) + ' kg steps';
}

// A program made for an athlete: it has a source that names an athlete who still exists.
function isLinkedProgram(entry) {
  return entry.kind !== 'template' && !!entry.program.source && !!entry.program.source.profileId && !!findProfile(entry.program.source.profileId);
}

function byNewest(a, b) { return a.modified < b.modified ? 1 : a.modified > b.modified ? -1 : 0; }

var athleteOpenState = {};   // athlete id -> true (expanded) or false (collapsed); not saved

// By default only the athlete whose program was edited last is expanded.
function defaultOpenAthleteId() {
  var linked = library.filter(isLinkedProgram).sort(byNewest);
  return linked.length > 0 ? linked[0].program.source.profileId : null;
}

function isAthleteOpen(p) {
  return athleteOpenState[p.id] !== undefined ? athleteOpenState[p.id] : p.id === defaultOpenAthleteId();
}

// One athlete in the Library: a header row that expands to the programs made for them.
function renderAthleteBlock(p) {
  var progs = programsOfAthlete(p).sort(byNewest);
  var open = isAthleteOpen(p);
  var tags = [];
  if (p.unavailable.length > 0) tags.push(el('span', { className: 'tag-warn', text: plural(p.unavailable.length, 'exercise') + ' unavailable' }));
  tags.push(el('span', { className: 'tag', text: plural(progs.length, 'program') }));
  function stop(fn) { return function (e) { e.stopPropagation(); fn(); }; }
  var fromTemplate = function () { openGenerateDialog({ profile: p }); };
  var head = keyClick(el('div', {
    className: 'lib-row ath-head', role: 'button', tabindex: '0', 'aria-expanded': open ? 'true' : 'false',
    onclick: function () { athleteOpenState[p.id] = !open; render(); }
  }, [
    el('span', { className: 'car' }, [icon(open ? 'down' : 'right')]),
    el('div', { className: 't' }, [
      el('b', { text: p.name === '' ? '(No name)' : p.name }),
      el('span', { text: liftsSummary(p) })
    ])
  ].concat(tags, [
    el('div', { className: 'acts' }, [
      el('button', { text: 'Edit profile', onclick: stop(function () { openProfile(p.id); }) }),
      el('button', { text: 'Program from template', title: 'Make a program for this athlete from a template', onclick: stop(fromTemplate) }),
      menuButton('More actions for ' + (p.name || 'this athlete'), function () {
        return [
          { text: 'Duplicate', onClick: function () { duplicateAthlete(p); } },
          { text: 'Delete', cls: 'danger-text', onClick: function () { deleteAthlete(p); } }
        ];
      })
    ])
  ])));
  var wrap = el('div', null, [head]);
  if (open) {
    if (progs.length === 0) {
      wrap.appendChild(el('div', { className: 'lib-row sub-row' }, [
        el('div', { className: 't dim', text: 'No programs yet for this athlete.' }),
        el('div', { className: 'acts' }, [el('button', { text: 'Program from template', onclick: fromTemplate })])
      ]));
    }
    progs.forEach(function (entry) { wrap.appendChild(renderProgramRow(entry, true)); });
  }
  return wrap;
}

// The Athletes section of the Library (below the templates).
function renderAthletesSection() {
  var wrap = el('div');
  var sorted = profiles.slice().sort(function (a, b) { return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : a.name.toLowerCase() > b.name.toLowerCase() ? 1 : 0; });
  var anyClosed = sorted.some(function (p) { return !isAthleteOpen(p); });
  var head = [
    el('span', { text: 'Athletes' }),
    el('span', { className: 'count', text: String(sorted.length) })
  ];
  if (sorted.length > 0) {
    head.push(el('button', {
      className: 'expand-all', text: anyClosed ? 'Expand all' : 'Collapse all',
      onclick: function () { sorted.forEach(function (p) { athleteOpenState[p.id] = anyClosed; }); render(); }
    }));
  }
  head.push(el('button', { text: 'New athlete', onclick: addAthlete }));
  wrap.appendChild(el('div', { className: 'lib-sect static' }, head));
  if (sorted.length === 0) {
    wrap.appendChild(el('div', { className: 'lib-row' }, [
      el('div', { className: 't dim', text: 'No athletes yet. An athlete keeps the maxes and the exercises that the gym does not have.' }),
      el('div', { className: 'acts' }, [el('button', { text: 'New athlete', onclick: addAthlete })])
    ]));
  }
  sorted.forEach(function (p) { wrap.appendChild(renderAthleteBlock(p)); });
  return wrap;
}

/* ---- Generate: make a program for an athlete from a template (Phase 2 spec 4.2) ---- */

// Makes the program and opens it. `extras` is { exerciseName: kg } for exercises with no matching lift.
function generateProgram(tplEntry, profile, name, extras) {
  var copy = JSON.parse(JSON.stringify(tplEntry.program));
  copy.name = name.slice(0, 200);
  var extraList = Object.keys(extras).filter(function (k) { return extras[k] !== null; }).map(function (k) { return { name: k, value: extras[k] }; });
  copy.source = { templateId: tplEntry.id, templateName: tplEntry.program.name, profileId: profile.id, profileName: profile.name, generatedOn: new Date().toISOString() };
  copy.profileUsed = snapshotFromProfile(profile, extraList);
  recalcKg(copy);
  var entry = addProgramEntry(copy, 'program');
  athleteOpenState[profile.id] = true;
  saveLibrary();
  setCurrent(entry);
  libraryOpen = false;
  render();
}

// `opts`: { template: library entry } (from a template row) or { profile } (from an athlete block), or both.
function openGenerateDialog(opts) {
  var templates = library.filter(function (e) { return e.kind === 'template'; }).sort(byNewest);
  if (templates.length === 0 || profiles.length === 0) {
    showMessage('New program for an athlete',
      templates.length === 0 && profiles.length === 0 ? 'You need a template and an athlete first.' :
      templates.length === 0 ? 'You need a template first. Create one, or use Save as template on a program.' : 'You need an athlete first. Use New athlete in the Library.');
    return;
  }
  var state = { tpl: opts.template || templates[0], prof: opts.profile || profiles[0], name: '', nameEdited: false, extras: {} };
  var extrasText = {};   // what is typed in the extra-max boxes

  var tplSelect = selectBox(templates.map(function (e) { return [e.id, e.name]; }), state.tpl.id);
  var profSelect = selectBox(profiles.map(function (p) { return [p.id, p.name || '(No name)']; }), state.prof.id);
  var nameInput = textInput('', { maxlength: '200', 'aria-label': 'Name for the new program' });
  var countLine = el('div');   // "12 of 16 percentage loads will get a kg value."
  var rowsBox = el('div');     // one box per exercise that has no lift of the same name
  var info = el('div', null, [countLine, rowsBox]);
  var error = el('div', { className: 'form-error' });

  function defaultName() { return state.tpl.program.name + ' - ' + (state.prof.name || 'athlete'); }

  function readExtras() {
    state.extras = {};
    var bad = false;
    Object.keys(extrasText).forEach(function (k) {
      var n = readMax(extrasText[k], 2000);
      if (n === undefined) bad = true; else if (n !== null) state.extras[k] = n;
    });
    return !bad;
  }

  // The count line and the error. Called for each key typed in a max box: it changes text only, so
  // the boxes keep their place and the cursor, and a click on "Create program" is not lost.
  function updateCount() {
    var ok = readExtras();
    var a = analyseGenerate(state.tpl.program, state.prof, state.extras);
    countLine.className = a.total > 0 && a.resolved === a.total ? 'ok-text' : 'hint';
    countLine.textContent = a.total === 0
      ? 'This template has no percentage loads, so no kg values will be calculated.'
      : a.resolved + ' of ' + a.total + ' percentage loads will get a kg value.';
    error.textContent = ok ? '' : 'A max must be a number from 0 to 2000 kg.';
  }

  // Draws the max boxes. Called when the dialog opens and when the template or the athlete changes.
  function draw() {
    if (!state.nameEdited) nameInput.value = defaultName();
    rowsBox.textContent = '';
    // Exercises with no lift of that name: ask for a max of their own. The list does not depend on
    // what is typed, so a box stays in view after it is filled in.
    var a = analyseGenerate(state.tpl.program, state.prof, {});
    a.unmatched.forEach(function (name) {
      var input = textInput(extrasText[name] || '', { inputmode: 'decimal', placeholder: '–', 'aria-label': 'Max in kg for ' + name });
      input.className = 'num-input';
      input.addEventListener('input', function () { extrasText[name] = input.value; updateCount(); });
      rowsBox.appendChild(el('div', { className: 'gen-extra' }, [
        el('div', null, [
          el('b', { text: name }),
          el('div', { className: 'hint', text: (state.prof.name || 'The athlete') + ' has no lift called "' + name + '". Enter a max for it, or leave blank and fill in kg later.' })
        ]),
        input, el('span', { className: 'unit', text: 'kg' })
      ]));
    });
    var problems = [];
    a.noValue.forEach(function (n) { problems.push(n + ': no max entered in ' + state.prof.name + "'s profile"); });
    a.unavailable.forEach(function (n) { problems.push(n + ': not available for ' + state.prof.name); });
    if (problems.length > 0) {
      rowsBox.appendChild(el('div', { className: 'warn-text', text: 'These are still created, but need a look:' }));
      problems.forEach(function (t) { rowsBox.appendChild(el('div', { className: 'warn-text', text: '• ' + t })); });
    }
    updateCount();
  }

  tplSelect.addEventListener('change', function () {
    state.tpl = library.filter(function (e) { return e.id === tplSelect.value; })[0];
    extrasText = {};
    draw();
  });
  profSelect.addEventListener('change', function () { state.prof = findProfile(profSelect.value); extrasText = {}; draw(); });
  nameInput.addEventListener('input', function () { state.nameEdited = true; });

  function create() {
    if (!readExtras()) { updateCount(); return; }
    var name = nameInput.value.trim();
    if (name === '') { error.textContent = 'Enter a name.'; return; }
    closeModal();
    generateProgram(state.tpl, state.prof, name, state.extras);
  }

  openModal({
    title: 'New program for an athlete',
    wide: true,
    body: el('div', null, [
      formRow('Template', tplSelect),
      formRow('Athlete', profSelect),
      formRow('Name of the new program', nameInput),
      info,
      error
    ]),
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Create program', onclick: create })
    ]
  });
  draw();
}

/* ---- "The athlete's profile has changed" bar (Phase 2 spec 4.3) ---- */

var profileBarDismissed = {};   // program id -> the snapshot key that was dismissed (not saved)

// Shows or hides the bar under the editor header.
function updateProfileBar() {
  var bar = document.getElementById('profile-changed');
  bar.hidden = true;
  bar.textContent = '';
  if (!program || !program.profileUsed || !program.source || libraryOpen) return;
  var owner = findProfile(program.source.profileId);
  if (!owner) return;
  var fresh = freshSnapshot(program, owner);
  var key = snapshotKey(fresh);
  if (key === snapshotKey(program.profileUsed) || profileBarDismissed[currentId] === key) return;
  bar.appendChild(el('span', { text: owner.name + "'s profile has changed since this program was made. Recalculate the kg values?" }));
  bar.appendChild(el('button', {
    className: 'primary', text: 'Recalculate',
    onclick: function () { program.profileUsed = fresh; changed(); }
  }));
  bar.appendChild(el('button', { text: 'Dismiss', onclick: function () { profileBarDismissed[currentId] = key; updateProfileBar(); } }));
  bar.hidden = false;
}

/* ---- The profile screen ---- */

function sameName(a, b) { return a.trim().toLowerCase() === b.trim().toLowerCase(); }
function isUnavailable(p, name) { return p.unavailable.some(function (n) { return sameName(n, name); }); }

// A number typed in a box: returns a number from 0 to `max`, null for blank, or undefined if invalid.
function readMax(text, max) {
  var n = parseNumber(text);
  if (n === null) return null;
  return (isNaN(n) || n > max) ? undefined : n;
}

function renderLiftRow(p, l, index) {
  var nameInput = textInput(l.name, { maxlength: '100', list: 'ex-datalist', 'aria-label': 'Lift name' });
  nameInput.addEventListener('input', function () { l.name = nameInput.value; profileTouched(p); });

  function maxInput(key, label) {
    var input = textInput(l[key] === null ? '' : formatNum(l[key]), { inputmode: 'decimal', 'aria-label': label + ', ' + (l.name || 'lift') });
    input.className = 'num-input';
    input.addEventListener('change', function () {
      var n = readMax(input.value, 2000);
      if (n === undefined) {
        showNotice('A max must be a number from 0 to 2000 kg, or left blank.');
        input.value = l[key] === null ? '' : formatNum(l[key]);
        return;
      }
      l[key] = n;
      l.updated = todayIso();
      profileTouched(p);
      renderProfile();
    });
    return input;
  }

  function baseButton(value, text) {
    return el('button', {
      className: l.base === value ? 'on' : null, text: text, 'aria-pressed': l.base === value ? 'true' : 'false',
      onclick: function () { l.base = value; profileTouched(p); renderProfile(); }
    });
  }

  var note;
  if (l.base === 'tm' && l.trainingMax === null) note = el('span', { className: 'warn-text', text: 'Add a training max' });
  else note = el('span', { className: 'dim', text: l.updated ? formatDate(l.updated) : '' });

  function remove() {
    p.lifts.splice(index, 1);
    profileTouched(p);
    renderProfile();
  }
  var hasValues = l.oneRm !== null || l.trainingMax !== null;
  return el('tr', null, [
    el('td', null, [nameInput]),
    el('td', null, [maxInput('oneRm', '1RM')]),
    el('td', null, [maxInput('trainingMax', 'Training max')]),
    el('td', null, [el('div', { className: 'segmented' }, [baseButton('1rm', '1RM'), baseButton('tm', 'TM')])]),
    el('td', null, [note]),
    el('td', null, [iconButton('close', 'Remove ' + (l.name || 'lift'), function () {
        if (!hasValues) { remove(); return; }
        showConfirm({ title: 'Remove ' + (l.name || 'this lift') + '?', text: 'Its maxes will be deleted.', confirmLabel: 'Remove', onConfirm: remove });
    })])
  ]);
}

// The right-hand column: the exercises this athlete cannot do, ticked from the Exercise List.
function renderUnavailableColumn(p) {
  var base = loadExerciseList();
  var searchInput = textInput(profileSearch, { placeholder: 'Search the Exercise List…', 'aria-label': 'Search exercises' });
  var countLine = el('div', { className: 'hint' });
  var listBox = el('div', { className: 'pf-list' });
  var addBox = el('div');

  function names() {
    // The Exercise List, then any ticked name that is not on it (marked so).
    var extras = p.unavailable.filter(function (n) { return !base.some(function (b) { return sameName(b, n); }); });
    return base.map(function (n) { return { name: n, extra: false }; })
      .concat(extras.map(function (n) { return { name: n, extra: true }; }));
  }

  function toggle(name, on) {
    if (on) { if (!isUnavailable(p, name)) p.unavailable.push(name); }
    else p.unavailable = p.unavailable.filter(function (n) { return !sameName(n, name); });
    profileTouched(p);
    draw();
  }

  function draw() {
    var all = names();
    var q = profileSearch.trim().toLowerCase();
    var shown = all.filter(function (x) { return q === '' || x.name.toLowerCase().indexOf(q) >= 0; });
    countLine.textContent = p.unavailable.length + ' ticked of ' + all.length;
    listBox.textContent = '';
    if (base.length === 0) {
      listBox.appendChild(el('div', { className: 'hint', text: 'Import your Exercise List (Library > Import > Import exercise list) to choose from it. You can still add names by typing them.' }));
    }
    shown.forEach(function (x) {
      var box = el('input', { type: 'checkbox', 'aria-label': x.name });
      box.checked = isUnavailable(p, x.name);
      box.addEventListener('change', function () { toggle(x.name, box.checked); });
      listBox.appendChild(el('label', { className: 'pf-check' + (box.checked ? ' no' : '') }, [
        box,
        el('span', { text: x.name }),
        x.extra ? el('span', { className: 'warn-text', text: 'Not in your Exercise List' }) : el('span')
      ]));
    });
    // A typed name that is not on the list can be added.
    addBox.textContent = '';
    var typed = profileSearch.trim();
    if (typed !== '' && !all.some(function (x) { return sameName(x.name, typed); }) && typed.length <= 200) {
      addBox.appendChild(el('button', {
        className: 'link-btn acc', text: 'Add "' + typed + '" as unavailable',
        onclick: function () {
          p.unavailable.push(typed);
          profileSearch = '';
          searchInput.value = '';
          profileTouched(p);
          draw();
        }
      }));
    }
  }
  searchInput.addEventListener('input', function () { profileSearch = searchInput.value; draw(); });
  draw();

  return el('div', { className: 'pf-right' }, [
    el('div', { className: 'ps-head' }, [el('b', { text: "Exercises " + (p.name || 'this athlete') + " can't do" })]),
    el('div', { className: 'hint', text: "Tick what the gym doesn't have. Everything else is available." }),
    el('div', { className: 'pr' }, [searchInput]),
    countLine,
    addBox,
    listBox
  ]);
}

function renderProfile() {
  var box = document.getElementById('profile');
  var p = findProfile(profileOpenId);
  if (!p) { profileOpenId = null; render(); return; }
  var oldLeft = box.querySelector('.pf-left');
  var oldList = box.querySelector('.pf-list');
  var leftScroll = oldLeft ? oldLeft.scrollTop : 0;
  var listScroll = oldList ? oldList.scrollTop : 0;
  box.textContent = '';

  var titleEl = el('span', { className: 'title', text: p.name === '' ? '(No name)' : p.name });
  box.appendChild(el('div', { className: 'lib-bar' }, [
    el('button', { className: 'link-btn', text: 'Library', onclick: closeProfile }),
    el('span', { className: 'dim', text: '/' }),
    titleEl,
    el('div', { className: 'spacer' }, [
      // Everything is saved as you type; Done only goes back to the Library.
      el('span', { className: 'hint', text: 'Changes are saved automatically' }),
      el('button', { className: 'danger-text', text: 'Delete', onclick: function () { deleteAthlete(p, closeProfile); } }),
      el('button', { className: 'primary', text: 'Done', onclick: closeProfile })
    ])
  ]));

  // Name and notes
  var nameInput = textInput(p.name, { maxlength: '200', 'aria-label': 'Athlete name' });
  nameInput.addEventListener('input', function () {
    p.name = nameInput.value;
    titleEl.textContent = p.name === '' ? '(No name)' : p.name;
    profileTouched(p);
  });
  var notes = el('textarea', { maxlength: '2000', 'aria-label': 'Notes', placeholder: 'Notes about this athlete' });
  notes.value = p.notes;
  notes.addEventListener('input', function () { p.notes = notes.value; profileTouched(p); });

  // Lifts and maxes
  var liftRows = el('tbody');
  p.lifts.forEach(function (l, i) { liftRows.appendChild(renderLiftRow(p, l, i)); });
  var liftTable = el('table', { className: 'pf-table' }, [
    el('thead', null, [el('tr', null, [
      el('th', { text: 'Lift' }), el('th', { text: '1RM' }), el('th', { text: 'Training max' }), el('th', { text: 'Use' }), el('th'), el('th')
    ])]),
    liftRows
  ]);
  var datalist = el('datalist', { id: 'ex-datalist' }, loadExerciseList().slice(0, 1000).map(function (n) { return el('option', { value: n }); }));

  // Rounding
  var roundInput = textInput(formatNum(p.rounding), { inputmode: 'decimal', 'aria-label': 'Round loads to' });
  roundInput.className = 'num-input';
  roundInput.addEventListener('change', function () {
    var n = parseNumber(roundInput.value);
    if (n === null || isNaN(n) || n < 0.5 || n > 10) {
      showNotice('Rounding must be a number from 0.5 to 10 kg.');
      roundInput.value = formatNum(p.rounding);
      return;
    }
    p.rounding = n;
    profileTouched(p);
  });

  var left = el('div', { className: 'pf-left' }, [
    el('div', { className: 'ps-head' }, [el('b', { text: 'Athlete' })]),
    panelRow('Name', [nameInput]),
    panelRow('Notes', [notes]),
    el('div', { className: 'ps' }, [
      el('div', { className: 'ps-head' }, [
        el('b', { text: 'Lifts and maxes' }),
        el('span', { className: 'hint', text: 'kg · percentages use the value marked "Use"' }),
        el('button', {
          className: 'link-btn acc', text: 'Add lift',
          onclick: function () { p.lifts.push(newLift('')); profileTouched(p); renderProfile(); }
        })
      ]),
      liftTable,
      datalist,
      panelRow('Round loads to', [roundInput, el('span', { className: 'unit', text: 'kg (the smallest step your plates allow)' })])
    ])
  ]);
  box.appendChild(el('div', { className: 'pf-body' }, [left, renderUnavailableColumn(p)]));
  left.scrollTop = leftScroll;
  var newList = box.querySelector('.pf-list');
  if (newList) newList.scrollTop = listScroll;
}

/* ==========================================================================
   EXERCISE LIST (spec 5.12). Loading it from a backup file arrives in step 7;
   for now we only read whatever is stored.
   ========================================================================== */

function loadExerciseList() {
  try {
    var data = JSON.parse(localStorage.getItem(EXERCISE_LIST_KEY));
    if (Array.isArray(data)) {
      return data.filter(function (n) { return typeof n === 'string' && n.trim() !== ''; });
    }
  } catch (err) { /* no list stored, or storage unavailable */ }
  return [];
}

// The names of `list` that contain the typed text, without regard to capital letters. Names that
// start with the text come first. Blank text gives the full list.
function matchExercises(list, query) {
  var q = query.trim().toLowerCase();
  var starts = [];
  var contains = [];
  list.forEach(function (n) {
    var at = n.toLowerCase().indexOf(q);
    if (at === 0) starts.push(n);
    else if (at > 0) contains.push(n);
  });
  return starts.concat(contains);
}

// Adds a name typed in the Add exercise box to the global Exercise List, at the end, unless the
// list already has it (compared without regard to capital letters). Returns the name to use: the
// list's own spelling if it was already there.
function addToExerciseList(name) {
  var list = loadExerciseList();
  var lower = name.toLowerCase();
  for (var i = 0; i < list.length; i++) {
    if (list[i].toLowerCase() === lower) return list[i];
  }
  list.push(name);
  try { localStorage.setItem(EXERCISE_LIST_KEY, JSON.stringify(list)); } catch (err) { /* the exercise is still added to the program */ }
  return name;
}

/* ==========================================================================
   NUMBER PARSING (spec 9: accept "." and "," as the decimal mark)
   ========================================================================== */

// "" -> null, "97,5" -> 97.5, anything that is not a plain non-negative number -> NaN.
function parseNumber(text) {
  var t = String(text).trim().replace(',', '.');
  if (t === '') return null;
  if (!/^\d+(\.\d+)?$/.test(t)) return NaN;
  return Number(t);
}

function parseWhole(text, lo, hi) {
  var n = parseNumber(text);
  if (n === null || isNaN(n) || Math.floor(n) !== n || n < lo || n > hi) return NaN;
  return n;
}

var LOAD_LIMITS = { kg: 2000, pct: 500, rpe: 10, rir: 10 };
var LOAD_LABELS = { kg: 'kg', pct: '% of 1RM', rpe: 'RPE', rir: 'RIR' };

// Only a kg load has a separate effort target (RPE or RIR). A % load, and a load that is itself an
// RPE or RIR, do not. An older % load that already has a target keeps showing it (`hasValue`), so
// it can still be changed or cleared.
function hasEffortTarget(loadType, hasValue) { return loadType === 'kg' || !!hasValue; }

// Returns { value } (a number or null) or { error }.
function readLoad(text, loadType) {
  var n = parseNumber(text);
  if (n !== null && (isNaN(n) || n > LOAD_LIMITS[loadType])) {
    return { error: 'Load must be a number from 0 to ' + LOAD_LIMITS[loadType] + ' (' + LOAD_LABELS[loadType] + '), or left blank.' };
  }
  return { value: n };
}

// Reps typed as one number ("8") or as a range ("8-10", "8–10", "8 to 10").
// Returns { reps, repsMax } (repsMax is null without a range) or { error }.
function readReps(text) {
  var t = String(text).trim();
  var m = /^(\d+)\s*(?:-|–|to)\s*(\d+)$/.exec(t);
  var reps = parseWhole(m ? m[1] : t, 1, 999);
  if (isNaN(reps)) return { error: 'Reps must be a whole number from 1 to 999, or a range such as 8-10.' };
  if (!m) return { reps: reps, repsMax: null };
  var max = parseWhole(m[2], 2, 999);
  if (isNaN(max) || max <= reps) return { error: 'In a rep range, the second number must be larger than the first.' };
  return { reps: reps, repsMax: max };
}

// An effort target: a number from 0 to 10 (half steps allowed), or blank. `name` is "RPE" or "RIR".
function readEffortTarget(text, name) {
  var n = parseNumber(text);
  if (n !== null && (isNaN(n) || n > 10)) return { error: 'Target ' + name + ' must be a number from 0 to 10, or left blank.' };
  return { value: n };
}

/* ==========================================================================
   CHANGES TO EXERCISES (no drawing here)
   ========================================================================== */

function includedWeekCount(ex) {
  return ex.weeks.filter(function (w) { return w.included; }).length;
}

// Spec 5.10: deleting an exercise unpairs its set groups; their partners stay.
function deleteExercise(workout, ex) {
  workout.exercises = workout.exercises.filter(function (o) { return o !== ex; });
  purgeBrokenPairs(workout);
  changed();
}

// Spec 5.7: removing from a week hides it there. If that was the last week, confirm and delete.
function removeFromWeek(workout, ex, weekIndex) {
  if (includedWeekCount(ex) <= 1) {
    showConfirm({
      title: 'Delete ' + ex.name + '?',
      text: 'This is the only week that includes this exercise, so it will be deleted.',
      confirmLabel: 'Delete',
      onConfirm: function () { deleteExercise(workout, ex); }
    });
    return;
  }
  ex.weeks[weekIndex].included = false;
  changed();
}

// Removes a whole workout from one week. Exercises that appear in no other week would be left
// with nowhere to live, so those are deleted (the dialog names them first).
function confirmRemoveWorkoutFromWeek(workout, wi, weekIndex) {
  var here = workout.exercises.filter(function (ex) { return ex.weeks[weekIndex].included; });
  var onlyHere = here.filter(function (ex) { return includedWeekCount(ex) <= 1; });
  var text = 'Its exercises stay in the other weeks.';
  if (onlyHere.length > 0) {
    text = 'These exercises appear only in this week and will be deleted: ' +
      onlyHere.map(function (ex) { return ex.name; }).join(', ') + '. The others stay in the other weeks.';
  }
  showConfirm({
    title: 'Remove Workout ' + (wi + 1) + ' from Week ' + (weekIndex + 1) + '?',
    text: text,
    confirmLabel: 'Remove',
    onConfirm: function () {
      here.forEach(function (ex) {
        if (onlyHere.indexOf(ex) >= 0) workout.exercises = workout.exercises.filter(function (o) { return o !== ex; });
        else ex.weeks[weekIndex].included = false;
      });
      purgeBrokenPairs(workout);
      changed();
    }
  });
}

// Puts every exercise of the workout back into that week. A week that was edited by hand keeps its
// edits; the others already hold the pattern's values.
function restoreWorkoutInWeek(workout, weekIndex) {
  workout.exercises.forEach(function (ex) { ex.weeks[weekIndex].included = true; });
  changed();
}

// Spec 5.7: adding back uses the pattern's value for that week.
function addToWeek(ex, weekIndex) {
  ex.weeks[weekIndex].included = true;
  ex.weeks[weekIndex].edited = false;
  ex.weeks = generateWeeks(ex, program.weeks);
  changed();
}

// Creates an exercise at the end of a workout (spec 5.6).
// `fields`: name, groups (one or more set groups, each with its own load type and rest), notes.
// `weekIndex` is null for "All weeks".
function createExercise(workout, fields, weekIndex) {
  var ex = newExercise(fields.name, program.weeks);
  ex.notes = fields.notes;
  ex.weeks[0].groups = fields.groups;
  ex.patterns = fields.patterns || fields.groups.map(function (g) { return samePattern(g.loadType); });
  ex.supersets = fields.groups.map(function () { return null; });
  // Every week (even hidden ones) keeps a copy of the entered values.
  ex.weeks = generateWeeks(ex, program.weeks);
  if (weekIndex !== null) {
    ex.weeks.forEach(function (w, i) {
      w.included = (i === weekIndex);
      // Week 1 is the source, so it is never marked as edited.
      w.edited = (i === weekIndex && i > 0);
    });
  }
  workout.exercises.push(ex);
  // Open the settings panel on the new exercise, for per-week values and the rest.
  selected = { wi: program.workouts.indexOf(workout), exId: ex.id };
  panelOpenGroup = 0;
  panelOpenReps = null;
  changed();
}

/* ==========================================================================
   MODALS FOR FORMS
   ========================================================================== */

// A general dialog. `opts`: title, body (node), actions (array of buttons), wide.
// The keyboard focus stays inside the dialog: Tab goes from the last control back to the first.
// Escape closes the dialog. When it closes, the focus goes back to where it was before.
function openModal(opts) {
  closeModal();
  var before = document.activeElement;
  var modal = el('div', { className: 'modal' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', tabindex: '-1' }, [
    el('h2', { text: opts.title }),
    opts.body,
    el('div', { className: 'actions' }, opts.actions)
  ]);
  document.body.appendChild(el('div', { className: 'overlay', id: 'modal-overlay' }, [modal]));
  function onKey(e) {
    if (e.key === 'Escape') { closeModal(); return; }
    if (e.key !== 'Tab') return;
    var list = Array.prototype.filter.call(modal.querySelectorAll('button, input, select, textarea'), function (n) {
      return !n.disabled && n.offsetParent !== null;
    });
    if (list.length === 0) { e.preventDefault(); return; }
    var first = list[0];
    var last = list[list.length - 1];
    var at = document.activeElement;
    if (!modal.contains(at) || at === modal) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (e.shiftKey && at === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && at === last) { e.preventDefault(); first.focus(); }
  }
  document.addEventListener('keydown', onKey);
  openModalCleanup = function () {
    document.removeEventListener('keydown', onKey);
    if (before && before !== document.body && document.body.contains(before)) before.focus();
  };
  modal.focus();   // a dialog can then put the cursor in a box of its own
}

function formRow(labelText, control) {
  return el('div', { className: 'form-row' }, [el('label', { text: labelText }), control]);
}

function textInput(value, attrs) {
  var input = el('input', Object.assign({ type: 'text' }, attrs || {}));
  input.value = value;
  return input;
}

function selectBox(options, value) {
  var select = el('select');
  options.forEach(function (o) {
    select.appendChild(el('option', { value: o[0], text: o[1] }));
  });
  select.value = value;
  return select;
}

var LOAD_TYPE_OPTIONS = [['kg', 'kg'], ['pct', '% of 1RM'], ['rpe', 'RPE'], ['rir', 'RIR']];

function currentIsTemplate() {
  var entry = findEntry(currentId);
  return !!entry && entry.kind === 'template';
}

// The load types to offer. kg is offered everywhere, templates included (the user's main use case);
// kg is first and is the default.
function loadTypeChoices(currentType) {
  return LOAD_TYPE_OPTIONS.slice();
}

// No "unsaved changes" warning on closing the tab: every edit is saved to the library at once.

startUp();
</script>

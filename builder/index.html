/* ==========================================================================
   PROGRESSION PATTERNS (spec 5.9)
   Each set group has its own pattern: ex.patterns[k] belongs to Week 1's set group k.
   ========================================================================== */

var ADD_LIMIT = { kg: 100, pct: 50, rpe: 10, rir: 10 };     // largest change per week, up or down
var ADD_DEFAULT = { kg: 2.5, pct: 2.5, rpe: 1, rir: -1 };   // the amount "add" starts with
var PERCENT_LIMIT = 50;

function signedNum(n) { return (n > 0 ? '+' : '') + formatNum(n); }

// Reads a number that may be negative, accepting "," or "." and "-" or the minus sign.
// Returns NaN if the text is not a number.
function parseSigned(text) {
  var t = String(text).trim().replace(',', '.').replace('−', '-');
  if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
  return Number(t);
}

// The kind the panel shows for a pattern. Old files can hold "manual" (each week typed by hand);
// it acts as "same", because the week table now does that job.
function patternKind(p) {
  return (p.kind === 'add' || p.kind === 'percent') ? p.kind : 'same';
}

// A short text such as "+2.5% per week", or '' for a pattern that changes nothing.
function patternText(p) {
  if (p.kind === 'add' && p.amount !== 0) return signedNum(p.amount).replace('-', '−') + UNIT_SUFFIX[p.type] + ' per week';
  if (p.kind === 'percent') return '+' + formatNum(p.amount) + '% per week';
  return '';
}

// Gives set group k a new pattern. The weeks not edited by hand are calculated again.
function setPattern(ex, k, pattern) {
  ex.patterns[k] = pattern;
  ex.weeks = generateWeeks(ex, program.weeks);
  changed();
}

// The "Each week" row of a set group: how its load changes from week to week. A change applies at
// once. A percentage increase (kg loads only) has a second row that says how the result is rounded.
function progressionRows(ex, k) {
  var type = ex.weeks[0].groups[k].loadType;
  var p = ex.patterns[k];
  var kind = patternKind(p);
  var unit = UNIT_SUFFIX[type].trim();
  var name = ', set group ' + (k + 1);

  var options = [['same', 'no change'], ['add', 'add']];
  if (type === 'kg') options.push(['percent', 'add % of the load']);
  var select = selectBox(options, kind);
  select.setAttribute('aria-label', 'Change of the load each week' + name);
  select.setAttribute('data-fk', 'pk:' + k);
  select.addEventListener('change', function () {
    if (select.value === 'add') setPattern(ex, k, { kind: 'add', type: type, amount: ADD_DEFAULT[type] });
    else if (select.value === 'percent') setPattern(ex, k, { kind: 'percent', type: type, amount: 5, step: 2.5, mode: 'nearest' });
    else setPattern(ex, k, samePattern(type));
  });
  var kids = [select];
  if (kind === 'same') return [panelRow('Each week', kids)];

  var amount = textInput(formatNum(p.amount), { inputmode: 'decimal', 'aria-label': 'Amount each week' + name, 'data-fk': 'pa:' + k });
  amount.className = 'rest-input';
  amount.addEventListener('change', function () {
    var n = kind === 'percent' ? parseNumber(amount.value) : parseSigned(amount.value);
    var bad = n === null || isNaN(n) || (kind === 'percent' ? (n <= 0 || n > PERCENT_LIMIT) : Math.abs(n) > ADD_LIMIT[type]);
    if (bad) {
      showNotice(kind === 'percent'
        ? 'The percentage must be a number above 0, up to ' + PERCENT_LIMIT + '.'
        : 'The amount must be a number from -' + ADD_LIMIT[type] + ' to ' + ADD_LIMIT[type] + '.');
      amount.value = formatNum(p.amount);
      return;
    }
    if (n !== p.amount) setPattern(ex, k, Object.assign({}, p, { amount: n }));
  });
  kids.push(amount, el('span', { className: 'unit', text: kind === 'percent' ? '%' : unit }));
  var rows = [panelRow('Each week', kids)];

  if (kind === 'percent') {
    var mode = selectBox([['nearest', 'to the nearest'], ['up', 'up to'], ['down', 'down to']], p.mode || 'nearest');
    mode.setAttribute('aria-label', 'Rounding direction' + name);
    mode.setAttribute('data-fk', 'pm:' + k);
    mode.addEventListener('change', function () { setPattern(ex, k, Object.assign({}, p, { mode: mode.value })); });
    var step = textInput(formatNum(p.step || 2.5), { inputmode: 'decimal', 'aria-label': 'Round to kg' + name, 'data-fk': 'ps:' + k });
    step.className = 'rest-input';
    step.addEventListener('change', function () {
      var s = parseNumber(step.value);
      if (s === null || isNaN(s) || s <= 0 || s > 50) {
        showNotice('The rounding step must be a number above 0, up to 50.');
        step.value = formatNum(p.step || 2.5);
        return;
      }
      if (s !== p.step) setPattern(ex, k, Object.assign({}, p, { step: s }));
    });
    rows.push(panelRow('Round', [mode, step, el('span', { className: 'unit', text: 'kg' })]));
  }
  return rows;
}


/* ==========================================================================
   SUPERSETS AND REORDERING (spec 5.10)
   A superset pairs ONE SET GROUP of an exercise with one set group of another exercise in the
   same workout. The two groups have the same number of sets (one set of each per round).
   Exercise.supersets[k] holds a pair id for Week 1's set group k, or null.
   ========================================================================== */

function canMove(workout, ex, direction) {
  var target = workout.exercises.indexOf(ex) + direction;
  return target >= 0 && target < workout.exercises.length;
}

// Moves one exercise up or down. Paired set groups do not need to sit next to each other here;
// the AI places each pair side by side in the import file.
function moveExercise(workout, ex, direction) {
  if (!canMove(workout, ex, direction)) return;
  var from = workout.exercises.indexOf(ex);
  workout.exercises.splice(from, 1);
  workout.exercises.splice(from + direction, 0, ex);
  changed();
}

// Splits set group k into two groups in every week: the first keeps `firstSets` sets, the second
// gets the rest, with the same reps, load, rest and pattern. Used when the two groups to pair
// have different numbers of sets (e.g. Curls 6 sets -> 3 + 3).
function splitGroup(ex, k, firstSets) {
  ex.weeks.forEach(function (w) {
    var g = w.groups[k];
    if (!g) return;
    var copy = cloneGroup(g);
    if (g.sets > firstSets) {
      copy.sets = g.sets - firstSets;
      g.sets = firstSets;
    } else {
      copy.sets = 1; // only in an odd edited week that has fewer sets than Week 1
    }
    w.groups.splice(k + 1, 0, copy);
  });
  ex.patterns.splice(k + 1, 0, JSON.parse(JSON.stringify(ex.patterns[k])));
  ex.supersets.splice(k + 1, 0, null);
}

// Set groups of other exercises in the workout that are not paired yet: [{ ex, k }].
function freeGroupsOf(workout, ex) {
  var list = [];
  workout.exercises.forEach(function (o) {
    if (o === ex) return;
    o.supersets.forEach(function (s, k) { if (s === null) list.push({ ex: o, k: k }); });
  });
  return list;
}

// Pairs set group a.k of a.ex with b.k of b.ex. If their set counts differ, the larger group is
// split first. The later exercise in the workout adopts the earlier one's rest.
function pairGroups(workout, a, b) {
  var ga = a.ex.weeks[0].groups[a.k];
  var gb = b.ex.weeks[0].groups[b.k];
  if (ga.sets > gb.sets) splitGroup(a.ex, a.k, gb.sets);
  else if (gb.sets > ga.sets) splitGroup(b.ex, b.k, ga.sets);

  var id = makeId('ss');
  a.ex.supersets[a.k] = id;
  b.ex.supersets[b.k] = id;

  var aFirst = workout.exercises.indexOf(a.ex) < workout.exercises.indexOf(b.ex);
  var source = aFirst ? a : b;
  var target = aFirst ? b : a;
  target.ex.weeks[0].groups[target.k].rest = source.ex.weeks[0].groups[source.k].rest;
  target.ex.weeks = generateWeeks(target.ex, program.weeks);
  changed();
}

// Clears the pair of set group k; both exercises stay.
function unpairGroup(workout, ex, k) {
  var id = ex.supersets[k]; // read it first: clearing changes what we compare against
  pairMembers(workout, id).forEach(function (m) { m.ex.supersets[m.k] = null; });
  changed();
}

// After a week is edited, the partner of each paired set group gets the same sets and rest in
// that week (pairs always match). A later week that has to change is marked edited.
function syncPairs(workout, ex, weekIndex) {
  var regenerate = [];
  ex.supersets.forEach(function (id, k) {
    if (!id) return;
    var src = ex.weeks[weekIndex].groups[k];
    if (!src) return;
    pairMembers(workout, id).forEach(function (m) {
      if (m.ex === ex) return;
      var entry = m.ex.weeks[weekIndex];
      var dst = entry.groups[m.k];
      if (!dst || (dst.sets === src.sets && dst.rest === src.rest)) return;
      dst.sets = src.sets;
      dst.rest = src.rest;
      if (weekIndex === 0) { if (regenerate.indexOf(m.ex) < 0) regenerate.push(m.ex); }
      else entry.edited = true;
    });
  });
  regenerate.forEach(function (o) { o.weeks = generateWeeks(o, program.weeks); });
}

// "Superset with..." dialog for set group k of `ex`.
function openSupersetPicker(wi, ex, k) {
  var workout = program.workouts[wi];
  var free = freeGroupsOf(workout, ex);
  var mine = ex.weeks[0].groups[k];

  if (free.length === 0) {
    openModal({
      title: 'Superset',
      body: el('p', { text: 'No other exercise in this workout has a set group that is free to pair. Add another exercise first.' }),
      actions: [el('button', { text: 'Close', onclick: closeModal })]
    });
    return;
  }

  // Exercises that still have a free set group, nearest below first.
  var partners = [];
  free.forEach(function (f) { if (partners.indexOf(f.ex) < 0) partners.push(f.ex); });
  var myIndex = workout.exercises.indexOf(ex);
  var below = partners.filter(function (p) { return workout.exercises.indexOf(p) > myIndex; });
  var above = partners.filter(function (p) { return workout.exercises.indexOf(p) < myIndex; });
  var ordered = below.concat(above);

  var state = { partner: ordered[0], group: null };
  var partnerSelect = selectBox(ordered.map(function (p, i) { return [String(i), p.name]; }), '0');
  var groupsBox = el('div');
  var infoBox = el('div', { className: 'form-warning' });
  var confirmBtn = el('button', { className: 'primary', text: 'Superset' });

  function chooseDefaultGroup() {
    var options = free.filter(function (f) { return f.ex === state.partner; });
    var sameSets = options.filter(function (f) { return f.ex.weeks[0].groups[f.k].sets === mine.sets; });
    state.group = (sameSets[0] || options[0]).k;
  }

  function drawGroups() {
    groupsBox.textContent = '';
    free.filter(function (f) { return f.ex === state.partner; }).forEach(function (f) {
      var g = f.ex.weeks[0].groups[f.k];
      var radio = el('input', { type: 'radio', name: 'superset-group', value: String(f.k) });
      radio.checked = state.group === f.k;
      radio.addEventListener('change', function () { state.group = f.k; drawInfo(); });
      groupsBox.appendChild(el('label', { className: 'opt' }, [
        radio,
        el('span', { className: 'opt-label', text: 'Set group ' + (f.k + 1) + ': ' + setsRepsText(g) }),
        el('span', { className: 'opt-desc', text: describeLoad(g).text })
      ]));
    });
  }

  function drawInfo() {
    var theirs = state.partner.weeks[0].groups[state.group];
    var text;
    if (mine.sets === theirs.sets) {
      text = 'Pairs ' + mine.sets + (mine.sets === 1 ? ' set' : ' sets') + ' of each.';
    } else if (mine.sets > theirs.sets) {
      text = ex.name + ' set group ' + (k + 1) + ' has ' + mine.sets + ' sets. It will be split into '
        + theirs.sets + ' + ' + (mine.sets - theirs.sets) + ', and the first ' + theirs.sets + ' pair with ' + state.partner.name + '.';
    } else {
      text = state.partner.name + ' set group ' + (state.group + 1) + ' has ' + theirs.sets + ' sets. It will be split into '
        + mine.sets + ' + ' + (theirs.sets - mine.sets) + ', and the first ' + mine.sets + ' pair with ' + ex.name + '.';
    }
    infoBox.textContent = text;
    confirmBtn.textContent = mine.sets === theirs.sets ? 'Superset' : 'Split and superset';
  }

  partnerSelect.addEventListener('change', function () {
    state.partner = ordered[Number(partnerSelect.value)];
    chooseDefaultGroup();
    drawGroups();
    drawInfo();
  });
  confirmBtn.addEventListener('click', function () {
    closeModal();
    pairGroups(workout, { ex: ex, k: k }, { ex: state.partner, k: state.group });
  });

  chooseDefaultGroup();
  drawGroups();
  drawInfo();
  openModal({
    title: 'Superset',
    body: el('div', null, [
      el('div', { className: 'sub', text: ex.name + ' · set group ' + (k + 1) + ' (' + setsRepsText(mine) + ')' }),
      formRow('Superset with', partnerSelect),
      el('label', { className: 'pv-title', text: 'Which set group?' }),
      groupsBox,
      infoBox
    ]),
    actions: [el('button', { text: 'Cancel', onclick: closeModal }), confirmBtn]
  });
}

/* ==========================================================================
   EXERCISE SETTINGS PANEL
   Docked to the right of the grid. It shows the settings of the selected exercise: one section per
   set group (load type, progression, a week table, rest, target, superset), notes, and the actions
   (add or delete a set group, move, delete). The panel is the only place to change an exercise:
   a value in the Week 1 row goes to all weeks, a value in a later row changes that week only.
   One set group is open at a time. The cross closes the panel; a click on any exercise in the
   grid opens it again.
   ========================================================================== */

// A labelled row in the panel: label on the left, a control on the right.
function panelRow(labelText, children) {
  return el('div', { className: 'pr' }, [el('label', { text: labelText })].concat(children));
}

function restRow(workout, ex, r) {
  var g = ex.weeks[0].groups[r];
  var input = textInput(formatNum(g.rest / 60), { inputmode: 'decimal', 'aria-label': 'Rest in minutes, set group ' + (r + 1) });
  input.className = 'rest-input';
  input.addEventListener('change', function () {
    var min = parseNumber(input.value);
    if (min === null || isNaN(min) || min > 60) {
      input.value = formatNum(g.rest / 60); // invalid: put the old value back
      return;
    }
    setGroupRest(workout, ex, r, Math.round(min * 60));
  });
  return panelRow('Rest', [input, el('span', { className: 'unit', text: 'min' })]);
}

// Who set group r is paired with and a Remove link, or a "Superset with…" link.
function supersetRow(workout, wi, ex, r) {
  var id = ex.supersets[r];
  var partner = null;
  if (id) pairMembers(workout, id).forEach(function (m) { if (m.ex !== ex) partner = m; });
  if (partner) {
    var pg = partner.ex.weeks[0].groups[partner.k];
    var many = partner.ex.weeks[0].groups.length > 1;
    return panelRow('Superset', [
      el('span', { text: 'With ' + partner.ex.name + (many ? ' (group ' + (partner.k + 1) + ')' : '') + ', ' + setsRepsText(pg) }),
      el('button', { className: 'link-btn', text: 'Remove', onclick: function () { unpairGroup(workout, ex, r); } })
    ]);
  }
  var none = freeGroupsOf(workout, ex).length === 0;
  var btn = el('button', {
    className: 'link-btn acc', text: 'Superset with…',
    title: none ? 'No other exercise in this workout has a free set group' : 'Pair this set group with a set group of another exercise',
    onclick: function () { openSupersetPicker(wi, ex, r); }
  });
  if (none) btn.disabled = true;
  return panelRow('Superset', [btn]);
}

// Changes fields of set group k for all weeks: Week 1 is the source and the other weeks follow.
function setGroupFields(ex, k, changes) {
  ex.weeks = withSourceFields(ex, k, changes, program.weeks);
  changed();
}

// Changes fields of set group k in one week. In Week 1 the change goes to all weeks. In a later week
// it is a change by hand for that week only. A superset partner keeps the same number of sets.
function setWeekFields(workout, ex, w, k, changes) {
  if (w === 0) {
    ex.weeks = withSourceFields(ex, k, changes, program.weeks);
  } else {
    var g = ex.weeks[w].groups[k];
    Object.keys(changes).forEach(function (key) { g[key] = changes[key]; });
    settleEditedWeek(ex, w);
    ex.weeks = generateWeeks(ex, program.weeks);
  }
  syncPairs(workout, ex, w);
  changed();
}

// Adds a set group to every week. It starts as a copy of the last group, with a blank load.
function addSetGroup(ex) {
  var count = ex.weeks[0].groups.length;
  var last = ex.weeks[0].groups[count - 1];
  var g = newGroup();
  g.sets = last.sets; g.reps = last.reps; g.loadType = last.loadType; g.rest = last.rest;
  ex.weeks.forEach(function (w) { if (w.groups.length === count) w.groups.push(cloneGroup(g)); });
  ex.patterns.push(samePattern(g.loadType));
  ex.supersets.push(null);
  ex.weeks = generateWeeks(ex, program.weeks);
  panelOpenGroup = count;
  changed();
}

// Deletes set group k from every week (after a confirmation). Its superset partner is unpaired.
function confirmDeleteSetGroup(workout, ex, k) {
  showConfirm({
    title: 'Delete set group ' + (k + 1) + '?',
    text: 'It will be removed from every week of ' + ex.name + '.',
    confirmLabel: 'Delete',
    onConfirm: function () {
      var count = ex.weeks[0].groups.length;
      ex.weeks.forEach(function (w) { if (w.groups.length === count) w.groups.splice(k, 1); });
      ex.patterns.splice(k, 1);
      ex.supersets.splice(k, 1);
      ex.weeks = generateWeeks(ex, program.weeks);
      purgeBrokenPairs(workout);
      panelOpenGroup = Math.max(0, Math.min(panelOpenGroup, count - 2));
      changed();
    }
  });
}

// Which effort target (RPE or RIR) the panel shows for a set group while its number is blank.
var targetModeMemory = {};

// The effort target: an RPE | RIR switch and a number. Not shown when the group's load is an RPE.
function targetRow(ex, r) {
  var g = ex.weeks[0].groups[r];
  if (!hasEffortTarget(g.loadType, g.rpe !== null || g.rir !== null)) return null;
  var key = ex.id + ':' + r;
  var mode = g.rir !== null ? 'rir' : (g.rpe !== null ? 'rpe' : (targetModeMemory[key] || 'rpe'));
  var seg = el('div', { className: 'segmented' }, ['rpe', 'rir'].map(function (m) {
    return el('button', {
      className: m === mode ? 'on' : null, text: m.toUpperCase(),
      onclick: function () {
        if (m === mode) return;
        targetModeMemory[key] = m;
        setGroupFields(ex, r, { rpe: null, rir: null });   // the number is not carried over: RPE 8 is not RIR 8
      }
    });
  }));
  var value = mode === 'rir' ? g.rir : g.rpe;
  var input = textInput(value === null ? '' : formatNum(value), { inputmode: 'decimal', 'aria-label': 'Target ' + mode.toUpperCase() + ', set group ' + (r + 1), placeholder: '–' });
  input.addEventListener('change', function () {
    var target = readEffortTarget(input.value, mode.toUpperCase());
    if (target.error) { showNotice(target.error); input.value = value === null ? '' : formatNum(value); return; }
    setGroupFields(ex, r, mode === 'rir' ? { rir: target.value, rpe: null } : { rpe: target.value, rir: null });
  });
  return panelRow('Target', [el('div', { className: 'tgt' }, [seg, input])]);
}

// Optional fields (Set type, Tempo, Pause) stay hidden until chosen with a "+ Tempo" style button.
// A field that already holds a value is always shown. `shownOptional` is screen state, not saved.
var shownOptional = {};   // 'exerciseId:setGroup:field' -> true
var OPTIONAL_FIELDS = ['setType', 'tempo', 'pause'];
var OPTIONAL_LABELS = { setType: 'Set type', tempo: 'Tempo', pause: 'Pause' };

function optionalKey(ex, r, name) { return ex.id + ':' + r + ':' + name; }

function optionalUsed(ex, r, name, g) {
  return !!shownOptional[optionalKey(ex, r, name)] || (name === 'pause' ? g.pause !== null : !!g[name]);
}

// The row of one optional field, with a cross that clears and hides it.
function optionalRow(ex, r, name, control) {
  var remove = iconButton('close', 'Remove ' + OPTIONAL_LABELS[name], function () {
    delete shownOptional[optionalKey(ex, r, name)];
    var patch = {}; patch[name] = null;
    setGroupFields(ex, r, patch);
  });
  return panelRow(OPTIONAL_LABELS[name], [control, remove]);
}

function setTypeControl(ex, r, g) {
  var select = selectBox([['', 'Choose…']].concat(SET_TYPES.map(function (t) { return [t, SET_TYPE_LABELS[t]]; })), g.setType || '');
  select.setAttribute('aria-label', 'Set type, set group ' + (r + 1));
  select.addEventListener('change', function () { setGroupFields(ex, r, { setType: select.value === '' ? null : select.value }); });
  return select;
}

function tempoControl(ex, r, g) {
  var input = textInput(g.tempo || '', { maxlength: '12', placeholder: '3-1-1-0', 'aria-label': 'Tempo, set group ' + (r + 1) });
  input.className = 'tempo-input';
  input.addEventListener('change', function () {
    var text = input.value.trim();
    if (text.length > 12) { showNotice('Tempo can have at most 12 characters.'); input.value = g.tempo || ''; return; }
    setGroupFields(ex, r, { tempo: text === '' ? null : text });
  });
  return input;
}

function pauseControl(ex, r, g) {
  var input = textInput(g.pause === null ? '' : String(g.pause), { inputmode: 'numeric', placeholder: '–', 'aria-label': 'Pause in seconds, set group ' + (r + 1) });
  input.className = 'rest-input';
  input.addEventListener('change', function () {
    var text = input.value.trim();
    var n = text === '' ? null : parseWhole(text, 0, 30);
    if (n !== null && isNaN(n)) { showNotice('Pause must be a whole number of seconds from 0 to 30.'); input.value = g.pause === null ? '' : String(g.pause); return; }
    setGroupFields(ex, r, { pause: n });
  });
  return input;
}

var OPTIONAL_CONTROLS = { setType: setTypeControl, tempo: tempoControl, pause: pauseControl };

// A load typed for one week of one set group. Week 1 is the source (the weeks not edited follow).
// Any other week becomes edited by hand, unless the typed load is the progression value again.
function setWeekLoad(ex, w, k, text) {
  var grp = ex.weeks[w].groups[k];
  var res = readLoad(text, grp.loadType);
  if (res.error) { showNotice(res.error); render(); return; }
  if (res.value === grp.load) return;
  grp.load = res.value;
  grp.kg = null;                      // a changed load clears its calculated kg
  if (w > 0) settleEditedWeek(ex, w);
  ex.weeks = generateWeeks(ex, program.weeks);
  changed();
}

// Where the keyboard or the mouse was going when a typed value redrew the panel. renderDetail uses
// it to put the cursor in the correct box afterwards, so Tab and Enter work down the week table.
// { fk: the data-fk name of a box, dir: 1 (Tab), -1 (Shift+Tab) or 0 (that box itself), time }
var panelIntent = null;

function watchPanelIntent(box) {
  function fkOf(node) {
    var t = node && node.closest ? node.closest('[data-fk]') : null;
    return t ? t.getAttribute('data-fk') : null;
  }
  box.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' && e.key !== 'Enter') return;
    var fk = fkOf(e.target);
    panelIntent = fk ? { fk: fk, dir: e.key === 'Tab' ? (e.shiftKey ? -1 : 1) : 0, time: Date.now() } : null;
  });
  box.addEventListener('mousedown', function (e) {
    var fk = fkOf(e.target);
    panelIntent = fk ? { fk: fk, dir: 0, time: Date.now() } : null;
  });
}

function restorePanelFocus(box, intent) {
  var target = box.querySelector('[data-fk="' + intent.fk + '"]');
  if (!target) return;
  if (intent.dir !== 0) {
    var list = Array.prototype.filter.call(box.querySelectorAll('input, select, textarea, button'), function (n) { return !n.disabled; });
    target = list[list.indexOf(target) + intent.dir] || target;
  }
  target.focus();
  if (target.tagName === 'INPUT') target.select();
}

// A small text box of the week table. `fk` names it, so the cursor can return after a redraw.
function weekInput(value, cls, fk, label, onChange) {
  var input = textInput(value, { inputmode: 'decimal', 'aria-label': label, 'data-fk': fk });
  input.className = cls;
  input.addEventListener('change', function () { onChange(input); });
  return input;
}

// The "sets × reps" cell of one week. Week 1 always shows boxes. A later week shows the value as
// text until it is clicked or differs from the progression value; then it shows boxes too.
function repsCell(workout, ex, k, w, grp, fresh) {
  var name = 'Week ' + (w + 1) + ', set group ' + (k + 1);
  var over = w > 0 && (!fresh || fresh.sets !== grp.sets || fresh.reps !== grp.reps || fresh.repsMax !== grp.repsMax);
  var key = k + ':' + w;
  if (w > 0 && !over && panelOpenReps !== key) {
    return el('td', null, [el('button', {
      className: 'sr-btn', text: setsRepsText(grp), title: 'Change the sets or reps of Week ' + (w + 1) + ' only',
      'aria-label': 'Sets and reps, ' + name + ': ' + setsRepsText(grp) + '. Change for this week only',
      onclick: function () {
        panelOpenReps = key;
        panelIntent = { fk: 's:' + key, dir: 0, time: Date.now() };
        render();
      }
    })]);
  }
  var cls = over ? ' over' : '';
  var sets = weekInput(String(grp.sets), 'w-sets' + cls, 's:' + key, 'Sets, ' + name, function (input) {
    var n = parseWhole(input.value, 1, 99);
    if (isNaN(n)) { showNotice('Sets must be a whole number from 1 to 99.'); input.value = String(grp.sets); return; }
    if (n !== grp.sets) setWeekFields(workout, ex, w, k, { sets: n });
  });
  var reps = weekInput(repsText(grp), 'w-reps' + cls, 'r:' + key, 'Reps (a number, or a range such as 8-10), ' + name, function (input) {
    var res = readReps(input.value);
    if (res.error) { showNotice(res.error); input.value = repsText(grp); return; }
    if (res.reps !== grp.reps || res.repsMax !== grp.repsMax) setWeekFields(workout, ex, w, k, { reps: res.reps, repsMax: res.repsMax });
  });
  reps.setAttribute('inputmode', 'text');
  reps.title = 'A number, or a range such as 8-10';
  return el('td', null, [sets, el('span', { className: 'unit', text: '× ' }), reps]);
}

// The week table of one set group: a row per week with sets × reps, the load and the kg. Week 1 and
// the progression fill the other weeks. A value typed into a later week changes that week only: its
// box gets a green edge, and the arrow at the end of the row puts the week back.
function renderWeekTable(workout, ex, k) {
  var fresh = patternWeeks(ex);
  var type = ex.weeks[0].groups[k].loadType;
  var unit = type === 'pct' ? '%' : LOAD_LABELS[type];
  // The kg column is for loads that are not typed in kg, once an athlete's maxes gave them a kg value.
  var showKg = type !== 'kg' && ex.weeks.some(function (w) { return w.included && !!w.groups[k] && w.groups[k].kg !== null; });
  var head = [el('th', { text: 'Week' }), el('th', { text: 'Sets × reps' }), el('th', { text: 'Load' })];
  if (showKg) head.push(el('th', { className: 'kg', text: 'kg' }));
  head.push(el('th'));
  var body = el('tbody');
  ex.weeks.forEach(function (entry, w) {
    var label = el('td', { className: 'k' }, [el('span', { text: String(w + 1) })]);
    var flag = program.weekFlags[w];
    if (flag) label.appendChild(el('span', { className: 'flag', text: flag === 'comp' ? 'Comp' : WEEK_FLAG_LABELS[flag] }));
    var row = el('tr', null, [label]);
    var grp = entry.groups[k];
    if ((!entry.included && w > 0) || !grp) {
      row.appendChild(el('td', { className: 'k', colspan: String(head.length - 1), text: grp ? 'Not in this week' : 'No set group ' + (k + 1) + ' in this week' }));
      body.appendChild(row);
      return;
    }
    var f = fresh[w].groups[k];
    row.appendChild(repsCell(workout, ex, k, w, grp, f));
    var planned = plannedChange(ex.patterns[k] || samePattern(grp.loadType), w, grp, entry).trim();
    var load = weekInput(grp.load === null ? '' : formatNum(grp.load), 'w-load' + (w > 0 && (!f || f.load !== grp.load) ? ' over' : ''),
      'l:' + k + ':' + w, 'Load in ' + unit + ', Week ' + (w + 1) + ', set group ' + (k + 1),
      function (input) { setWeekLoad(ex, w, k, input.value); });
    load.placeholder = planned || '–';
    row.appendChild(el('td', null, [load, el('span', { className: 'unit', text: unit })]));
    if (showKg) row.appendChild(el('td', { className: 'kg', text: grp.kg === null ? '' : formatNum(grp.kg) }));
    var last = el('td');
    if (entry.edited && w > 0) {
      var reset = iconButton('reset', 'Use the Week 1 and progression values again for Week ' + (w + 1), function () {
        entry.edited = false; panelOpenReps = null; ex.weeks = generateWeeks(ex, program.weeks); changed();
      });
      reset.className += ' reset-btn';
      last.appendChild(reset);
    }
    row.appendChild(last);
    body.appendChild(row);
  });
  return el('table', { className: 'wk' }, [el('thead', null, [el('tr', null, head)]), body]);
}

// One line that says what a folded set group holds, such as "4 × 5 · 70% · +2.5% per week".
function groupSummary(ex, k) {
  var g = ex.weeks[0].groups[k];
  var parts = [setsRepsText(g)];
  if (g.load !== null) parts.push(describeLoad(g).text);
  if (patternText(ex.patterns[k])) parts.push(patternText(ex.patterns[k]));
  return parts.join(' · ');
}

function setBadge(g) {
  return g.setType ? el('span', { className: 'set-badge' + (g.setType === 'top' ? ' strong' : ''), text: SET_TYPE_BADGES[g.setType] }) : null;
}

function renderSetGroupSection(workout, wi, ex, r, isLast) {
  var g = ex.weeks[0].groups[r];
  var count = ex.weeks[0].groups.length;
  var parts;
  if (count > 1 && r !== panelOpenGroup) {
    // Folded: one line. A click opens this set group and folds the other.
    parts = [el('button', {
      className: 'ps-fold', title: 'Show set group ' + (r + 1), 'aria-expanded': 'false',
      onclick: function () { panelOpenGroup = r; panelOpenReps = null; render(); }
    }, [el('b', { text: 'Set group ' + (r + 1) }), setBadge(g), el('span', { className: 'sum', text: groupSummary(ex, r) }), icon('down')].filter(Boolean))];
  } else {
    var head = [el('b', { text: 'Set group ' + (r + 1) }), setBadge(g)];
    if (count > 1) {
      head.push(el('button', {
        className: 'link-btn', text: 'Delete', title: 'Delete set group ' + (r + 1) + ' from every week',
        onclick: function () { confirmDeleteSetGroup(workout, ex, r); }
      }));
    }
    parts = [
      el('div', { className: 'ps-head' }, head.filter(Boolean)),
      panelRow('Load in', [loadTypeControl(ex, r)])
    ].concat(progressionRows(ex, r), [
      renderWeekTable(workout, ex, r),
      restRow(workout, ex, r),
      targetRow(ex, r)
    ]);
    var chips = [];
    OPTIONAL_FIELDS.forEach(function (name) {
      if (optionalUsed(ex, r, name, g)) {
        parts.push(optionalRow(ex, r, name, OPTIONAL_CONTROLS[name](ex, r, g)));
      } else {
        chips.push(el('button', {
          className: 'link-btn acc', text: '+ ' + OPTIONAL_LABELS[name],
          onclick: function () { shownOptional[optionalKey(ex, r, name)] = true; render(); }
        }));
      }
    });
    if (chips.length > 0) parts.push(el('div', { className: 'opt-add' }, chips));
    parts.push(supersetRow(workout, wi, ex, r));
  }
  var section = [el('div', { className: 'ps' }, parts.filter(Boolean))];
  if (isLast) {
    var add = el('button', {
      className: 'link-btn acc', text: '+ Add set group', title: 'Add another set group to this exercise, in every week',
      onclick: function () { addSetGroup(ex); }
    });
    if (count >= 20) { add.disabled = true; add.title = 'An exercise can have at most 20 set groups'; }
    section.push(el('div', { className: 'ps' }, [add]));
  }
  return section;
}

// "In weeks": one on/off button per week. It takes the exercise out of a week or puts it back.
function inWeeksRow(workout, ex) {
  return panelRow('In weeks', [el('div', { className: 'in-weeks' }, ex.weeks.map(function (entry, w) {
    var text = (entry.included ? 'Remove from' : 'Add to') + ' Week ' + (w + 1);
    return el('button', {
      className: entry.included ? 'on' : null, text: String(w + 1), title: text, 'aria-label': text,
      'aria-pressed': entry.included ? 'true' : 'false',
      onclick: function () { if (entry.included) removeFromWeek(workout, ex, w); else addToWeek(ex, w); }
    });
  }))]);
}

function renderDetail() {
  var box = document.getElementById('detail');
  var scrollTop = box.scrollTop;
  var found = findSelected();
  if (!found) {
    selected = null;
    box.hidden = true;
    box.textContent = '';
    return;
  }
  var wi = selected.wi;
  var workout = found.workout;
  var ex = found.ex;
  if (!box.watched) { watchPanelIntent(box); box.watched = true; }
  box.hidden = false;
  box.textContent = '';

  var up = iconButton('arrow-up', 'Move up in the workout', function () { moveExercise(workout, ex, -1); });
  var down = iconButton('arrow-down', 'Move down in the workout', function () { moveExercise(workout, ex, 1); });
  if (!canMove(workout, ex, -1)) { up.disabled = true; up.title = 'Already first in the workout'; }
  if (!canMove(workout, ex, 1)) { down.disabled = true; down.title = 'Already last in the workout'; }
  box.appendChild(el('div', { className: 'ph' }, [
    el('div', { className: 't' }, [
      el('b', { text: ex.name }),
      el('span', { text: 'Workout ' + (wi + 1) + (workout.description ? ' · ' + workout.description : '') })
    ]),
    el('div', { className: 'ph-acts' }, [up, down]),
    iconButton('close', 'Close the exercise settings', closeDetail)
  ]));
  box.appendChild(el('div', { className: 'ps' }, [inWeeksRow(workout, ex)]));

  var count = ex.weeks[0].groups.length;
  if (panelOpenGroup >= count) panelOpenGroup = 0;
  ex.weeks[0].groups.forEach(function (g, r) {
    renderSetGroupSection(workout, wi, ex, r, r === count - 1).forEach(function (node) { box.appendChild(node); });
  });

  var notes = el('textarea', { maxlength: '500', 'aria-label': 'Notes for ' + ex.name, placeholder: 'Notes for this exercise' });
  notes.value = ex.notes;
  notes.addEventListener('input', function () {
    ex.notes = notes.value;
    changedQuietly();
  });
  box.appendChild(el('div', { className: 'ps' }, [el('div', { className: 'ps-head' }, [el('b', { text: 'Notes' })]), notes]));

  box.appendChild(el('div', { className: 'panel-acts' }, [
    el('button', { className: 'link-btn danger-link', text: 'Delete exercise', onclick: function () { confirmDeleteExercise(workout, ex); } })
  ]));
  box.scrollTop = scrollTop;

  // Put the cursor back where the user was going (see panelIntent).
  var intent = panelIntent;
  panelIntent = null;
  if (intent && Date.now() - intent.time < 250) setTimeout(function () { restorePanelFocus(box, intent); }, 0);
}

// A workout is "removed" from a week when it has exercises but none are included in that week.
function workoutRemovedInWeek(workout, weekIndex) {
  return workout.exercises.length > 0 && workout.exercises.every(function (ex) { return !ex.weeks[weekIndex].included; });
}

// The rows of one workout in the grid. They are the same in every week, so exercises line up across
// the weeks: a week with an extra set group (or without an exercise) leaves a gap in the other weeks
// instead of pushing everything below it out of line. A slot is one exercise's run of set groups, or
// two set groups paired in a superset (the partner follows straight after, as in GymLog).
// Returns [{ type: 'run', ex, ks: [set group numbers] } | { type: 'pair', members: [{ ex, k }, { ex, k }] }].
function workoutSlots(workout) {
  var slots = [];
  var placed = {};
  workout.exercises.forEach(function (ex) {
    var most = 0;
    ex.weeks.forEach(function (w) { if (w.groups.length > most) most = w.groups.length; });
    var run = null;
    for (var k = 0; k < most; k++) {
      if (placed[ex.id + ':' + k]) continue;
      var id = ex.supersets[k];
      var members = id ? pairMembers(workout, id) : [];
      if (members.length === 2) {
        placed[members[0].ex.id + ':' + members[0].k] = true;
        placed[members[1].ex.id + ':' + members[1].k] = true;
        slots.push({ type: 'pair', members: members });
        run = null;
      } else {
        if (!run) { run = { type: 'run', ex: ex, ks: [] }; slots.push(run); }
        run.ks.push(k);
      }
    }
  });
  return slots;
}

// The flag control at the right of a week heading: a grey flag icon. Clicking it opens a small menu
// (None, Deload, Test, Competition). A flagged week shows its flag name and icon in the flag's colour.
function weekFlagButton(week) {
  var current = program.weekFlags[week];
  var label = current ? WEEK_FLAG_LABELS[current] : 'None';
  // A flagged week shows just its name (in the flag's colour); the grey flag icon is only for unflagged weeks.
  var children = [current
    ? el('span', { className: 'flag-name', text: label })
    : icon('flag')];
  var btn = el('button', {
    className: 'flag-btn' + (current ? ' flag-' + current : ''),
    title: 'Flag this week (now: ' + label + ')', 'aria-label': 'Flag for Week ' + (week + 1) + ': ' + label,
    'aria-haspopup': 'menu'
  }, children);
  btn.addEventListener('click', function () {
    var items = [[null, 'None']].concat(WEEK_FLAGS.map(function (f) { return [f, WEEK_FLAG_LABELS[f]]; }));
    openMenu(btn, items.map(function (item) {
      return {
        text: item[1], cls: item[0] ? 'flag-' + item[0] : '', on: item[0] === current,
        onClick: function () { program.weekFlags[week] = item[0]; changed(); }
      };
    }));
  });
  return btn;
}

/* ---- Menus: a small list of actions that opens below a button ---- */

var menuCleanup = null;

function closeMenu() {
  var menu = document.getElementById('menu');
  if (menu) menu.remove();
  if (menuCleanup) { menuCleanup(); menuCleanup = null; }
}

// Opens a menu below `anchor` (above it when there is no room below), with its right edge under the
// anchor. `items`: [{ text, onClick, cls (optional class), on (optional: the current choice) }].
// The arrow keys move through the items, Escape closes the menu, a click outside closes it too.
function openMenu(anchor, items) {
  closeMenu();
  var menu = el('div', { id: 'menu', className: 'menu', role: 'menu' }, items.map(function (item) {
    return el('button', {
      className: 'menu-item' + (item.cls ? ' ' + item.cls : '') + (item.on ? ' on' : ''),
      role: 'menuitem', text: item.text,
      onclick: function () { closeMenu(); item.onClick(); }
    });
  }));
  document.body.appendChild(menu);
  var box = anchor.getBoundingClientRect();
  var top = box.bottom + 4;
  if (top + menu.offsetHeight > window.innerHeight - 8) top = Math.max(8, box.top - 4 - menu.offsetHeight);
  menu.style.top = top + 'px';
  menu.style.left = Math.max(8, box.right - menu.offsetWidth) + 'px';
  menu.firstChild.focus();
  function onDown(e) { if (!menu.contains(e.target) && !anchor.contains(e.target)) closeMenu(); }
  function onKey(e) {
    if (e.key === 'Escape') { closeMenu(); anchor.focus(); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    var list = Array.prototype.slice.call(menu.children);
    var at = list.indexOf(document.activeElement) + (e.key === 'ArrowDown' ? 1 : -1);
    list[(at + list.length) % list.length].focus();
  }
  document.addEventListener('mousedown', onDown, true);
  document.addEventListener('keydown', onKey);
  menuCleanup = function () {
    document.removeEventListener('mousedown', onDown, true);
    document.removeEventListener('keydown', onKey);
  };
}

// A "more actions" button (three dots) that opens a menu. `getItems` is called when it opens.
function menuButton(label, getItems) {
  var btn = iconButton('more', label, function (e) {
    e.stopPropagation();   // a row that opens on a click must not open
    if (document.getElementById('menu')) { closeMenu(); return; }
    openMenu(btn, getItems());
  });
  btn.setAttribute('aria-haspopup', 'menu');
  return btn;
}

// Makes a row that is not a real button work as one with the keyboard: Enter or Space clicks it.
function keyClick(node) {
  node.addEventListener('keydown', function (e) {
    if (e.target !== node || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault();
    node.click();
  });
  return node;
}

// One cell of the grid: what one slot looks like in one week. It is left blank where the exercise
// is not in that week (or has fewer set groups); clicking a blank cell still selects the exercise,
// so its settings panel can add it back.
function renderSlotCell(workout, wi, week, slot, isFirstWeek) {
  var td = el('td', { className: 'cell' + (isFirstWeek ? ' c0' : '') });
  var labels = supersetLabels(workout, week);
  function boxFor(ex, ks) {
    var entry = ex.weeks[week];
    if (!entry.included) return null;
    var entries = ks.filter(function (k) { return !!entry.groups[k]; }).map(function (k) {
      return { k: k, label: labels[ex.id + ':' + k] };
    });
    return entries.length > 0 ? renderBox(ex, wi, week, entries) : null;
  }
  if (slot.type === 'run') {
    var box = boxFor(slot.ex, slot.ks);
    if (box) td.appendChild(box);
    else td.addEventListener('click', function () { selectExercise(wi, slot.ex.id); });
    if (selected !== null && selected.exId === slot.ex.id) td.className += ' sel';
    return td;
  }
  var a = boxFor(slot.members[0].ex, [slot.members[0].k]);
  var b = boxFor(slot.members[1].ex, [slot.members[1].k]);
  var active = labels[slot.members[0].ex.id + ':' + slot.members[0].k] !== undefined;
  if (active) {
    td.appendChild(el('div', { className: 'ss-block' }, [a, b]));   // both are there: one frame
  } else {
    if (a) td.appendChild(a);
    if (b) td.appendChild(b);
  }
  return td;
}

/* ---- Add exercise: a search box at the foot of each workout ---- */

var addMenuCleanup = null;
var addFocusWorkout = null;   // after an exercise is added: the workout whose box gets the cursor again

function closeAddMenu() {
  var menu = document.getElementById('add-menu');
  if (menu) menu.remove();
  if (addMenuCleanup) { addMenuCleanup(); addMenuCleanup = null; }
}

// The search box. Typing shows the matching names of the Exercise List in a menu below the box; the
// last line of the menu creates a new exercise with the typed name. Enter (or a click) adds the
// exercise to every week with default settings (3 x 10, kg, blank load, 90 s rest) and the settings
// panel opens on it. The cursor stays in the box, so several exercises can be added in a row.
function addExerciseBox(workout, wi) {
  var input = textInput('', {
    maxlength: '200', placeholder: 'Add exercise…', autocomplete: 'off', 'data-wi': String(wi),
    title: 'Type to search the Exercise List. Press Enter to add the exercise to every week.',
    'aria-label': 'Add exercise to Workout ' + (wi + 1) + '. Type to search, press Enter to add'
  });
  input.className = 'add-input';
  var items = [];    // the menu lines: { name, create }
  var active = -1;   // the highlighted line, or -1

  function add(item) {
    closeAddMenu();
    addFocusWorkout = wi;
    createExercise(workout, { name: item.create ? addToExerciseList(item.name) : item.name, groups: [newGroup()], notes: '' }, null);
  }

  function highlight() {
    var menu = document.getElementById('add-menu');
    if (!menu) return;
    Array.prototype.forEach.call(menu.children, function (b, i) { b.className = 'menu-item add-item' + (i === active ? ' on' : ''); });
    if (active >= 0) menu.children[active].scrollIntoView({ block: 'nearest' });
  }

  function draw() {
    closeAddMenu();
    var query = input.value.trim();
    var list = loadExerciseList();
    items = matchExercises(list, query).map(function (n) { return { name: n, create: false }; });
    var exact = list.some(function (n) { return n.toLowerCase() === query.toLowerCase(); });
    if (query !== '' && !exact) items.push({ name: query, create: true });
    active = query === '' ? -1 : 0;
    if (items.length === 0) return;
    var menu = el('div', { id: 'add-menu', className: 'menu add-menu', role: 'listbox' }, items.map(function (item) {
      return el('button', {
        role: 'option', tabindex: '-1', text: item.create ? 'Create "' + item.name + '"' : item.name,
        onclick: function () { add(item); }
      });
    }));
    menu.addEventListener('mousedown', function (e) { e.preventDefault(); });   // the cursor stays in the box
    document.body.appendChild(menu);
    highlight();
    // Below the box, or above it when there is little room below.
    var box = input.getBoundingClientRect();
    var below = window.innerHeight - box.bottom - 12;
    menu.style.left = box.left + 'px';
    menu.style.minWidth = box.width + 'px';
    if (below < 160 && box.top > below) {
      menu.style.bottom = (window.innerHeight - box.top + 4) + 'px';
      menu.style.maxHeight = Math.min(320, box.top - 12) + 'px';
    } else {
      menu.style.top = (box.bottom + 4) + 'px';
      menu.style.maxHeight = Math.min(320, below) + 'px';
    }
    // The menu does not move with the page, so it closes when the grid scrolls.
    function onScroll(e) { if (e.target !== menu) closeAddMenu(); }
    document.addEventListener('scroll', onScroll, true);
    addMenuCleanup = function () { document.removeEventListener('scroll', onScroll, true); };
  }

  function move(delta) {
    if (!document.getElementById('add-menu')) { draw(); return; }
    active = active < 0 ? (delta > 0 ? 0 : items.length - 1) : (active + delta + items.length) % items.length;
    highlight();
  }

  input.addEventListener('input', draw);
  input.addEventListener('click', function () { if (!document.getElementById('add-menu')) draw(); });
  input.addEventListener('blur', closeAddMenu);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Escape') { closeAddMenu(); input.value = ''; }
    else if (e.key === 'Enter') {
      if (!document.getElementById('add-menu')) draw();
      if (active >= 0) add(items[active]);
    }
  });
  return input;
}

// The foot of a workout in one week: remove the whole workout from the week. The first week that
// shows the workout also holds the Add exercise box (`withAdd`).
function renderFootCell(workout, wi, week, withAdd) {
  var foot = [];
  if (withAdd) foot.push(addExerciseBox(workout, wi));
  if (workout.exercises.length > 0) {
    foot.push(el('button', {
      className: 'link-btn', text: 'Remove from week',
      onclick: function () { confirmRemoveWorkoutFromWeek(workout, wi, week); }
    }));
  }
  return el('td', { className: 'cell' + (week === 0 ? ' c0' : '') }, [el('div', { className: 'cell-foot' }, foot)]);
}

function renderGrid() {
  var grid = document.getElementById('grid');
  closeAddMenu();
  grid.textContent = '';

  var headRow = el('tr');
  for (var w = 0; w < program.weeks; w++) {
    headRow.appendChild(el('th', { className: 'week-col' }, [
      el('div', { className: 'th-in' }, [el('span', { text: 'Week ' + (w + 1) }), weekFlagButton(w)])
    ]));
  }

  var body = el('tbody');
  program.workouts.forEach(function (workout, wi) {
    var descInput = el('input', {
      type: 'text', className: 'workout-desc', placeholder: 'Add a description',
      'aria-label': 'Description for Workout ' + (wi + 1), maxlength: '500'
    });
    descInput.value = workout.description;
    descInput.addEventListener('input', function () {
      workout.description = descInput.value;
      changedQuietly();
    });

    // One full-width band per workout: title and description, with the exercises under it.
    body.appendChild(el('tr', { className: 'band-row' }, [
      el('td', { colspan: String(program.weeks) }, [
        el('div', { className: 'band' }, [
          el('span', { className: 't', text: 'Workout ' + (wi + 1) }),
          descInput
        ])
      ])
    ]));

    var slots = workoutSlots(workout);
    var removed = [];
    for (var week = 0; week < program.weeks; week++) removed.push(workoutRemovedInWeek(workout, week));

    slots.forEach(function (slot, i) {
      var row = el('tr', { className: 'slot' + (i === 0 ? ' first' : '') });
      for (var wk = 0; wk < program.weeks; wk++) {
        if (removed[wk]) {
          // A workout removed from this week is one tall cell down the whole workout.
          if (i === 0) {
            var gone = el('td', { className: 'cell' + (wk === 0 ? ' c0' : ''), rowspan: String(slots.length + 1) }, [
              el('div', { className: 'gone' }, [
                el('span', { text: 'No workout this week' }),
                el('button', { className: 'link-btn', text: 'Restore', onclick: (function (x) { return function () { restoreWorkoutInWeek(workout, x); }; })(wk) })
              ])
            ]);
            row.appendChild(gone);
          }
          continue;
        }
        row.appendChild(renderSlotCell(workout, wi, wk, slot, wk === 0));
      }
      body.appendChild(row);
    });

    var footRow = el('tr', { className: 'foot-row' });
    for (var fw = 0; fw < program.weeks; fw++) {
      if (!removed[fw]) footRow.appendChild(renderFootCell(workout, wi, fw, fw === removed.indexOf(false)));
    }
    body.appendChild(footRow);
  });

  grid.appendChild(el('table', { className: 'grid', style: '--n:' + program.weeks }, [el('thead', null, [headRow]), body]));

  // After an exercise was added, the cursor goes back into that workout's Add exercise box.
  if (addFocusWorkout !== null) {
    var again = grid.querySelector('.add-input[data-wi="' + addFocusWorkout + '"]');
    addFocusWorkout = null;
    if (again) again.focus();
  }
}

function render() {
  closeMenu();
  var header = document.getElementById('header');
  var workspace = document.getElementById('workspace');
  var lib = document.getElementById('library');
  var profileBox = document.getElementById('profile');
  document.getElementById('save-warning').hidden = draftSaved;
  document.getElementById('profile-changed').hidden = true;   // only the editor shows it (below)
  if (profileOpenId !== null && findProfile(profileOpenId)) {
    header.hidden = true;
    workspace.hidden = true;
    lib.hidden = true;
    profileBox.hidden = false;
    renderProfile();
    return;
  }
  profileOpenId = null;
  profileBox.hidden = true;
  if (libraryOpen) {
    header.hidden = true;
    workspace.hidden = true;
    lib.hidden = false;
    renderLibrary();
    return;
  }
  lib.hidden = true;
  header.hidden = false;
  workspace.hidden = false;
  renderHeader();
  updateProfileBar();
  if (!findSelected()) selected = null;
  renderGrid();
  renderDetail();   // the panel's width changes the grid's, so measure after it is drawn
  updateMainWidth();
}

// Tells the workout bands how wide the visible grid area is, so a band stays readable when the
// program is wider than the window and scrolls sideways.
function updateMainWidth() {
  var main = document.getElementById('main');
  document.getElementById('grid').style.setProperty('--mainw', Math.max(300, main.clientWidth - 40) + 'px');
}
window.addEventListener('resize', updateMainWidth);

/* ==========================================================================
   LIBRARY SCREEN (Phase 2 spec 1.1)
   Step 1 shows one section, "Not linked to an athlete", holding every program. It is TEMPORARY:
   athlete blocks arrive in step 3 and programs move under them. Everything that belongs only to
   that section is in renderUnlinkedSection(); removing the section later means deleting that
   function and its one call in renderLibrary().
   ========================================================================== */

var unlinkedOpen = true; // step 1 has no other section, so it starts open (spec: collapsed once athletes exist)

function openLibrary() {
  libraryOpen = true;
  render();
}

function openFromLibrary(entry) {
  setCurrent(entry);
  libraryOpen = false;
  render();
}

function plural(n, word) {
  return n + ' ' + word + (n === 1 ? '' : 's');
}

function duplicateProgram(entry) {
  var copy = JSON.parse(JSON.stringify(entry.program));
  copy.name = (entry.program.name + ' copy').slice(0, 200);
  var added = addProgramEntry(copy, entry.kind);
  added.note = entry.note;
  saveLibrary();
  showNotice('Duplicated.');
  render();
}

// Does a program have kg loads that are already filled in (not blank)?
function hasKgLoads(prog) {
  return prog.workouts.some(function (w) {
    return w.exercises.some(function (ex) {
      return ex.weeks.some(function (week) { return week.groups.some(function (g) { return g.loadType === 'kg' && g.load !== null; }); });
    });
  });
}

// Saves a copy of a program as a template: same structure and prescriptions, with the calculated kg
// values cleared (a template is for any athlete, so it carries no personal weights).
function saveAsTemplate(entry) {
  var copy = JSON.parse(JSON.stringify(entry.program));
  copy.name = (entry.program.name + ' (template)').slice(0, 200);
  copy.source = null;        // a template is for any athlete
  copy.profileUsed = null;
  copy.workouts.forEach(function (w) {
    w.exercises.forEach(function (ex) {
      ex.weeks.forEach(function (week) { week.groups.forEach(function (g) { g.kg = null; }); });
    });
  });
  addProgramEntry(copy, 'template');   // kg loads typed by hand are kept; templates may use kg
  saveLibrary();
  showNotice('Saved as a template.');
  render();
}

function renameProgram(entry) {
  var input = textInput(entry.program.name, { maxlength: '200', 'aria-label': 'Program name' });
  var error = el('div', { className: 'form-error' });
  function save() {
    var name = input.value.trim();
    if (name === '') { error.textContent = 'Enter a name.'; return; }
    entry.program.name = name;
    entry.name = name;
    entry.modified = new Date().toISOString();
    closeModal();
    saveLibrary();
    render();
  }
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); });
  openModal({
    title: 'Rename program',
    body: el('div', null, [formRow('Name', input), error]),
    actions: [
      el('button', { text: 'Cancel', onclick: closeModal }),
      el('button', { className: 'primary', text: 'Save', onclick: save })
    ]
  });
  input.focus();
  input.select();
}

// Deleting the open program opens the most recent other one, or a new empty program if it was the last.
function deleteProgram(entry) {
  showConfirm({
    title: 'Delete "' + entry.name + '"?',
    text: 'This cannot be undone.',
    confirmLabel: 'Delete',
    onConfirm: function () {
      library = library.filter(function (e) { return e !== entry; });
      if (library.length === 0) addProgramEntry(createDefaultProgram());
      if (entry.id === currentId) setCurrent(mostRecentEntry());
      saveLibrary();
      render();
    }
  });
}

function renderProgramRow(entry, nested) {
  var p = entry.program;
  var isCurrent = entry.id === currentId;
  var isTemplate = entry.kind === 'template';
  var open = function () { openFromLibrary(entry); };
  // One visible action for each row: a template is used for an athlete, a program is opened. A click
  // on the name opens the item too. The other actions are in the menu.
  var acts = [isTemplate
    ? el('button', { text: 'Use for athlete', onclick: function () { openGenerateDialog({ template: entry }); } })
    : el('button', { text: 'Open', onclick: open })];

    var items = [];

    return items;
  }));
  var detail = plural(p.weeks, 'week') + ' × ' + plural(p.workoutsPerWeek, 'workout');
  if (p.source && p.source.templateName) detail += ' · from ' + p.source.templateName;

  return el('div', { className: 'lib-row' + (isCurrent ? ' current' : '') + (nested ? ' nested' : '') }, [

// The Templates section (above the athletes): reusable programs, newest edited first.
function renderTemplatesSection() {
  var wrap = el('div');
  var sorted = library.filter(function (e) { return e.kind === 'template'; })
    .sort(function (a, b) { return a.modified < b.modified ? 1 : a.modified > b.modified ? -1 : 0; });

// TEMPORARY section (see the note above): every program that is not a template, newest edited first.
function renderUnlinkedSection() {
  var wrap = el('div');
  var sorted = library.filter(function (e) { return e.kind !== 'template' && !isLinkedProgram(e); })
    .sort(function (a, b) { return a.modified < b.modified ? 1 : a.modified > b.modified ? -1 : 0; });

    className: 'lib-sect', role: 'button', tabindex: '0', 'aria-expanded': unlinkedOpen ? 'true' : 'false',

  ])));
  if (unlinkedOpen && sorted.length === 0) {
    wrap.appendChild(el('div', { className: 'lib-row' }, [el('div', { className: 't dim', text: 'No programs here. "New program" at the top of the page makes a blank program.' })]));
  }

// "never", or "dd/mm/yyyy (N days ago)", and whether to show it as a warning.
function lastExportInfo() {
  var iso = libraryReadLastExport();
  if (!iso) return { text: 'never', stale: true };
  var days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days < 0) days = 0;
  return { text: formatDate(iso) + (days === 0 ? ' (today)' : ' (' + plural(days, 'day') + ' ago)'), stale: days > EXPORT_REMINDER_DAYS };
}

function renderLibraryFooter() {
  var used = libraryStorageChars();
  var mb = used / (1024 * 1024);
  var share = Math.min(100, Math.round(used / STORAGE_LIMIT_CHARS * 100));
  var label = (mb < 0.1 ? '<0.1' : mb.toFixed(1)) + ' MB';
  var last = lastExportInfo();
  return el('div', { className: 'lib-foot' }, [
    el('span', null, [
      el('span', { text: 'Last backup: ' }),
      el('span', { className: last.stale ? 'stale' : null, text: last.text })
    ]),
    el('span', { className: 'grow' }),
    el('span', null, [
      el('span', { text: 'Browser storage: ' + label + ' of about 5 MB' }),
      el('span', { className: 'meter' + (share >= 80 ? ' warn' : '') }, [el('i', { style: 'width:' + share + '%' })])
    ])
  ]);
}

function renderLibrary() {
  var box = document.getElementById('library');
  var oldBody = box.querySelector('.lib-body');
  var scrollTop = oldBody ? oldBody.scrollTop : 0;
  box.textContent = '';
  // "Import" opens a menu with the three kinds of file that the builder can read.

  importBtn.addEventListener('click', function () {
    openMenu(importBtn, [
      { text: 'Import program file', onClick: importProgramFile },

      { text: 'Restore backup', onClick: importEverything }
    ]);
  });
  box.appendChild(el('div', { className: 'lib-bar' }, [
    el('span', { className: 'title', text: 'Library' }),
    el('div', { className: 'spacer' }, [
      importBtn,
      el('button', { text: 'Back up everything', title: 'Save templates, athletes and programs in one file', onclick: exportEverything }),
      el('button', { className: 'primary', text: 'New program', title: 'Make a blank program', onclick: function () { openNewProgramDialog(); } })
    ])
  ]));

  box.appendChild(body);
  box.appendChild(renderLibraryFooter());   // always at the bottom of the page

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Send to GymLog</title>
<style>
  /* The phone end of "Send to phone": the Program Builder packs a GymLog import file into the
     link after "#1.". This page unpacks it and copies the text, so it can be pasted into
     GymLog's Import. Nothing is stored and nothing is sent: the part after "#" stays on the phone.
     Same tokens as GymLog. */
  :root {
    color-scheme: dark;
    --bg: #0B0D0C;
    --raised: #1A1E1B;
    --line: #343A35;
    --control: #5E675F;
    --text: #EDEEEA;
    --text-2: #A3ABA3;
    --accent: #C6FF3D;
    --danger: #FF7566;
    --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --r-control: 8px;
    --f-label: 13px; --f-body: 16px; --f-name: 18px; --f-title: 24px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0 auto; max-width: 520px;
    padding: calc(env(safe-area-inset-top, 0px) + var(--s6)) var(--s4) calc(env(safe-area-inset-bottom, 0px) + var(--s6));
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
    font-size: var(--f-body); line-height: 1.4;
  }
  h1 { font-size: var(--f-title); font-weight: 600; margin: 0 0 var(--s2); }
  .sub { color: var(--text-2); margin: 0 0 var(--s5); }
  .name { font-size: var(--f-name); font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  .facts { color: var(--text-2); font-size: var(--f-label); margin: var(--s2) 0 var(--s5); }
  .btn {
    display: block; width: 100%; min-height: 52px; padding: 0 var(--s4);
    font: inherit; font-weight: 600; font-size: var(--f-name);
    border-radius: var(--r-control); border: 1px solid var(--control);
    background: transparent; color: var(--text); cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn + .btn { margin-top: var(--s3); }
  .status { min-height: 1.4em; margin: var(--s3) 0 0; font-weight: 600; text-align: center; }
  .status.ok { color: var(--accent); }
  .status.bad { color: var(--danger); }
  .steps { margin: var(--s5) 0 0; padding: var(--s4) 0 0 var(--s5); border-top: 1px solid var(--line); color: var(--text-2); }
  .steps li + li { margin-top: var(--s2); }
  .steps b { color: var(--text); font-weight: 600; }
  textarea {
    display: block; width: 100%; height: 160px; margin-top: var(--s4); padding: var(--s3);
    background: var(--raised); color: var(--text); border: 1px solid var(--control); border-radius: var(--r-control);
    font: 13px/1.3 ui-monospace, Menlo, monospace;
  }
  .error { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Send to GymLog</h1>
<p class="sub" id="lead">Opening the program…</p>

<div id="ready" hidden>
  <p class="name" id="progName"></p>
  <p class="facts" id="progFacts"></p>
  <button class="btn primary" type="button" id="copyBtn">Copy Program</button>
  <p class="status" id="status" role="status"></p>
  <ol class="steps">
    <li>Open <b>GymLog</b>.</li>
    <li>Go to <b>Settings</b>, <b>Program Management</b>, <b>Import</b>.</li>
    <li>Touch and hold the empty text box, then tap <b>Paste</b>.</li>
    <li>Tap <b>Check File</b>.</li>
  </ol>
  <button class="btn" type="button" id="showBtn" hidden>Show the text</button>
  <textarea id="text" readonly hidden aria-label="Program text"></textarea>
</div>

<p class="error" id="error" hidden></p>

<script>
(function () {
  'use strict';
  var lead = document.getElementById('lead');
  var text = '';   // the GymLog import file, as JSON text

  function fail(message) {
    lead.hidden = true;
    var box = document.getElementById('error');
    box.textContent = message;
    box.hidden = false;
  }

  // "#1.<code>": 1 is the link format; the code is base64url text of the deflate-raw packed JSON.
  function readCode() {
    var hash = location.hash.slice(1);
    if (hash.indexOf('1.') !== 0) return null;
    return hash.slice(2);
  }

  function base64urlToBytes(code) {
    var b64 = code.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function unpack(code) {
    var stream = new Blob([base64urlToBytes(code)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text();
  }

  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  function show(data) {
    var workouts = data.workouts;
    var entries = workouts.reduce(function (n, w) { return n + (Array.isArray(w.exercises) ? w.exercises.length : 0); }, 0);
    var name = data.program && typeof data.program.name === 'string' && data.program.name.trim() !== '' ? data.program.name : 'Program';
    document.getElementById('progName').textContent = name;
    document.getElementById('progFacts').textContent = plural(workouts.length, 'workout') + ' · ' + entries + (entries === 1 ? ' exercise entry' : ' exercise entries');
    document.title = name + ' · Send to GymLog';
    lead.textContent = 'Copy the program, then paste it into GymLog.';
    document.getElementById('ready').hidden = false;
  }

  // Old way to copy, for browsers without navigator.clipboard: select a hidden box and copy.
  function copyOldWay() {
    var box = document.createElement('textarea');
    box.value = text;
    box.setAttribute('readonly', '');
    box.style.position = 'fixed'; box.style.top = '0'; box.style.opacity = '0';
    document.body.appendChild(box);
    box.focus();
    box.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(box);
    return ok;
  }

  function setStatus(message, good) {
    var s = document.getElementById('status');
    s.textContent = message;
    s.className = 'status ' + (good ? 'ok' : 'bad');
  }

  function copied() { setStatus('Copied. Now open GymLog.', true); }
  function notCopied() {
    setStatus('Could not copy. Tap "Show the text" below.', false);
    document.getElementById('showBtn').hidden = false;
  }

  document.getElementById('copyBtn').addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(copied, function () { if (copyOldWay()) copied(); else notCopied(); });
    } else if (copyOldWay()) {
      copied();
    } else {
      notCopied();
    }
  });

  // Last resort: the text in a box, with all of it selected.
  document.getElementById('showBtn').addEventListener('click', function () {
    var box = document.getElementById('text');
    box.value = text;
    box.hidden = false;
    box.focus();
    box.setSelectionRange(0, text.length);
  });

  var code = readCode();
  if (code === null || code === '') { fail('This link has no program in it. In the Program Builder, use "Send to phone" to make a new link.'); return; }
  if (typeof DecompressionStream === 'undefined') { fail('This browser is too old to open the link. Update iOS, or download the file in the Program Builder instead.'); return; }
  try { base64urlToBytes(code); } catch (e) { fail('This link is broken. It may have been cut short. Make a new link in the Program Builder.'); return; }
  unpack(code).then(function (result) {
    var data = JSON.parse(result);
    if (!data || typeof data !== 'object' || !Array.isArray(data.workouts) || data.workouts.length === 0) throw new Error('not a program');
    text = JSON.stringify(data, null, 2);
    show(data);
  }).catch(function () {
    fail('This link is broken. It may have been cut short. Make a new link in the Program Builder.');
  });
})();
</script>
</body>
</html>
